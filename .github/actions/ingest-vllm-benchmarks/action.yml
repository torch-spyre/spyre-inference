name: Ingest vLLM benchmarks into ClickHouse
description: >
  Read the vLLM benchmark JSON files in a directory and insert their rows into
  ClickHouse via .github/scripts/ingest_vllm_benchmarks.py. This is the single
  ingest implementation for spyre-inference perf: the perf job in
  _test_matrix.yaml calls it INLINE on the card runner, because on a public repo
  benchmark numbers must not be uploaded as world-readable artifacts. Secrets
  cannot reach a composite action, so the caller passes the ClickHouse
  connection as plain inputs.

inputs:
  results-dir:
    description: Directory to read for benchmark *.json. Empty = skip.
    required: false
    default: ''
  workflow:
    description: Workflow name recorded against the rows.
    required: false
    default: vLLM Benchmark
  branch:
    description: Branch recorded against the rows.
    required: false
    default: ''
  sha:
    description: Commit sha recorded against the rows.
    required: false
    default: ''
  run-id:
    description: Triggering run id recorded against the rows.
    required: false
    default: ''
  job-id:
    description: Job id recorded against the rows.
    required: false
    default: '0'
  pr-number:
    description: PR number associated with the rows (0 on non-PR runs).
    required: false
    default: '0'
  arch:
    description: >-
      Hardware architecture the benchmark ran on. Folded into the run_id hash, so a wrong
      value mints a run_id that joins to nothing. Defaulted rather than required to keep
      existing callers working, but pass it explicitly on any non-x86 leg.
    required: false
    default: x86_64
  v2-run-id:
    description: >-
      An ALREADY-DERIVED v2 run_id (uuid). Jenkins passes the orchestrator's params.RUN_ID
      here and it is used verbatim. Leave empty on Actions, where the id is derived from
      run-id + arch + test-type instead.
    required: false
    default: ""
  test-type:
    description: Tier for the run_id hash; 'perf' for a benchmark leg.
    required: false
    default: perf
  rpm-lock:
    description: >-
      Path to spyre-rpms.lock, used ONLY on a direct Actions run. Such a leg has no built
      image to point at -- it restores a cache keyed on this file and builds nothing -- so the
      file IS the identity of the stack under test, and each pinned RPM's artifact_id is
      derived from it and linked to this run. IGNORED when v2-run-id is set: that is the
      Jenkins path, where the orchestrator has already written the artifact_results row for
      the same run_id and linking again would duplicate it. Empty also disables the link.
    required: false
    default: spyre-rpms.lock
  clickhouse-host:
    description: ClickHouse host. Empty = skip the whole ingest (clean no-op).
    required: false
    default: ''
  clickhouse-port:
    description: ClickHouse port (default 8123 inside the script).
    required: false
    default: ''
  clickhouse-user:
    description: ClickHouse user.
    required: false
    default: ''
  clickhouse-pass:
    description: ClickHouse password.
    required: false
    default: ''
  clickhouse-db:
    description: ClickHouse database.
    required: false
    default: ''
  clickhouse-db-v2:
    description: >-
      Schema-v2 database NAME, not a second connection: one instance holds both
      generations, so the same client serves both provided every v2 statement is
      qualified. Empty makes the v2 write (benchmarks / benchmark_runs / the artifact
      link) a clean no-op, leaving results_v3 and run_metadata untouched.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # ingest_vllm_benchmarks.py reads CLICKHOUSE_HOST as required and --results-dir
    # as required. So the no-op gate MUST live here: when the connection is not
    # configured, or no JSON is present, set configured=false and every later
    # step is a no-op. This lets a caller without ClickHouse secrets (or a run
    # that produced no benchmark JSON) pass cleanly.
    - name: Gate on ClickHouse config and results
      id: gate
      shell: bash
      env:
        CH_HOST: ${{ inputs.clickhouse-host }}
        RESULTS_DIR: ${{ inputs.results-dir }}
      run: |
        if [ -z "${CH_HOST}" ]; then
          echo "::notice::ClickHouse host not configured; skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        elif [ -z "${RESULTS_DIR}" ]; then
          echo "::notice::No results-dir provided; skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        elif [ "$(find "${RESULTS_DIR}" -name '*.json' 2>/dev/null | wc -l)" -eq 0 ]; then
          echo "::warning::No benchmark JSON in ${RESULTS_DIR}; skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up uv
      if: steps.gate.outputs.configured == 'true'
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Set up ingest venv
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      run: |
        # Build the ingest venv in the workspace, NOT the baked spyre-inference
        # venv, so the ingest deps never perturb the product environment.
        uv venv "${RUNNER_TEMP}/ingest-venv"
        source "${RUNNER_TEMP}/ingest-venv/bin/activate"
        uv pip install clickhouse-connect
        # Shared v2 identity, schema model and write path live in torch-spyre.
        uv pip install \
          "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest"

    - name: Ingest benchmark results into ClickHouse
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        CLICKHOUSE_HOST: ${{ inputs.clickhouse-host }}
        CLICKHOUSE_PASS: ${{ inputs.clickhouse-pass }}
        # Port/user/db are optional. Only export them when non-empty: the script
        # reads PORT via int(os.environ.get("CLICKHOUSE_PORT") or "8123"), and an
        # empty user/db would override the client defaults.
        CH_PORT_IN: ${{ inputs.clickhouse-port }}
        CH_USER_IN: ${{ inputs.clickhouse-user }}
        CH_DB_IN: ${{ inputs.clickhouse-db }}
        CH_DB_V2_IN: ${{ inputs.clickhouse-db-v2 }}
      run: |
        source "${RUNNER_TEMP}/ingest-venv/bin/activate"
        [ -n "${CH_PORT_IN}" ] && export CLICKHOUSE_PORT="${CH_PORT_IN}"
        [ -n "${CH_USER_IN}" ] && export CLICKHOUSE_USER="${CH_USER_IN}"
        [ -n "${CH_DB_IN}" ] && export CLICKHOUSE_DB="${CH_DB_IN}"
        [ -n "${CH_DB_V2_IN}" ] && export CLICKHOUSE_DB_V2="${CH_DB_V2_IN}"
        # Invoke by path: the script's own directory is sys.path[0], so its
        # sibling `from utils import ...` resolves without extra PYTHONPATH.
        python3 .github/scripts/ingest_vllm_benchmarks.py \
          --results-dir "${{ inputs.results-dir }}" \
          --workflow "${{ inputs.workflow }}" \
          --branch "${{ inputs.branch }}" \
          --sha "${{ inputs.sha }}" \
          --gha-run-id "${{ inputs.run-id }}" \
          --job-id "${{ inputs.job-id }}" \
          --pr-number "${{ inputs.pr-number }}" \
          --arch "${{ inputs.arch }}" \
          --v2-run-id "${{ inputs.v2-run-id }}" \
          --test-type "${{ inputs.test-type }}" \
          --rpm-lock "${{ inputs.rpm-lock }}"
