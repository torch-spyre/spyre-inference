name: Run matrix test config
description: >-
  Sets up the test environment (setup-test-env) and runs one _test_matrix.yaml
  matrix leg through JUnit upload. Shared by the `test` and `test_retry` jobs so
  the pod-level retry doesn't need its own copy of every step.

inputs:
  cfg:
    description: Display name of this matrix config (matrix.cfg)
    required: true
  test_target:
    description: Makefile target to run (matrix.test_target)
    required: true
  durations_run_id:
    description: >-
      Run id (resolved once by the resolve_durations job) whose test-durations
      artifact this leg downloads to weight its shard partition by recorded
      per-test runtime. Empty or missing artifact -> heuristic fallback.
    required: false
    default: ''
  test_type:
    description: >-
      Raw test tier this run was invoked as; resolved via `make print-test-type` and
      exported as SPYRE_TEST_TIER. Recorded on the run row, never as a case tag.
      Empty = Makefile default.
    required: false
    default: ''
  test_types:
    description: >-
      Every tier this leg's tests belong to, whitespace-separated (the matrix entry's own
      `test_types`). Exported as SPYRE_TEST_TIERS, one testtype__<tier> tag each. Empty
      falls back to test_type.
    required: false
    default: ''
  leg_arch:
    description: >-
      Arch this leg's tests run on, hashed into run_id by the ingest. Defaults to the test
      host's own arch.
    required: false
    default: ''
  runner_labels:
    description: JSON array string of the runs-on labels the caller resolved to, forwarded to gather-runner-info
    required: true
  job_slot:
    description: Unique per-job-attempt slot (e.g. strategy.job-index, or retry-<index>) used to scope the inductor cache dir and the coverage-data artifact name
    required: true
  retry:
    description: When 'true' (called from the pod-level retry job), adds "(pod-level retry)" to log/report names and overwrites the first attempt's JUnit artifact, keeping its failures as result.prior_* properties
    required: false
    default: 'false'
  use_prebaked_image:
    description: Forwarded to setup-test-env
    required: true
  storage_root:
    description: Repo-scoped uv-cache root on the shared mount, forwarded to the uv-nfs-cache action (e.g. $STORAGE_1_DIR/.cache/uv)
    required: true
  compile_cache_root:
    description: Repo-scoped compile-cache root on the shared mount (e.g. $STORAGE_1_DIR/.cache/compile); empty = compile cold, no Spyre kernel cache
    required: false
    default: ''
  torch_spyre_ref:
    description: Branch, tag, or SHA of torch-spyre to build from source (empty = use the pinned rev)
    required: false
    default: ''
  rpm_names:
    description: Space-separated list of override RPM names to download and install (empty = baseline only)
    required: false
    default: ''
  rpm_location:
    description: The Artifactory location to download override RPMs from
    required: false
    default: ''
  artifactory_user:
    required: false
    default: ''
  artifactory_api_key:
    required: false
    default: ''
  artifactory_base_url:
    required: false
    default: ''
  artifactory_rpm_path:
    required: false
    default: ''
  hf_token:
    description: HF token for the public-model cache step (empty on fork PRs, which then download anonymously)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up the test environment
      uses: ./.github/actions/setup-test-env
      with:
        use_prebaked_image: ${{ inputs.use_prebaked_image }}
        uv_cache_root: ${{ inputs.storage_root }}
        runner_labels: ${{ inputs.runner_labels }}
        torch_spyre_ref: ${{ inputs.torch_spyre_ref }}
        rpm_names: ${{ inputs.rpm_names }}
        rpm_location: ${{ inputs.rpm_location }}
        artifactory_user: ${{ inputs.artifactory_user }}
        artifactory_api_key: ${{ inputs.artifactory_api_key }}
        artifactory_base_url: ${{ inputs.artifactory_base_url }}
        artifactory_rpm_path: ${{ inputs.artifactory_rpm_path }}
        hf_token: ${{ inputs.hf_token }}

    # cache_dir() defaults to one path shared by every pod on this PVC-mounted runner pool, which raced concurrent jobs' writes (#591). A job-scoped dir keeps writes private; reuse across jobs comes only from the restore below.
    - name: Use a job-scoped torch inductor compile cache dir
      shell: bash
      run: echo "TORCHINDUCTOR_CACHE_DIR=${RUNNER_TEMP}/inductor-cache-${{ inputs.job_slot }}-${{ github.run_id }}" >> "$GITHUB_ENV"

    # Seeds the job-scoped dir from earlier jobs on the same lockfiles. Off when torch-spyre or the
    # RPMs are overridden, since the lockfiles then no longer describe the stack.
    - name: Restore compile cache (NFS)
      id: compile-cache
      if: ${{ inputs.compile_cache_root != '' && inputs.use_prebaked_image != 'true' && inputs.torch_spyre_ref == '' && inputs.rpm_names == '' }}
      continue-on-error: true
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 -I .github/scripts/nfs_compile_cache.py restore \
          --nfs-root "${{ inputs.compile_cache_root }}" \
          --local-dir "$TORCHINDUCTOR_CACHE_DIR" \
          --manifest "${RUNNER_TEMP}/compile-cache-manifest.txt" \
          --key-file uv.lock --key-file spyre-rpms.lock \
          --event-name "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --pr-number "$PR_NUMBER"
        echo "SPYRE_KERNEL_CACHE=1" >> "$GITHUB_ENV"

    # All shard jobs of a suite must weight the partition from the SAME durations
    # file or they'd compute different partitions and drop/double-run tests, so
    # the run id is pinned once (resolve_durations job) and every leg downloads
    # that one run's artifact. Missing artifact / no pin -> plugin falls back to
    # its static heuristic weights (continue-on-error keeps the leg running).
    # gh is not installed on the self-hosted Spyre runners, so download the pinned
    # durations with the artifacts action (cross-run) instead of `gh run download`.
    # Not continue-on-error: a leg that silently fell back to heuristic weights would
    # compute a different partition than its siblings and drop or double-run tests.
    # A non-empty run id means resolve_durations already saw the artifact, so a
    # failed download is a real error to surface (and retry), not a reason to fall
    # back; the no-pin case is handled by the `if` above, not by swallowing errors.
    - name: Download pinned test durations
      if: ${{ inputs.durations_run_id != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test-durations
        path: ${{ runner.temp }}/test-durations
        run-id: ${{ inputs.durations_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        digest-mismatch: warn

    - name: Point the sharder at the pinned durations
      if: ${{ inputs.durations_run_id != '' }}
      shell: bash
      run: |
        f="${RUNNER_TEMP}/test-durations/test-durations.json"
        if [ ! -f "$f" ]; then
          echo "::error::pinned durations run ${{ inputs.durations_run_id }} was downloaded but $f is missing"
          exit 1
        fi
        echo "SPYRE_TEST_DURATIONS=$f" >> "$GITHUB_ENV"
        echo "Weighting shards by durations from run ${{ inputs.durations_run_id }}"

    # This leg records its own slice's per-test runtimes here; the durations
    # fan-in job merges every leg's file into the next run's pinned artifact.
    - name: Record this leg's test durations
      shell: bash
      run: echo "SPYRE_TEST_DURATIONS_OUT=${RUNNER_TEMP}/durations-${{ inputs.job_slot }}.json" >> "$GITHUB_ENV"

    # Marker expression and coverage wiring both live in the Makefile test_target; COVERAGE=1 drops .coverage.* data files for the fan-in.
    # Bounded so a wedged card acquisition (a blocking open() on a contended /dev/vfio device) cannot hang the job silently -- failing here keeps the step's log and lets the post steps publish JUnit.
    # The bound lives on the caller's step (`timeout-minutes` in _test_matrix.yaml): composite
    # action steps don't support that key, and a shell `timeout` here would bound only make,
    # which vLLM's workers outlive by double-forking and holding the `tee` pipe open.
    - name: Run tests
      shell: bash
      env:
        RAW_TEST_TYPE: ${{ inputs.test_type }}
        RAW_TEST_TYPES: ${{ inputs.test_types }}
      run: |
        echo "Running tests for config: ${{ inputs.cfg }}${{ inputs.retry == 'true' && ' (pod-level retry)' || '' }}..."
        # An empty TEST_TYPE fails the Makefile's validation, so omit the arg and
        # let its default apply rather than passing "".
        if [ -n "${RAW_TEST_TYPE}" ]; then
          SPYRE_TEST_TIER="$(make -s print-test-type TEST_TYPE="${RAW_TEST_TYPE}")"
        else
          SPYRE_TEST_TIER="$(make -s print-test-type)"
        fi
        export SPYRE_TEST_TIER
        echo "Resolved SPYRE_TEST_TIER=${SPYRE_TEST_TIER}"
        # Verbatim, not via print-test-type: that resolves ONE tier and would collapse
        # the declared set.
        export SPYRE_TEST_TIERS="${RAW_TEST_TYPES}"
        echo "Declared SPYRE_TEST_TIERS=${SPYRE_TEST_TIERS:-<unset, falling back to ${SPYRE_TEST_TIER}>}"
        # Tee the test output to PID 1's stdout so the Cloud Logs fluent-bit DaemonSet
        # (which only reads pod stdout via /var/log/containers) captures it; a plain run:
        # step's output is intercepted by the runner agent and never reaches pod stdout.
        # pipefail preserves test failures; without writable PID 1 stdout, use ordinary step output.
        set -o pipefail
        if [[ -w /proc/1/fd/1 ]]; then
          make ${{ inputs.test_target }} COVERAGE=1 JUNIT_XML=junit-${{ inputs.test_target }}.xml 2>&1 | tee /proc/1/fd/1
        else
          make ${{ inputs.test_target }} COVERAGE=1 JUNIT_XML=junit-${{ inputs.test_target }}.xml
        fi
        echo "tests done"

    # Green legs only: a failing leg may be failing because of what it compiled.
    - name: Save compile cache delta (NFS)
      if: ${{ steps.compile-cache.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 -I .github/scripts/nfs_compile_cache.py save \
          --nfs-root "${{ inputs.compile_cache_root }}" \
          --local-dir "$TORCHINDUCTOR_CACHE_DIR" \
          --key "${{ steps.compile-cache.outputs.cache-key }}" \
          --manifest "${RUNNER_TEMP}/compile-cache-manifest.txt" \
          --name "${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.job_slot }}" \
          --event-name "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --pr-number "$PR_NUMBER"

    # Raw per-process data files; their host/pid suffixes are unique across jobs, so the fan-in's `make coverage` combines them without a per-job step. if-no-files-found=ignore covers configs that measured nothing.
    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ inputs.job_slot }}
        path: .coverage.*
        include-hidden-files: true # .coverage.* are dotfiles
        if-no-files-found: ignore
        retention-days: 14

    # This leg's {nodeid: seconds} slice, merged by the durations fan-in job into the next run's pinned partition weights. if-no-files-found=ignore: a leg that ran nothing (all skipped) writes no file.
    - name: Upload test durations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: durations-data-${{ inputs.job_slot }}
        path: ${{ runner.temp }}/durations-${{ inputs.job_slot }}.json
        if-no-files-found: ignore
        retention-days: 14

    # The arch this leg ran on, for the workflow_run ingest: it is pinned to x86_64, so it
    # cannot read the test host's arch, and arch is hashed into run_id -- a wrong value mints
    # an id that joins to nothing. The sidecar supplies the ingest's leg arch;
    # platform__ case tags carry run context and are excluded from test_case_id.
    - name: Record leg arch for the ingest
      if: always()
      shell: bash
      env:
        LEG_ARCH: ${{ inputs.leg_arch }}
      run: printf '%s' "${LEG_ARCH:-$(uname -m)}" > "leg-arch-${{ inputs.test_target }}.txt"

    # The overwrite below would erase the first attempt's failures, so they are kept on the
    # retry's report as result.prior_* properties (result.retried=pod marks every case).
    - name: Download the first attempt's JUnit results
      if: ${{ always() && inputs.retry == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: junit-${{ inputs.test_target }}
        path: ${{ runner.temp }}/replaced-junit
        digest-mismatch: warn

    - name: Mark the retry's JUnit results
      if: ${{ always() && inputs.retry == 'true' }}
      shell: bash
      env:
        CFG: ${{ inputs.cfg }}
        NEW_XML: junit-${{ inputs.test_target }}.xml
        REPLACED_XML: ${{ runner.temp }}/replaced-junit/junit-${{ inputs.test_target }}.xml
        # Stdlib-only, so fetched by path rather than installed; @main, like the ingest that reads its marks.
        MARK_RETRIED_URL: https://raw.githubusercontent.com/torch-spyre/torch-spyre/main/extensions/clickhouse-ingest/spyre_clickhouse_ingest/mark_retried.py
      run: |
        warn() {
          echo "::warning::$1"
          echo "- :warning: ${CFG}: $1" >> "$GITHUB_STEP_SUMMARY"
        }
        if [[ ! -f "$NEW_XML" ]]; then
          # Without this the overwriting upload would carry only the leg-arch file.
          if [[ -f "$REPLACED_XML" ]]; then
            cp "$REPLACED_XML" "$NEW_XML"
            warn "retry wrote no JUnit XML; re-uploading the first attempt's report"
          fi
          exit 0
        fi
        args=("$NEW_XML")
        if [[ -f "$REPLACED_XML" ]]; then
          args+=("$REPLACED_XML")
        else
          warn "first attempt left no JUnit XML; marking the retry without prior outcomes"
        fi
        helper="${RUNNER_TEMP}/mark_retried.py"
        curl -fsSL --retry 3 -o "$helper" "$MARK_RETRIED_URL" \
          && python3 -I "$helper" pod "${args[@]}" \
          || warn "could not mark $NEW_XML as retried; uploading it unmarked"

    # Consumed by the test-report fan-in (_test_matrix.yaml) and the ClickHouse
    # ingest (push-to-clickhouse.yaml); no per-leg dorny publish -- the fan-in is
    # the one aggregate report. overwrite: a pod-level retry replaces its first
    # attempt's file.
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: junit-${{ inputs.test_target }}
        path: |
          junit-${{ inputs.test_target }}.xml
          leg-arch-${{ inputs.test_target }}.txt
        retention-days: 14
        overwrite: ${{ inputs.retry }}
