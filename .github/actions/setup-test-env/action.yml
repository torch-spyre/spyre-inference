name: Set up the test environment
description: >-
  The only place a test or benchmark job gets its Spyre stack: the locked RPMs plus
  a synced workspace venv, or with use_prebaked_image the image's RPMs and venv as
  they are (a venv synced here would carry wheels built against other RPMs).

inputs:
  use_prebaked_image:
    description: "'true' to use the runner image's RPMs and venv as they are"
    required: true
  uv_cache_root:
    description: Repo-scoped uv-cache root on the shared mount, forwarded to the uv-nfs-cache action (e.g. $STORAGE_1_DIR/.cache/uv)
    required: true
  runner_labels:
    description: JSON array string of the runs-on labels the caller resolved to, forwarded to gather-runner-info
    required: true
  torch_spyre_ref:
    description: Branch, tag, or SHA of torch-spyre to build from source (empty = the pinned rev)
    required: false
    default: ''
  rpm_names:
    description: Space-separated override RPM names to layer on top (empty = none)
    required: false
    default: ''
  rpm_location:
    description: Artifactory location to download override RPMs from
    required: false
    default: ''
  artifactory_user:
    required: false
    default: ''
  artifactory_api_key:
    required: false
    default: ''
  artifactory_base_url:
    required: false
    default: ''
  artifactory_rpm_path:
    required: false
    default: ''
  hf_token:
    description: HF token for the public-model cache step (empty on fork PRs, which then download anonymously)
    required: false
    default: ''

outputs:
  src_dir:
    description: The spyre-inference tree installed in the active venv (a git checkout).
    value: ${{ steps.src.outputs.dir }}

runs:
  using: composite
  steps:
    # On a prebaked image the checkout is unbuilt, so running from it would shadow the
    # baked tree's spyre_inference._C kernels.
    - name: Locate the tree under test
      id: src
      shell: bash
      env:
        PREBAKED: ${{ inputs.use_prebaked_image }}
      run: |
        if [[ "${PREBAKED}" == "true" ]]; then
          echo "dir=/home/senuser/spyre-inference" >> "$GITHUB_OUTPUT"
        else
          echo "dir=${GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Spyre RPMs
      if: ${{ inputs.use_prebaked_image != 'true' }}
      uses: ./.github/actions/spyre-rpm-install

    # setup-uv's own cache prunes the PyPI wheels; the shared-mount cache below keeps them.
    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: false

    - name: uv cache (NFS)
      if: ${{ inputs.use_prebaked_image != 'true' }}
      uses: ./.github/actions/uv-nfs-cache
      with:
        storage-root: ${{ inputs.uv_cache_root }}

    - name: Install override Spyre RPMs
      if: ${{ inputs.rpm_names != '' }}
      uses: ./.github/actions/override-spyre-rpms
      with:
        rpm_names: ${{ inputs.rpm_names }}
        rpm_location: ${{ inputs.rpm_location }}
        artifactory_user: ${{ inputs.artifactory_user }}
        artifactory_api_key: ${{ inputs.artifactory_api_key }}
        artifactory_base_url: ${{ inputs.artifactory_base_url }}
        artifactory_rpm_path: ${{ inputs.artifactory_rpm_path }}

    - name: Gather runner info
      uses: ./.github/actions/gather-runner-info
      with:
        runner_labels: ${{ inputs.runner_labels }}

    - name: Download kernels wheel
      if: ${{ inputs.use_prebaked_image != 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sampling-kernels-wheel
        path: ${{ runner.temp }}/kernels-wheel
        digest-mismatch: warn

    - name: Build spyre-inference
      if: ${{ inputs.use_prebaked_image != 'true' }}
      shell: bash
      env:
        TORCH_SPYRE_REF: ${{ inputs.torch_spyre_ref }}
        SPYRE_KERNELS_WHEEL_DIR: ${{ runner.temp }}/kernels-wheel
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        if [[ -n "$TORCH_SPYRE_REF" ]]; then
          # The image bakes UV_NO_SYNC=1, which uv rejects alongside --frozen on `uv add`.
          UV_NO_SYNC=0 uv add --frozen \
            "torch-spyre @ git+https://github.com/torch-spyre/torch-spyre@${TORCH_SPYRE_REF}"
          uv sync --verbose --group dev
        else
          uv sync --frozen --verbose --group dev
        fi
        uv pip show torch
        uv pip freeze

    # The kernel tests skip when the extension is absent, so a run that builds the workspace must check it here.
    - name: Check the csrc/ kernels load
      if: ${{ inputs.use_prebaked_image != 'true' }}
      shell: bash
      run: |
        .venv/bin/python -c "from spyre_inference.v1.sample.sampling_kernels import has_sampling_kernels; assert has_sampling_kernels(), 'the sampling kernels did not build or load; see the Build spyre-inference step'"

    # Recipes repoint themselves (AIU_SETUP_CMD); this covers the non-recipe uv steps.
    - name: Activate the freshly-built venv
      if: ${{ inputs.use_prebaked_image != 'true' }}
      shell: bash
      run: |
        echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
        echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

    - name: Ensure public HF models cached
      shell: bash
      env:
        HF_HUB_OFFLINE: '0'
        # Scoped to this step: test steps stay offline and token-free.
        HF_TOKEN: ${{ inputs.hf_token }}
      run: uv run .github/cache_config/manage_cache.py --public
