name: Install locked Spyre RPMs
description: >
  Finds the RPMs for the current spyre-rpms.lock on the shared NFS mount, or
  in the GHA cache when the mount has none, extracts them into user-space via
  rpm2cpio, and wires LD_LIBRARY_PATH.

runs:
  using: composite
  steps:
    # populate-rpm-cache publishes each lock's RPMs here. GHA cache downloads
    # stall on some pods and abort at the Azure SDK's fixed 100s read timeout.
    - name: Find RPMs on NFS
      id: rpm-nfs
      shell: bash
      env:
        NFS_RPMS: /storage-1/spyre-inference/.cache/spyre-rpms/x86_64/${{ hashFiles('spyre-rpms.lock') }}
      run: |
        if [[ -d "$NFS_RPMS" ]]; then
          echo "Using RPMs from ${NFS_RPMS}"
          echo "dir=${NFS_RPMS}" >> "$GITHUB_OUTPUT"
        else
          echo "No RPMs at ${NFS_RPMS}; falling back to the GHA cache"
        fi

    - name: Restore RPM cache
      id: rpm-cache
      if: steps.rpm-nfs.outputs.dir == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/spyre-rpms
        key: spyre-rpms-x86_64-${{ hashFiles('spyre-rpms.lock') }}

    - name: Fail on RPM cache miss
      if: steps.rpm-nfs.outputs.dir == '' && steps.rpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::error::RPM cache miss for spyre-rpms-x86_64-${{ hashFiles('spyre-rpms.lock') }}. Trigger the populate-rpm-cache workflow to populate it."
        exit 1

    - name: Extract RPMs
      shell: bash
      env:
        RPM_DIR: ${{ steps.rpm-nfs.outputs.dir || '/tmp/spyre-rpms' }}
      run: |
        set -euo pipefail
        SPYRE_LIBS="${RUNNER_TEMP}/spyre-libs"
        ARCH="x86_64"
        mkdir -p "$SPYRE_LIBS"
        # The lock pins commits, not filenames, so glob the cached RPM for each
        # expected package. `-[0-9]` anchors on the version so e.g. ibm-deeptools
        # does not also match ibm-deeptools-devel.
        while IFS= read -r name; do
          [[ -z "$name" ]] && continue
          shopt -s nullglob
          matches=( "${RPM_DIR}/${name}"-[0-9]*."${ARCH}".rpm )
          shopt -u nullglob
          if [[ ${#matches[@]} -eq 0 ]]; then
            echo "::error::No cached RPM for package '${name}' (arch ${ARCH})."
            exit 1
          fi
          for rpm in "${matches[@]}"; do
            echo "Extracting $(basename "$rpm")..."
            rpm2cpio "$rpm" | (cd "$SPYRE_LIBS" && cpio -idm 2>/dev/null)
          done
        done < <(python3 .github/scripts/resolve_rpms.py names)
        # Otherwise senlib reads its boot sequence and configs from the image's /opt/ibm/spyre.
        python3 -I .github/scripts/relocate_spyre_libs.py "$SPYRE_LIBS"
        NEW_PATHS=$(find "$SPYRE_LIBS/opt/ibm/spyre" -maxdepth 2 -type d -name "lib" | sort | tr '\n' ':' | sed 's/:$//')
        echo "LD_LIBRARY_PATH=${NEW_PATHS}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
        # Point SENTIENT_BASE_INSTALL_DIR at our extracted RPMs and clear the
        # _IBM_AIU_SETUP guard so that ibm-aiu-setup.sh re-derives all install
        # paths (RUNTIME_INSTALL_DIR, DEEPTOOLS_INSTALL_DIR, etc.) from it in
        # subsequent steps rather than using the stale image-baked /opt/ibm/spyre.
        echo "SENTIENT_BASE_INSTALL_DIR=${SPYRE_LIBS}/opt/ibm/spyre" >> "$GITHUB_ENV"
        echo "_IBM_AIU_SETUP=" >> "$GITHUB_ENV"
        # No RPM owns components.txt, and the image bakes LIB_VERSION_FILE to its
        # own copy, so torch-spyre's kernel cache key would ignore spyre-rpms.lock.
        python3 .github/scripts/write_components_file.py \
          --rpm-dir "$RPM_DIR" \
          --arch "$ARCH" \
          --output "${SPYRE_LIBS}/opt/ibm/spyre/components.txt"
        echo "LIB_VERSION_FILE=${SPYRE_LIBS}/opt/ibm/spyre/components.txt" >> "$GITHUB_ENV"
