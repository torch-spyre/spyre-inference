# Artifacts the benchmark jobs pull from the artifact store into the runner
# cache. The host and root come from the ARTIFACTORY_BASE_URL and
# ARTIFACTORY_DATA_PATH secrets; each group's `path` is under that root and
# each file is verified against its sha256, so a re-dispatch is idempotent.
#
# A fork PR gets no secrets and can only read the cache, which is why whole
# prefixes are mirrored rather than only the files a config consumes today.
# Keep in step with ARTIFACTS/ARCHIVES in ../scripts/fetch_bench_datasets.py.
