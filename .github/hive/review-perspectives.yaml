# Review perspectives for the hive's review swarm, read live from main via review.perspectives_source.
# Built-ins (correctness, security, intent-alignment, style, docs-currency) may omit focus; custom names need it.
# Focus is spliced into a sentence ("Focus ONLY on <focus>.") and a bullet list: one paragraph, at most 2000 bytes.
kind: ReviewPerspectives
perspectives:
  - name: correctness
  - name: security
  - name: intent-alignment
  - name: style
  - name: docs-currency
  - name: spyre-numerics
    focus: >-
      numerical drift on the Spyre path that a green CI run can hide: ops that newly
      reach the device but are routed to CPU by torch-spyre (they raise FallbackWarning,
      defined in torch_spyre/ops/warning_types.py; check the fallback list in
      torch_spyre/ops/fallbacks.py rather than assuming an op is supported); new .cpu()
      round trips or dtype casts (float32 upcasts, bfloat16) inside model, attention,
      sampling or custom-op code; changes to fp16 accumulation order, such as reordered
      or split reductions and matmuls, new chunking, or padding and bucketing that change
      which values are summed together or let padded rows reach live output; and tests
      that loosen rtol/atol, swap the CPU reference, add skip/xfail, or force
      enforce_eager to make a numerics test pass. Name the op or file:line. A tolerance
      change the PR body does not justify is changes_requested
  - name: spyre-hardware-validation
    focus: >-
      whether the change works on the Spyre card this review runs on, and whether its tests
      will actually run in CI. First run it: check out the PR head (git fetch origin
      pull/<number>/head), uv sync --frozen, rm -rf /tmp/torchinductor_*, then run the
      tests the diff adds or changes plus the nearest existing tests of the device code it
      touches, as uv run --no-sync pytest '<node id>' -m "not upstream", one Spyre
      command at a time and never the whole suite. Report each command with its pass,
      fail or skip result. A test needing more cards than spyre_device_count() reports
      here is listed as not run, not as passed. Then scan the tests: TP=2 tests need the
      distributed marker (2-card spyre_pf_x2 jobs), TP=4 tests need distributed_tp4 (the
      one spyre_pf_x4 job); without it a test lands on a 1-card runner and skips itself
      through spyre_device_count() or spyre_available(). A skipif or guard that is true on
      every runner, or a marker that no Makefile test target selects, means CI never runs
      the test. A test that fails or skips here, a test CI would never run, or device code
      no test exercises on the card, is changes_requested. Cite the node ID and the job
