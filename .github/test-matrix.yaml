  test_target: test-distributed-tp4
# torch-spyre backend probes (strict-xfail signals for backend readiness),
# sharded across parallel 2-card jobs. Deliberately NOT in `integration`: a
# strict-xfail flipping to xpass means the backend team shipped support and must
# not block integration runs. Shares the 2-card runner (some probes are TP=2
# native-collective probes). Adding/removing a shard = add/remove an entry here
# and bump PROBE_SHARDS (Makefile default).
