    - linux
  image_label: image_torch_spyre
  test_target: test-attention-smoke
# Distributed (TP=2) suite, sharded across parallel 2-card jobs. Each
# case spawns a TP=2 subprocess pair, so the model-run cases dominate;
# the plugin's weighted partition balances by recorded runtime.
# Not `integration` (it uses the e2e_smoke TP=2 shards). Probes are excluded (dedicated probe job below). Adding/
# removing a shard = add/remove an entry here and bump DIST_SHARDS.
- cfg: Distributed spyre tests (shard 1/3)
  test_types: unit regression trunk
  runs_on:
