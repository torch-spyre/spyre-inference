# The pytest legs of the test matrix (_test_matrix.yaml), one entry per CI job.
#
# The workflow's plan job (.github/scripts/plan_test_matrix.py) schedules only
# the entries whose `test_types` contain the requested tier, so an unselected
# entry costs nothing: no runner, no card, no skipped job in the run.
#
#   cfg          job display name
#   test_types   tiers this entry belongs to (unit | integration | regression | trunk)
#   runs_on      runner labels; the image label is appended from image_label, or
#                replaced by the dispatch's runner_label
#   test_target  Makefile target the job runs; the Makefile owns the marker expression
#
# tests/test_sharding.py checks the *-shard-N entries against the Makefile's
# *_SHARDS counts; resize a suite with the rebalance-test-shards skill.

# Smoke set, sharded across parallel jobs. This carries the compiled
# (enforce_eager=False) tests/e2e/test_compile.py cases -- once a
# separate "Spyre compile tests" job -- which the plugin's weighted
# partition (e2e paths weighted heavy) spreads across the shards so no
# single shard eats the ~20 min the compile job used to.
# Not `integration`: that tier runs the smoke-unit and e2e_smoke shards below.
# Adding/removing a shard = add/remove an entry here and bump
# SMOKE_SHARDS (Makefile default). Marker expression owned by the
# Makefile (test-<name> target); see that target's comment.
- cfg: Non-distributed spyre tests (shard 1/11)
  test_types: unit regression trunk
  runs_on:
    - x86_64
    - spyre_pf_x1
    - linux
  image_label: image_torch_spyre
  test_target: test-smoke-shard-0
- cfg: Non-distributed spyre tests (shard 2/11)
  test_types: unit regression trunk
