# Model-output quality gate: the product-model output checks (model_quality)
# plus the GSM8K accuracy evals (gsm8k). Its own jobs and not in `integration`,
# since every case compiles a product model or starts a vLLM server. Sharded
# across parallel 1-card jobs like smoke/attention, bounded by the slowest single
# case. The plugin owns the weighted partition; QUALITY_SHARDS (Makefile default)
# is the count. Adding/removing a shard = add/remove an entry here and bump that
# default. (The gsm8k evals need the upstream vLLM checkout; the combo's marker
# expression pulls it in automatically, no --upstream flag.)
- cfg: Spyre quality gate (shard 1/8)
