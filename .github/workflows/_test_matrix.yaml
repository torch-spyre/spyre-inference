name: Test matrix (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow, called by test_each_commit.yaml (push/PR/merge_group) and
# integration-tests.yaml (dispatch, including perf). The plan job schedules only the
# legs the tier selects: pytest legs from .github/test-matrix.yaml, or one benchmark
# leg per model for perf.
#
# Each caller supplies its own fan-in gate job (the required-check name lives in
# the caller, since a reusable workflow's internal job names do not surface as
# top-level checks).
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      skip_if_no_changes:
        description: |
          When true (PR flow), the build/test steps run only if source files
          changed. When false (dispatch flow), they always run.
        required: false
        type: boolean
        default: true
      run_id:
        description: >
          UUID identifying this TEST RUN, threaded from the dispatching orchestrator. Uploaded
          as the "run-id" artifact below so push-to-clickhouse.yaml -- which runs on
          workflow_run AFTER this workflow and therefore cannot receive a dispatch input -- can
          recover it and stamp test_case_runs with the same id artifact_results carries.
        required: false
        type: string
        default: ''
      use_prebaked_image:
        # Skips only the "Install Spyre RPMs" step (the spyre-rpm-install
        # action). It does not change the override step or any other step.
        description: When true, skip the "Install Spyre RPMs" step and use the runner image's Spyre stack as-is.
        required: false
        type: boolean
        default: false
      torch_spyre_ref:
        description: Branch, tag, or SHA of torch-spyre to build from source (empty = use the pinned rev)
        required: false
        type: string
        default: ""
      rpm_location:
        description: The Artifactory location where to download override RPMs from
        required: false
        type: string
        default: ""
      rpm_names:
        description: A space separated list of override RPM names to download and install (empty = baseline only)
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or SHA of spyre-inference to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL/owner-name of the spyre-inference fork to check out
          (e.g. "myuser/spyre-inference"); leave empty for the base repo. Used by
          the cross-repo Test-With: flow to test a companion fork/branch.
        required: false
        type: string
        default: ""
      runner_label:
        description: |
          Runner-set IMAGE label to select for runs-on
          (e.g. image_torch_spyre_pr_flex_8ddcf3e155e9). The dispatch flow passes
          a per-PR image label so jobs land on an image with the changed RPM
          baked in. Empty keeps runs on the standing image_torch_spyre set.
        required: false
        type: string
        default: ""
      test_type:
        description: |
          Suite subset to run: unit | integration | regression (default) |
          trunk | perf. These are literal, first-class values -- no
          alias-resolution layer. Selects which of the matrix configs below
          run — each entry declares the test_types it belongs to, and a job
          is skipped unless test_type is in its set:
            unit        — all spyre-native tests (per-op + attention +
                          distributed), excludes the heavy upstream-vLLM
                          suites
            integration — the unit-level smoke tests plus the opt-in
                          e2e_smoke and attention_smoke subsets (1- and
                          2-card jobs); the upstream-dependency dispatch's
                          default
            regression  — every config (default)
            trunk       — push-to-main CI; same coverage as regression
          Same knob and vocabulary as the sibling repos (torch-spyre,
          hf-adapters); the mapping to configs is repo-internal. Validated
          and defaulted (empty -> regression) once in the "Decide whether to
          run" step below, so every caller (Jenkins, config.yaml) sees the
          same behavior.
          The perf value runs the vLLM benchmark suite (the perf job below)
          instead of any pytest config.
        required: false
        type: string
        default: regression
      models:
        description: Perf only. Comma-separated subset of the benchmarked models (empty = all).
        required: false
        type: string
        default: ''
      skip_uv_for_benchmarking:
        description: |
          Perf job only. When true, the benchmark runner bypasses `uv run` and
          calls the active venv's python3 directly (make ... TEST_TYPE=perf
          SKIP_UV_FOR_BENCHMARKING=1). Needed on arches where uv re-resolves the
          project and cannot find a torch/vllm wheel (s390x: torch==2.11.0 has no
          s390x wheel), so uv builds a fresh venv without torch and every
          benchmark fails with "No module named 'torch'". Default false keeps the
          uv path, correct on arches with a resolvable lockfile (amd64, ppc64le).
        required: false
        type: boolean
        default: false
    secrets:
      # Declaring any workflow_call.secrets closes the secrets object for
      # actionlint: every secrets.* used anywhere in this file must then be
      # listed here. So the pre-existing ARTIFACTORY_* (override-RPM install)
      # are declared alongside the new CLICKHOUSE_* (perf ingest). All optional;
      # secrets: inherit at each caller forwards the org/repo secrets present.
      ARTIFACTORY_USER:
        required: false
      ARTIFACTORY_TOKEN:
        required: false
      ARTIFACTORY_BASE_URL:
        required: false
      ARTIFACTORY_RPM_PATH:
        required: false
      # Artifactory root that fetch_bench_datasets.py resolves artifact paths
      # against. Needed only for missing/corrupt traces; fetch failures warn,
      # and selected configs fail if their required trace remains absent.
      ARTIFACTORY_DATA_PATH:
        required: false
      # ClickHouse connection for the perf job's benchmark ingest. A run without
      # them (any non-perf run, or perf with CLICKHOUSE_HOST unset) skips ingest.
      CLICKHOUSE_HOST:
        required: false
      CLICKHOUSE_PORT:
        required: false
      CLICKHOUSE_USER:
        required: false
      CLICKHOUSE_PASS:
        required: false
      CLICKHOUSE_DB:
        required: false
      CLICKHOUSE_DB_V2:
        required: false
      # Public-model cache steps only; empty on fork PRs (anonymous download).
      HF_TOKEN:
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Plan test legs
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      perf_matrix: ${{ steps.plan.outputs.perf_matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      has_perf: ${{ steps.plan.outputs.has_perf }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Get changed source files
        id: changed-src-files
        if: ${{ inputs.skip_if_no_changes }}
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          # Avoid using single or double quotes for multiline patterns.
          files: |
            .github/workflows/test_each_commit.yaml
            .github/workflows/_test_matrix.yaml
            .github/test-matrix.yaml
            .github/actions/override-spyre-rpms/action.yml
            .github/actions/run-matrix-config/action.yml
            .github/actions/spyre-rpm-install/action.yml
            .github/scripts/plan_test_matrix.py
            pyproject.toml
            uv.lock
            spyre-rpms.lock
            tests/**/*.py
            tests/**/*.yaml
            tests/data/**
            spyre_inference/**/*.py
            spyre_inference/**/*.yaml
            csrc/**
            cmake/**
            CMakeLists.txt
            setup.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml

      - name: Plan
        id: plan
        env:
          RAW_TEST_TYPE: ${{ inputs.test_type }}
          MODELS: ${{ inputs.models }}
        run: |
          # Rejects an unknown type, which would otherwise plan nothing and pass.
          RESOLVED_TEST_TYPE="$(make -s print-test-type TEST_TYPE="${RAW_TEST_TYPE}")"
          python3 .github/scripts/plan_test_matrix.py \
            --test-type "${RESOLVED_TEST_TYPE}" --models "${MODELS}" \
            ${{ (inputs.skip_if_no_changes && steps.changed-src-files.outputs.any_changed != 'true') && '--no-changes' || '' }}

      # The threaded run_id has to reach push-to-clickhouse.yaml, which runs on workflow_run
      # AFTER this workflow and so cannot take a dispatch input. An artifact is the channel that
      # ingest ALREADY reads (it enumerates this run's artifacts to find the junit XML), so the
      # uuid rides it rather than needing a new transport or a uuid in the run-name. Skipped when
      # empty, so a GHA-initiated run uploads nothing and the ingest derives its own id.
      - name: Record threaded run_id for the ingest
        if: ${{ inputs.run_id != '' }}
        env:
          THREADED_RUN_ID: ${{ inputs.run_id }}
        run: printf '%s' "${THREADED_RUN_ID}" > run-id.txt
      - name: Upload threaded run_id
        if: ${{ inputs.run_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-id
          path: run-id.txt
          retention-days: 14

  # Pin the test-durations artifact this run's shard jobs weight their partition
  # by: one run id resolved once, so every shard of a suite reads identical
  # durations (a divergent partition would drop or double-run tests). Prefers a
  # passing run on this PR's head branch (so a PR with heavy test changes
  # self-balances), else the base branch. Empty output / no artifact -> the
  # plugin falls back to its static heuristic weights. Informational: never
  # fails the workflow.
  resolve_durations:
    name: Resolve test durations pin
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      durations_run_id: ${{ steps.resolve.outputs.durations_run_id }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Resolve durations run id
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repository || github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 .github/scripts/resolve_durations_run.py

  # One `artifact-id` record per run for push-to-clickhouse's v2 ingest; every matrix leg shares
  # the image and install inputs. Must run on the image under test: the base id lives in its
  # filesystem, but no card, so it takes the cardless pool. The perf legs link their own artifact.
  artifact_identity:
    name: Derive artifact identity
    needs: plan
    if: ${{ needs.plan.outputs.has_tests == 'true' }}
    continue-on-error: true
    runs-on: ${{ fromJSON(format('["x86_64","spyre_pf_x0","linux","{0}"]', inputs.runner_label || (github.event_name == 'merge_group' && 'image_torch_spyre_mq') || 'image_torch_spyre')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: spyre-rpms.lock
          sparse-checkout-cone-mode: false

      # At torch-spyre main, the same ref the v2 ingest action runs, so both use one id formula.
      - name: Checkout the identity library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: torch-spyre/torch-spyre
          ref: main
          path: .torch-spyre-identity
          sparse-checkout: |
            .github/scripts/derive_artifact_id.py
            extensions/clickhouse-ingest
          sparse-checkout-cone-mode: false

      # Same token set as the perf ingest's leg_installed(), so a leg's functional and
      # performance verdicts land on one artifact.
      - name: Describe what this run installs on top of the image
        id: delta
        env:
          PREBAKED: ${{ inputs.use_prebaked_image }}
          RPM_NAMES: ${{ inputs.rpm_names }}
          TORCH_SPYRE_REF: ${{ inputs.torch_spyre_ref }}
        run: |
          SHA="$(git rev-parse HEAD)"
          TOKENS="spyre-inference@${SHA:0:12}"
          if [[ "${PREBAKED}" != "true" ]]; then
            TOKENS="${TOKENS} spyre-rpms.lock@$(sha256sum spyre-rpms.lock | cut -c1-12)"
            if [[ -n "${TORCH_SPYRE_REF}" ]]; then
              TOKENS="${TOKENS} torch-spyre@${TORCH_SPYRE_REF}"
            fi
          fi
          if [[ -n "${RPM_NAMES}" ]]; then
            TOKENS="${TOKENS} ${RPM_NAMES}"
          fi
          echo "installed on top: ${TOKENS}"
          echo "installed=${TOKENS}" >> "$GITHUB_OUTPUT"

      - name: Derive and upload the artifact identity
        uses: torch-spyre/torch-spyre/.github/actions/derive-gha-artifact-id@main
        with:
          component: spyre-inference
          arch: x86_64
          installed: ${{ steps.delta.outputs.installed }}
          library-dir: ${{ github.workspace }}/.torch-spyre-identity

  # Built once so a broken build fails here instead of every leg silently falling back to
  # PyTorch sampling. Prebaked images sync no workspace venv, so they skip it.
  build_kernels:
    name: Build csrc/ sampling kernels
    needs: plan
    if: ${{ !inputs.use_prebaked_image && needs.plan.outputs.has_tests == 'true' }}
    # Same image as the x86_64 test configs, so compiler, glibc and Python match. A compile needs
    # no card, so it takes the card-less pool, which only carries the standing image label.
    runs-on: ${{ fromJSON(format('["x86_64","{0}","linux","{1}"]', (inputs.runner_label || github.event_name == 'merge_group') && 'spyre_pf_x1' || 'spyre_pf_x0', inputs.runner_label || (github.event_name == 'merge_group' && 'image_torch_spyre_mq') || 'image_torch_spyre')) }}
    timeout-minutes: 30
    env:
      STORAGE_1_DIR: /storage-1/spyre-inference
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Key the kernels ccache on this machine's arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # As torch-spyre does: the wheel is rebuilt every run, so it always carries this commit's
      # Python, and a cross-run ccache makes the compile near-free when csrc/ is unchanged. The
      # run-unique key never exact-matches, so the prefix restores the newest entry and the save
      # below can publish a refreshed one (cache entries are immutable).
      - name: Restore kernels ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: spyre-kernels-ccache-${{ steps.arch.outputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spyre-kernels-ccache-${{ steps.arch.outputs.arch }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      # Own root, keyed on pyproject.toml ([build-system] requires): this job runs before every
      # test job, so saving into .cache/uv would publish its slimmer cache under their key first.
      - name: uv cache (NFS)
        uses: ./.github/actions/uv-nfs-cache
        with:
          storage-root: ${{ env.STORAGE_1_DIR }}/.cache/uv-kernels
          key-files: pyproject.toml

      # setup.py only warns on a failed build (the samplers fall back to PyTorch), so check
      # the wheel actually carries the extensions and fail here.
      - name: Build kernels wheel
        id: build
        shell: bash
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh

          # A fixed venv holding only the [build-system] requires, built without isolation: an
          # isolated build gets a fresh temp env (and torch include path) every run, which ccache
          # would hash as a different compile.
          uv venv .venv-kernels
          mapfile -t reqs < <(.venv-kernels/bin/python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["build-system"]["requires"]))')
          # torch from the pytorch-cpu index, its own deps (setuptools>=82 etc.) from PyPI.
          uv pip install --python .venv-kernels --torch-backend cpu "${reqs[@]}"

          if command -v ccache >/dev/null; then
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE" \
              CCACHE_NOHASHDIR=1 CCACHE_COMPILERCHECK=content \
              CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime,locale
            mkdir -p "$CCACHE_DIR"
            # Skip the launcher when the image's compiler is already a ccache wrapper.
            if [[ "$(readlink -f "$(command -v c++)")" != */ccache ]]; then
              export CMAKE_ARGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
            fi
            ccache --zero-stats
          else
            echo "::warning::ccache not found on the runner; building the kernels uncached."
          fi

          rm -rf "$RUNNER_TEMP/kernels-wheel"
          uv build --wheel --no-build-isolation --python .venv-kernels/bin/python \
            --out-dir "$RUNNER_TEMP/kernels-wheel"
          if ! unzip -l "$RUNNER_TEMP"/kernels-wheel/spyre_inference-*.whl | grep -q 'spyre_inference/_C'; then
            echo "::error::The csrc/ sampling kernels failed to build; see the output above."
            exit 1
          fi

          # Save only when something compiled: a full hit has nothing new, and re-uploading it
          # every run churns the repo's 10 GB cache quota. Unparsable stats count as dirty.
          if command -v ccache >/dev/null; then
            ccache --show-stats || true
            misses="$({ ccache --print-stats 2>/dev/null || true; } | awk '$1 == "cache_miss" { print $2; exit }')"
            echo "ccache misses this build: ${misses:-unknown}"
            [[ "$misses" == "0" ]] || echo "ccache_dirty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save kernels ccache
        if: ${{ steps.build.outputs.ccache_dirty == 'true' && github.event_name != 'merge_group' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload kernels wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sampling-kernels-wheel
          path: ${{ runner.temp }}/kernels-wheel
          if-no-files-found: error
          retention-days: 1

  test:
    name: 'build and run tests (${{ matrix.cfg }})'
    needs: [plan, resolve_durations, build_kernels]
    if: ${{ !cancelled() && needs.plan.outputs.has_tests == 'true' && (needs.build_kernels.result == 'success' || needs.build_kernels.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    # Compose runner labels from matrix.runs_on and the image label.
    # When inputs.runner_label is set (per-PR dispatch flow), it replaces
    # the standing image label with the per-PR image label; on merge_group the
    # standing label gains the `_mq` suffix to select the merge-queue set.
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || (github.event_name == 'merge_group' && format('{0}_mq', matrix.image_label)) || matrix.image_label)) }}
    # Don't let one failed config fail this job outright -- test_result decides pass/fail after test_retry gets a shot on a fresh pod.
    continue-on-error: true
    timeout-minutes: 720
    env:
      # The CI env var is very important.
      # GitHub actions automatically sets CI=true
      # which causes the pytest inductor tests to fail with AssertionError
      # due to a mix of fallbacks and decompositions.
      # Here we set it to an empty string (or we could also unset it).
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      # Force cache-only: fork PRs have no HF_TOKEN, so Hub revalidation
      # against a gated repo 401s even when the model is on the PVC.
      HF_HUB_OFFLINE: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Cross-repo Test-With: companion fork/branch (empty = base repo / dispatched ref).
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      # Runs the actual build+test for this leg via the shared composite action, so test_retry below can reuse the exact same steps for a fresh-pod retry instead of duplicating them.
      - name: Run matrix config
        # Bounds the whole composite. Warm legs run 27-38min; a cold compile cache (any
        # lockfile change) pushes the gemma-4 vision shard to ~90min, so 150 leaves headroom.
        # NOTE: the runner's Linux kill is single-process, so this ends the job but does not
        # reap a double-forked leftover; the pod is torn down by ARC, which releases the card.
        timeout-minutes: 150
        uses: ./.github/actions/run-matrix-config
        with:
          cfg: ${{ matrix.cfg }}
          test_target: ${{ matrix.test_target }}
          durations_run_id: ${{ needs.resolve_durations.outputs.durations_run_id }}
          test_type: ${{ inputs.test_type }}
          # The declared membership set, not the invoked tier: one testtype__ tag per member,
          # so a later run of another tier reuses this coverage instead of re-running it.
          test_types: ${{ matrix.test_types }}
          # First runs_on label is the arch; the ingest is pinned to x86_64 and cannot read it.
          leg_arch: ${{ matrix.runs_on[0] }}
          # Echo the exact runner-label selectors this job's runs-on used, so keep this expression identical to it.
          runner_labels: ${{ format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || (github.event_name == 'merge_group' && format('{0}_mq', matrix.image_label)) || matrix.image_label) }}
          job_slot: ${{ strategy.job-index }}
          use_prebaked_image: ${{ inputs.use_prebaked_image }}
          storage_root: ${{ env.STORAGE_1_DIR }}/.cache/uv
          compile_cache_root: ${{ env.STORAGE_1_DIR }}/.cache/compile
          torch_spyre_ref: ${{ inputs.torch_spyre_ref }}
          rpm_names: ${{ inputs.rpm_names }}
          rpm_location: ${{ inputs.rpm_location }}
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_api_key: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory_base_url: ${{ secrets.ARTIFACTORY_BASE_URL }}
          artifactory_rpm_path: ${{ secrets.ARTIFACTORY_RPM_PATH }}
          hf_token: ${{ secrets.HF_TOKEN }}

      # Records this leg's matrix entry as a uniquely-named artifact so collect_failed_suites can rebuild a retry matrix without needing this job's own (continue-on-error-muddied) conclusion.
      - name: Save suite descriptor for pod-level retry
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/failed_suite"
          cat > "${RUNNER_TEMP}/failed_suite/suite.json" <<'JSONEOF'
          ${{ toJSON(matrix) }}
          JSONEOF

      # github.run_attempt in the name: the artifacts REST API is run-scoped not attempt-scoped, so a re-run's descriptors from a prior attempt would otherwise retry a suite that already passed.
      - name: Upload failed-suite descriptor
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-suite-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failed_suite/suite.json
          if-no-files-found: error
          retention-days: 1

  # Collect suites that need a pod-level retry: reads the failed-suite-* artifacts uploaded above and rebuilds a retry matrix for test_retry below to consume via fromJSON.
  collect_failed_suites:
    name: Collect suites for pod-level retry
    needs: [plan, test]
    if: ${{ always() && needs.plan.outputs.has_tests == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_failed: ${{ steps.collect.outputs.has_failed }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download failed-suite descriptors and build retry matrix
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect_failed_suites.py

  # Pod-level retry: re-runs, on a brand-new runner pod, exactly the configs collect_failed_suites found failed (no changed-files gate, since these are already known to need running); a config that fails again here is a genuine failure.
  test_retry:
    name: 'build and run tests (${{ matrix.cfg }}) (pod-level retry)'
    needs: [collect_failed_suites, resolve_durations]
    if: ${{ !cancelled() && needs.collect_failed_suites.outputs.has_failed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect_failed_suites.outputs.matrix) }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || (github.event_name == 'merge_group' && format('{0}_mq', matrix.image_label)) || matrix.image_label)) }}
    timeout-minutes: 720
    env:
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      HF_HUB_OFFLINE: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      # Same composite action the `test` job uses -- a pod-level retry runs the exact same steps, just on a fresh pod, so there is no separate copy to keep in sync here.
      - name: Run matrix config (pod-level retry)
        timeout-minutes: 150
        uses: ./.github/actions/run-matrix-config
        with:
          cfg: ${{ matrix.cfg }}
          test_target: ${{ matrix.test_target }}
          durations_run_id: ${{ needs.resolve_durations.outputs.durations_run_id }}
          test_type: ${{ inputs.test_type }}
          # Survives the retry hop: the failed-suite descriptor is toJSON(matrix), so the whole
          # entry -- test_types and runs_on included -- is rebuilt by collect_failed_suites.
          test_types: ${{ matrix.test_types }}
          leg_arch: ${{ matrix.runs_on[0] }}
          runner_labels: ${{ format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || (github.event_name == 'merge_group' && format('{0}_mq', matrix.image_label)) || matrix.image_label) }}
          job_slot: retry-${{ strategy.job-index }}
          retry: 'true'
          use_prebaked_image: ${{ inputs.use_prebaked_image }}
          storage_root: ${{ env.STORAGE_1_DIR }}/.cache/uv
          compile_cache_root: ${{ env.STORAGE_1_DIR }}/.cache/compile
          torch_spyre_ref: ${{ inputs.torch_spyre_ref }}
          rpm_names: ${{ inputs.rpm_names }}
          rpm_location: ${{ inputs.rpm_location }}
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_api_key: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory_base_url: ${{ secrets.ARTIFACTORY_BASE_URL }}
          artifactory_rpm_path: ${{ secrets.ARTIFACTORY_RPM_PATH }}
          hf_token: ${{ secrets.HF_TOKEN }}

  # Test matrix result: decides pass/fail for the `test` matrix (continue-on-error, so always reports "success" itself) by inspecting the pod-level retry outcome; this job's own result is what determines the reusable workflow's overall conclusion.
  test_result:
    name: Test matrix result
    needs: [plan, build_kernels, collect_failed_suites, test_retry, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate combined result
        run: |
          if [[ "${{ needs.plan.result }}" != "success" ]]; then
            echo "::error::Planning the test legs failed (result: ${{ needs.plan.result }})."
            exit 1
          fi
          # A failed kernel build skips every leg, which would otherwise read as a pass.
          if [[ "${{ needs.build_kernels.result }}" != "success" && "${{ needs.build_kernels.result }}" != "skipped" ]]; then
            echo "::error::Building the csrc/ sampling kernels failed (result: ${{ needs.build_kernels.result }})."
            exit 1
          fi
          echo "Suites retried: ${{ needs.collect_failed_suites.outputs.has_failed }}"
          echo "test_retry result: ${{ needs.test_retry.result }}"
          if [[ "${{ needs.collect_failed_suites.outputs.has_failed }}" == "true" && \
                "${{ needs.test_retry.result }}" != "success" ]]; then
            echo "::error::One or more configs still failed after pod-level retry."
            exit 1
          fi
          if [[ "${{ needs.perf.result }}" != "success" && "${{ needs.perf.result }}" != "skipped" ]]; then
            echo "::error::One or more perf benchmark legs failed (result: ${{ needs.perf.result }})."
            exit 1
          fi
          echo "All planned legs passed (directly or after pod-level retry)."

  # ---------------------------------------------------------------------------
  # Coverage fan-in: combine every job's data into one report. Stock runner
  # (needs only the coverage tool + a checkout for .coveragerc and the sources).
  # always() so partial coverage still reports when suites fail; no-op when no
  # data was produced (e.g. all configs skipped).
  # ---------------------------------------------------------------------------
  coverage:
    name: Aggregate coverage
    needs: [plan, test, test_retry]
    if: ${{ always() && needs.plan.outputs.has_tests == 'true' }}
    # Informational -- must never fail the reusable workflow (and thus the
    # callers' required-check gate).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Match the test venv's coverage (uv.lock pin) for data-format compat.
      - name: Install coverage
        run: python -m pip install 'coverage==7.15.2'

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: covdata
          merge-multiple: true
          digest-mismatch: warn

      - name: Combine and report
        run: |
          shopt -s nullglob
          files=(covdata/.coverage.*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage data to aggregate (all suites skipped or failed early)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Combine/report logic lives in the Makefile; COVERAGE_TOOL=coverage
          # uses the pip-installed tool (no venv on this runner).
          make coverage COVERAGE_DATA=covdata COVERAGE_TOOL=coverage
          pct=$(coverage report --rcfile=.coveragerc --format=total)
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 75 ]; then color=green
          elif [ "$pct" -ge 60 ]; then color=yellowgreen
          elif [ "$pct" -ge 40 ]; then color=yellow
          else color=red
          fi
          {
            echo "### Aggregated spyre_inference coverage"
            echo ''
            echo "![coverage](https://img.shields.io/badge/coverage-${pct}%25-${color})"
            echo ''
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Durations fan-in: merge every leg's {nodeid: seconds} slice (each leg wrote
  # its own via the plugin's SPYRE_TEST_DURATIONS_OUT) into the single
  # `test-durations` artifact a LATER run pins and weights its shard partition by
  # (resolve_durations -> run-matrix-config download). Merge, not replace: each
  # leg records only its own shard and no test runs twice in a run, so the union
  # across legs is the whole suite. always() so a run with some failed legs still
  # refreshes the durations of the legs that passed. Informational: never fails
  # the workflow.
  # ---------------------------------------------------------------------------
  durations:
    name: Aggregate test durations
    needs: [plan, test, test_retry]
    if: ${{ always() && needs.plan.outputs.has_tests == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download durations data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: durations-data-*
          path: durations
          merge-multiple: true
          digest-mismatch: warn

      - name: Merge durations
        run: |
          shopt -s nullglob
          files=(durations/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No durations data to aggregate (all suites skipped or failed early)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/merge_test_durations.py durations/*.json \
            --out test-durations.json

      - name: Upload test durations
        if: ${{ hashFiles('test-durations.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: test-durations.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Test-report fan-in: every leg's JUnit XML into one aggregate report on the run
  # Summary page -- totals plus a single flat, ctrl+f-searchable row per test case
  # across all shards (no per-shard rollup, no per-file headings) -- replacing the
  # per-shard dorny checks the matrix used to publish. Rendered directly from the
  # JUnit XML by aggregate_junit_summary.py (mirrors the coverage/durations fan-
  # ins): no dorny, so no check-run to 403 on a fork PR's read-only token, and no
  # coupling to any external tool's markdown. always()/continue-on-error like the
  # other fan-ins; no-op when no leg produced a JUnit file.
  # ---------------------------------------------------------------------------
  test-report:
    name: Aggregate test report
    needs: [plan, test, test_retry]
    if: ${{ always() && needs.plan.outputs.has_tests == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Download JUnit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
          digest-mismatch: warn

      - name: Write aggregate summary
        run: |
          shopt -s nullglob
          files=(junit/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JUnit XML to aggregate (all suites skipped or failed early)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/aggregate_junit_summary.py junit/*.xml

  perf:
    name: Perf benchmarks (${{ matrix.model }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.has_perf == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.perf_matrix) }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || 'image_torch_spyre')) }}
    timeout-minutes: 240
    env:
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      HF_HUB_OFFLINE: '1'
      RESULTS_DIR: benchmark-results
      # The dev image's editable spyre-inference tree (keeps .git), installed into its $VIRTUAL_ENV.
      PREBAKED_SPYRE_INFERENCE_DIR: /home/senuser/spyre-inference
      # The serve configs replay trace files that are not in the repo. Cache
      # them on the same RWX volume as the HuggingFace cache above: it outlives
      # the pod, so the first job to need a trace fetches it and every later job
      # on any runner reads it from the volume. Per-file locks reduce duplicate
      # fetches; cross-pod deduplication depends on NFS locking.
      SPYRE_BENCH_DATA_DIR: /storage-1/spyre-inference/.cache/artifacts
      ARTIFACTORY_BASE_URL: ${{ secrets.ARTIFACTORY_BASE_URL }}
      ARTIFACTORY_DATA_PATH: ${{ secrets.ARTIFACTORY_DATA_PATH }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      # Install the baseline RPMs from spyre-rpms.lock. Skipped when
      # use_prebaked_image is true, so the run uses the image's Spyre stack
      # as-is. See issue #543.
      - name: Install Spyre RPMs
        if: ${{ !inputs.use_prebaked_image }}
        uses: ./.github/actions/spyre-rpm-install

      # Binary only; the cache is shipped from /storage-1 by the uv-nfs-cache
      # steps. See .github/scripts/nfs_uv_cache.py.
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      # Restore now; the post step ships it back at job end (writers only). Prebaked runs build nothing.
      - name: uv cache (NFS)
        if: ${{ !inputs.use_prebaked_image }}
        uses: ./.github/actions/uv-nfs-cache
        with:
          storage-root: ${{ env.STORAGE_1_DIR }}/.cache/uv

      - name: Install override Spyre RPMs
        if: ${{ inputs.rpm_names != '' }}
        uses: ./.github/actions/override-spyre-rpms
        with:
          rpm_names: ${{ inputs.rpm_names }}
          rpm_location: ${{ inputs.rpm_location }}
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_api_key: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory_base_url: ${{ secrets.ARTIFACTORY_BASE_URL }}
          artifactory_rpm_path: ${{ secrets.ARTIFACTORY_RPM_PATH }}

      - name: Gather runner info
        uses: ./.github/actions/gather-runner-info
        with:
          # Echo the exact runner-label selectors this job's runs-on used, so keep this expression identical to it.
          runner_labels: ${{ format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || 'image_torch_spyre') }}

      # Prebaked runs use the image's venv: a cached torch-spyre wheel may be built against other RPMs.
      - name: Build spyre-inference
        if: ${{ !inputs.use_prebaked_image }}
        env:
          TORCH_SPYRE_REF: "${{ inputs.torch_spyre_ref }}"
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          if [[ -n "$TORCH_SPYRE_REF" ]]; then
            # `uv add --frozen` edits pyproject/lock only; the `uv sync` below does
            # the install. The torch-spyre dev image now bakes UV_NO_SYNC=1 (so a bare
            # `uv run` reuses the shared venv instead of re-resolving), but uv rejects
            # UV_NO_SYNC together with `--frozen` on `uv add` ("cannot be used with
            # --frozen"). Shadow it to a false value for this one call so the add
            # succeeds; the surrounding UV_NO_SYNC=1 is unchanged for every other uv run.
            UV_NO_SYNC=0 uv add --frozen \
              "torch-spyre @ git+https://github.com/torch-spyre/torch-spyre@${TORCH_SPYRE_REF}"
            uv sync --verbose --group dev
          else
            uv sync --frozen --verbose --group dev
          fi
          uv pip show torch
          uv pip freeze

      - name: Ensure public HF models cached
        env:
          HF_HUB_OFFLINE: '0'
          # Authenticated cache-miss downloads; anonymous Hub requests get rate-limited.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run .github/cache_config/manage_cache.py --public

      - name: Run vLLM benchmarks
        id: bench
        env:
          # true -> "1" (bypass uv, use the active venv's python3 directly),
          # false -> "" (keep the uv path). The Makefile treats empty as "use uv".
          SKIP_UV_FOR_BENCHMARKING: ${{ inputs.skip_uv_for_benchmarking && '1' || '' }}
          # Writes the sibling {test}.pytorch.json the ingest gets the model from (#679).
          SAVE_TO_PYTORCH_BENCHMARK_FORMAT: '1'
          MODEL: ${{ matrix.model }}
          # Prebaked runs use the image's tree: an unbuilt checkout would shadow its spyre_inference._C kernels.
          SRC_DIR: ${{ inputs.use_prebaked_image && env.PREBAKED_SPYRE_INFERENCE_DIR || '.' }}
        run: |
          make -C "${SRC_DIR}" perf-tests RESULTS_DIR="${GITHUB_WORKSPACE}/${RESULTS_DIR}" MODELS="${MODEL}" \
            SKIP_UV_FOR_BENCHMARKING="${SKIP_UV_FOR_BENCHMARKING}"

      # A dispatch by SHA names no branch; claim the dispatch ref only when it contains the
      # commit, rather than recording the SHA as a branch. curl, not `gh`: the runner image has no
      # gh, and a silent failure here recorded every dispatched run with an empty branch.
      - name: Resolve the tested commit and branch
        id: tested
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_IN: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ inputs.repository || github.repository }}
          SRC_DIR: ${{ inputs.use_prebaked_image && env.PREBAKED_SPYRE_INFERENCE_DIR || '.' }}
        run: |
          SHA="$(git -C "${SRC_DIR}" rev-parse HEAD)" || { echo "::warning::could not read the commit of ${SRC_DIR}; recording the checkout's"; SHA="$(git rev-parse HEAD)"; }
          BRANCH="${REF_IN:-${REF_NAME}}"
          if [[ "${BRANCH}" =~ ^[0-9a-f]{7,40}$ ]]; then
            STATUS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${REPO}/compare/${REF_NAME}...${SHA}?per_page=1" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' 2>/dev/null)" \
              || echo "::warning::could not compare ${REF_NAME}...${SHA}; recording no branch"
            case "${STATUS}" in
              identical|behind) BRANCH="${REF_NAME}" ;;
              *) BRANCH="" ;;
            esac
          fi
          echo "tested ${SHA} on branch '${BRANCH}'"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      # Secrets cannot reach a composite action, so the connection is passed as inputs; the
      # action no-ops without a host or JSON. !cancelled(): a later benchmark failing must not
      # discard the ones that completed.
      - name: Ingest benchmark results into ClickHouse
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ingest-vllm-benchmarks
        with:
          results-dir: ${{ env.RESULTS_DIR }}
          workflow: vLLM Benchmark
          branch: ${{ steps.tested.outputs.branch }}
          sha: ${{ steps.tested.outputs.sha }}
          run-id: ${{ github.run_id }}
          # The orchestrator's run_id, so these rows join the artifact_results it wrote.
          v2-run-id: ${{ inputs.run_id }}
          state: ${{ steps.bench.outcome == 'success' && 'passed' || 'failed' }}
          rpm-lock: ${{ !inputs.use_prebaked_image && 'spyre-rpms.lock' || '' }}
          installed: >-
            ${{ inputs.rpm_names }}
            ${{ inputs.torch_spyre_ref && format('torch-spyre@{0}', inputs.torch_spyre_ref) || '' }}
          job-id: '0'
          pr-number: '0'
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}
