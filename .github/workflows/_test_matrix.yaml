name: Test matrix (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow — not triggered directly. Defines the build + the 6-config
# test matrix once; two entrypoints call it with the same tests but slightly
# different setup:
#
#   test_each_commit.yaml (push/PR/merge_group): skip_if_no_changes=true, so the
#     build/test only runs when source files changed. Installs the locked
#     baseline RPMs (spyre-rpm-install) on the standing image, so every PR
#     builds against the pinned spyre-rpms.lock set.
#
#   integration-tests.yaml (upstream-dependency dispatch): skip_if_no_changes=
#     false (always run). May pass runner_label to pick a per-PR image, rpm_*
#     to layer override RPMs, torch_spyre_ref to build a specific torch-spyre
#     from source, and use_prebaked_image=true to skip the baseline RPM install.
#
# Each caller supplies its own fan-in gate job (the required-check name lives in
# the caller, since a reusable workflow's internal job names do not surface as
# top-level checks).
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      skip_if_no_changes:
        description: |
          When true (PR flow), the build/test steps run only if source files
          changed. When false (dispatch flow), they always run.
        required: false
        type: boolean
        default: true
      use_prebaked_image:
        # Skips only the "Install Spyre RPMs" step (the spyre-rpm-install
        # action). It does not change the override step or any other step.
        description: When true, skip the "Install Spyre RPMs" step and use the runner image's Spyre stack as-is.
        required: false
        type: boolean
        default: false
      torch_spyre_ref:
        description: Branch, tag, or SHA of torch-spyre to build from source (empty = use the pinned rev)
        required: false
        type: string
        default: ""
      rpm_location:
        description: The Artifactory location where to download override RPMs from
        required: false
        type: string
        default: ""
      rpm_names:
        description: A space separated list of override RPM names to download and install (empty = baseline only)
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or SHA of spyre-inference to check out and test
        required: false
        type: string
        default: ""
      repository:
        description: |
          Full clone URL/owner-name of the spyre-inference fork to check out
          (e.g. "myuser/spyre-inference"); leave empty for the base repo. Used by
          the cross-repo Test-With: flow to test a companion fork/branch.
        required: false
        type: string
        default: ""
      runner_label:
        description: |
          Runner-set IMAGE label to select for runs-on
          (e.g. image_torch_spyre_pr_flex_8ddcf3e155e9). The dispatch flow passes
          a per-PR image label so jobs land on an image with the changed RPM
          baked in. Empty keeps runs on the standing image_torch_spyre set.
        required: false
        type: string
        default: ""
      test_type:
        description: |
          Suite subset to run: unit | integration | regression (default) |
          trunk | perf. These are literal, first-class values -- no
          alias-resolution layer. Selects which of the matrix configs below
          run — each entry declares the test_types it belongs to, and a job
          is skipped unless test_type is in its set:
            unit        — all spyre-native tests (per-op + attention +
                          distributed), excludes the heavy upstream-vLLM
                          suites
            integration — fast per-op unit tests only, the smoke suite
                          (1 config, single card)
            regression  — every config (default)
            trunk       — push-to-main CI; same coverage as regression
          Same knob and vocabulary as the sibling repos (torch-spyre,
          hf-adapters); the mapping to configs is repo-internal. Validated
          and defaulted (empty -> regression) once in the "Decide whether to
          run" step below, so every caller (Jenkins, config.yaml) sees the
          same behavior.
          The perf value runs the dedicated perf job below (the vLLM benchmark
          suite), not any of the pytest matrix configs.
        required: false
        type: string
        default: regression
      skip_uv_for_benchmarking:
        description: |
          Perf job only. When true, the benchmark runner bypasses `uv run` and
          calls the prebaked venv's python3 directly (make ... TEST_TYPE=perf
          SKIP_UV_FOR_BENCHMARKING=1). Needed on arches where uv re-resolves the
          project and cannot find a torch/vllm wheel (s390x: torch==2.11.0 has no
          s390x wheel), so uv builds a fresh venv without torch and every
          benchmark fails with "No module named 'torch'". Default false keeps the
          uv path, correct on arches with a resolvable lockfile (amd64, ppc64le).
        required: false
        type: boolean
        default: false
    secrets:
      # Declaring any workflow_call.secrets closes the secrets object for
      # actionlint: every secrets.* used anywhere in this file must then be
      # listed here. So the pre-existing ARTIFACTORY_* (override-RPM install)
      # are declared alongside the new CLICKHOUSE_* (perf ingest). All optional;
      # secrets: inherit at each caller forwards the org/repo secrets present.
      ARTIFACTORY_USER:
        required: false
      ARTIFACTORY_TOKEN:
        required: false
      ARTIFACTORY_BASE_URL:
        required: false
      ARTIFACTORY_RPM_PATH:
        required: false
      # ClickHouse connection for the perf job's benchmark ingest. A run without
      # them (any non-perf run, or perf with CLICKHOUSE_HOST unset) skips ingest.
      CLICKHOUSE_HOST:
        required: false
      CLICKHOUSE_PORT:
        required: false
      CLICKHOUSE_USER:
        required: false
      CLICKHOUSE_PASS:
        required: false
      CLICKHOUSE_DB:
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  # Resolve the user-facing tier alias once, at the job level, so the perf job
  # (which is not one of the matrix configs) can gate on it. Mirrors the sibling
  # torch-spyre workflow's generate_matrix.resolved_test_type output.
  resolve:
    name: Resolve test type
    runs-on: ubuntu-latest
    outputs:
      resolved_test_type: ${{ steps.resolve.outputs.resolved_test_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve
        id: resolve
        env:
          RAW_TEST_TYPE: ${{ inputs.test_type }}
        run: |
          # `make print-test-type` applies the Makefile's default (empty ->
          # regression) and validates the result: it exits non-zero with an
          # ::error:: line if the type is unknown, so this step does not
          # re-check the valid set. Single source of truth for the
          # vocabulary is the Makefile.
          RESOLVED_TEST_TYPE="$(make -s print-test-type TEST_TYPE="${RAW_TEST_TYPE}")"
          echo "resolved_test_type=${RESOLVED_TEST_TYPE}" >> "$GITHUB_OUTPUT"

  test:
    name: 'build and run tests (${{ matrix.cfg }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cfg: Non-distributed spyre tests
            # Fast per-op unit tests: the smoke set (compile split out below).
            test_types: unit integration regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            # Marker expression owned by the Makefile (test-<name> target); see that target's comment.
            test_target: test-smoke
          - cfg: Spyre compile tests
            # Split out of smoke (it was ~20 min of a ~28 min job). MUST keep
            # `integration` in this set: the multi-repo integration hook runs
            # only the integration-tagged configs, so dropping it here would
            # silently lose the torch.compile end-to-end check that guards
            # against upstream-runtime regressions.
            test_types: unit integration regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-compile
          # Decoder attention, sharded across parallel jobs. The compiled
          # (STOCK on device) cases dominate runtime and grow HBM within a
          # process, so each shard is its own job on its own card: wall-clock
          # drops to the slowest shard and per-process HBM growth stays bounded
          # (each shard holds only ~1/N of the compiled cases). The plugin owns
          # the weighted partition; ATTN_SHARDS (Makefile default) is the count.
          # Adding/removing a shard = add/remove an entry here and bump that
          # default. The encoder split runs below.
          - cfg: Spyre attention tests (shard 1/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-0
          - cfg: Spyre attention tests (shard 2/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-1
          - cfg: Spyre attention tests (shard 3/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-2
          - cfg: Spyre attention tests (shard 4/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-3
          - cfg: Spyre attention tests (shard 5/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-4
          - cfg: Spyre attention tests (shard 6/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-5
          - cfg: Spyre attention tests (shard 7/7)
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-attention-shard-6
          - cfg: Encoder attention tests
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-encoder-attention
          - cfg: Distributed spyre tests
            test_types: unit regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x2
              - linux
            image_label: image_torch_spyre
            test_target: test-distributed
          - cfg: Upstream vLLM tests
            # Upstream-vLLM suites are excluded from integration/unit (heavy).
            test_types: regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-upstream
          - cfg: Upstream distributed vLLM tests
            test_types: regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x2
              - linux
            image_label: image_torch_spyre
            test_target: test-upstream-distributed
          - cfg: Upstream model vLLM tests
            test_types: regression trunk
            runs_on:
              - x86_64
              - spyre_pf_x1
              - linux
            image_label: image_torch_spyre
            test_target: test-upstream-model
    # Compose runner labels from matrix.runs_on and the image label.
    # When inputs.runner_label is set (per-PR dispatch flow), it replaces
    # the standing image label with the per-PR image label.
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || matrix.image_label)) }}
    timeout-minutes: 720
    env:
      # The CI env var is very important.
      # GitHub actions automatically sets CI=true
      # which causes the pytest inductor tests to fail with AssertionError
      # due to a mix of fallbacks and decompositions.
      # Here we set it to an empty string (or we could also unset it).
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      # Force cache-only: fork PRs have no HF_TOKEN, so Hub revalidation
      # against a gated repo 401s even when the model is on the PVC.
      HF_HUB_OFFLINE: '1'
      # torch-spyre#3707's HBM pool planner corrupts compiled output and leaks
      # HBM across fallback boundaries; spyre_inference sets this too, but only if
      # nothing has imported torch_spyre before it, so pin it for the whole job.
      HBM_POOL_PLANNING: '0'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Cross-repo Test-With: companion fork/branch (empty = base repo / dispatched ref).
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Get changed source files
        id: changed-src-files
        uses: tj-actions/changed-files@v46
        with:
          # Avoid using single or double quotes for multiline patterns.
          files: |
            .github/workflows/test_each_commit.yaml
            .github/workflows/_test_matrix.yaml
            .github/actions/override-spyre-rpms/action.yml
            .github/actions/spyre-rpm-install/action.yml
            pyproject.toml
            uv.lock
            spyre-rpms.lock
            tests/**/*.py
            tests/**/*.yaml
            spyre_inference/**/*.py
            spyre_inference/**/*.yaml

      # Single run/skip decision for every build+test step below. A job runs
      # only when BOTH hold:
      #   1. the dispatch flow (skip_if_no_changes=false) always passes; the PR
      #      flow passes only when source files changed;
      #   2. this config's test_types set contains the requested test_type
      #      (so test_type selects a subset of the matrix; regression = every
      #      config).
      - name: Decide whether to run
        id: gate
        env:
          RAW_TEST_TYPE: ${{ inputs.test_type }}
        run: |
          # Apply the shared default (empty -> regression) and validate via
          # `make print-test-type` -- the Makefile is the single source of
          # truth for TEST_TYPE resolution, the single choke point every
          # caller (Jenkins, config.yaml) passes through. It also rejects an
          # unknown type (non-zero exit with an ::error:: line): type: choice
          # guards the workflow_dispatch entrypoint, but this reusable
          # workflow_call path accepts any string, and an unknown value would
          # match no config and silently skip every job -> a green run that
          # tested nothing.
          RESOLVED_TEST_TYPE="$(make -s print-test-type TEST_TYPE="${RAW_TEST_TYPE}")"
          # Expose the resolved type so the perf job (which is NOT one of the
          # matrix.cfg entries) can gate itself on it -- same pattern as the
          # sibling torch-spyre workflow's generate_matrix.resolved_test_type.
          echo "resolved_test_type=${RESOLVED_TEST_TYPE}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.skip_if_no_changes }}" == "false" \
             || "${{ steps.changed-src-files.outputs.any_changed }}" == "true" ]]; then
            changed=true
          else
            changed=false
          fi
          # perf is NOT part of the pytest matrix: it runs in the dedicated perf
          # job below, not as any matrix.cfg. So every matrix config skips when
          # test_type=perf (selected=false for all), and only the perf job runs.
          case " ${{ matrix.test_types }} " in
            *" ${RESOLVED_TEST_TYPE} "*) selected=true ;;
            *) selected=false ;;
          esac
          if [[ "$changed" == "true" && "$selected" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Install the baseline RPMs from spyre-rpms.lock. Skipped when
      # use_prebaked_image is true, so the run uses the image's Spyre stack
      # as-is. See issue #543.
      - name: Install Spyre RPMs
        id: spyre-rpms
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.use_prebaked_image }}
        uses: ./.github/actions/spyre-rpm-install

      - name: Set up uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          # Invalidate only on lock changes; setup-uv's default glob also hashes
          # pyproject.toml, so config-only edits would needlessly bust the cache.
          cache-dependency-glob: |
            uv.lock
            spyre-rpms.lock
          # Use local runner temp to avoid ownership/permission issues on $HOME.
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
          # See prune-uv-cache-safe
          prune-cache: false
          # Never save cache for ephemeral merge queue branches
          save-cache: ${{ github.event_name != 'merge_group' }}

      # Layer override RPMs on top of the baseline only when the dispatch flow
      # supplied some (rpm_names). The PR flow leaves rpm_names empty -> skipped.
      - name: Install override Spyre RPMs
        if: ${{ steps.gate.outputs.run == 'true' && inputs.rpm_names != '' }}
        uses: ./.github/actions/override-spyre-rpms
        with:
          rpm_names: ${{ inputs.rpm_names }}
          rpm_location: ${{ inputs.rpm_location }}
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_api_key: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory_base_url: ${{ secrets.ARTIFACTORY_BASE_URL }}
          artifactory_rpm_path: ${{ secrets.ARTIFACTORY_RPM_PATH }}

      - name: Gather runner info
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: ./.github/actions/gather-runner-info
        with:
          # Echo the exact runner-label selectors this job's runs-on used
          # (mirrors the runs-on expression: matrix.runs_on plus the per-PR
          # runner_label override, or the standing matrix.image_label).
          runner_labels: ${{ format('["{0}","{1}"]', join(matrix.runs_on, '","'), inputs.runner_label || matrix.image_label) }}

      - name: Dump UV cache info
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          find "$(uv cache dir)" -name '*.whl' -printf '%f\n' | sort -u

      # Skipped when use_prebaked_image is true: the image already has the pinned stack, and on ppc64le/s390x a uv sync here can't even complete one (Makefile:153-155).
      - name: Build spyre-inference
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.use_prebaked_image }}
        env:
          TORCH_SPYRE_REF: "${{ inputs.torch_spyre_ref }}"
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          if [[ -n "$TORCH_SPYRE_REF" ]]; then
            # Build torch-spyre from the dispatched ref straight from GitHub;
            # --frozen skips resolution during add, the non-frozen sync below
            # resolves everything.
            uv add --frozen \
              "torch-spyre @ git+https://github.com/torch-spyre/torch-spyre@${TORCH_SPYRE_REF}"
            uv sync --verbose --group dev
          else
            uv sync --frozen --verbose --group dev
          fi
          # Print the resolved torch install for log visibility.
          uv pip show torch
          uv pip freeze

      # Same gate as the build step above: on a prebaked run there is no freshly-built workspace venv to point at, and repointing would send tests at an incomplete one instead of the complete baked one.
      - name: Activate the freshly-built venv
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.use_prebaked_image }}
        # Ephemeral -dev-image runners inherit a stale $VIRTUAL_ENV at /home/senuser/.venv (an ancestor of the checkout); repoint AND remove it so `uv run --active` (Makefile:153) can't find or use anything but the venv just built here.
        run: |
          rm -rf /home/senuser/.venv
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      # Slim the cache for setup-uv's post-job save without discarding the
      # compiled torch-spyre/vllm wheels. Must run after the build's uv sync.
      - name: Prune uv cache (safe)
        if: ${{ steps.gate.outputs.run == 'true' && github.event_name != 'merge_group' }}
        uses: ./.github/actions/prune-uv-cache-safe

      - name: Ensure public HF models cached
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          HF_HUB_OFFLINE: '0'
        run: uv run .github/cache_config/manage_cache.py --public

      - name: Use a job-scoped torch inductor compile cache dir
        if: ${{ steps.gate.outputs.run == 'true' }}
        # cache_dir() defaults to one path shared by every pod on this PVC-mounted runner pool; a fixed path let one job's compile reuse (stale XPASS/wrong-output) or race another concurrent job's, so scope it per matrix job instead of clearing the shared one.
        run: echo "TORCHINDUCTOR_CACHE_DIR=${RUNNER_TEMP}/inductor-cache-${{ strategy.job-index }}-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Run tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        # Marker expression and coverage wiring both live in the Makefile
        # test_target. COVERAGE=1 drops .coverage.* data files for the fan-in.
        #
        # Bounded so a wedged card acquisition cannot hang silently: a blocking
        # open() on a contended /dev/vfio device emits no output, so the runner
        # stops heartbeating and the job is reaped server-side with an
        # unfinalized log (no conclusion, no diagnosis). Failing here instead
        # keeps the step's own log and lets the post steps publish JUnit.
        timeout-minutes: 90
        run: |
          echo "Running tests for config: ${{ matrix.cfg }}..."
          make ${{ matrix.test_target }} COVERAGE=1 JUNIT_XML=junit-${{ matrix.test_target }}.xml
          echo "tests done"

      # Raw per-process data files; their host/pid suffixes are unique across
      # jobs, so the fan-in's `make coverage` combines them without a per-job
      # step. if-no-files-found=ignore covers configs that measured nothing.
      - name: Upload coverage data
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: .coverage.*
          include-hidden-files: true  # .coverage.* are dotfiles
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit results
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.test_target }}
          path: junit-${{ matrix.test_target }}.xml
          retention-days: 14

      - name: Publish JUnit test report
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: dorny/test-reporter@v1
        with:
          name: 'Test report (${{ matrix.cfg }})'
          path: junit-${{ matrix.test_target }}.xml
          # dorny/test-reporter@v1 has no python-specific reporter; java-junit
          # parses the generic JUnit-XML schema pytest's --junit-xml emits.
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # Coverage fan-in: combine every job's data into one report. Stock runner
  # (needs only the coverage tool + a checkout for .coveragerc and the sources).
  # always() so partial coverage still reports when suites fail; no-op when no
  # data was produced (e.g. all configs skipped).
  # ---------------------------------------------------------------------------
  coverage:
    name: Aggregate coverage
    needs: test
    if: always()
    # Informational -- must never fail the reusable workflow (and thus the
    # callers' required-check gate).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Match the test venv's coverage (uv.lock pin) for data-format compat.
      - name: Install coverage
        run: python -m pip install 'coverage==7.15.2'

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: covdata
          merge-multiple: true

      - name: Combine and report
        run: |
          shopt -s nullglob
          files=(covdata/.coverage.*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage data to aggregate (all suites skipped or failed early)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Combine/report logic lives in the Makefile; COVERAGE_TOOL=coverage
          # uses the pip-installed tool (no venv on this runner).
          make coverage COVERAGE_DATA=covdata COVERAGE_TOOL=coverage
          pct=$(coverage report --rcfile=.coveragerc --format=total)
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 75 ]; then color=green
          elif [ "$pct" -ge 60 ]; then color=yellowgreen
          elif [ "$pct" -ge 40 ]; then color=yellow
          else color=red
          fi
          {
            echo "### Aggregated spyre_inference coverage"
            echo ''
            echo "![coverage](https://img.shields.io/badge/coverage-${pct}%25-${color})"
            echo ''
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Perf job: the vLLM benchmark suite, on the SAME make entrypoint as the
  # pytest matrix (`make tests TEST_TYPE=perf` -> perf-tests target). It is NOT
  # one of the matrix configs above: perf runs benchmarks, not pytest markers,
  # so it lives in its own job and every matrix config skips when
  # test_type=perf. Weekly-only, like the sibling torch-spyre perf job:
  # benchmarks are long and hardware-contended, never gated on a PR.
  # ---------------------------------------------------------------------------
  perf:
    name: Perf benchmarks (vLLM)
    needs: resolve
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && needs.resolve.outputs.resolved_test_type == 'perf' }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', 'x86_64","spyre_pf_x1","linux', inputs.runner_label || 'image_torch_spyre')) }}
    timeout-minutes: 720
    env:
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      HF_HUB_OFFLINE: '1'
      # torch-spyre#3707's HBM pool planner corrupts compiled output and leaks
      # HBM across fallback boundaries; spyre_inference sets this too, but only if
      # nothing has imported torch_spyre before it, so pin it for the whole job.
      HBM_POOL_PLANNING: '0'
      RESULTS_DIR: benchmark-results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      # Install the baseline RPMs from spyre-rpms.lock. Skipped when
      # use_prebaked_image is true, so the run uses the image's Spyre stack
      # as-is. See issue #543.
      - name: Install Spyre RPMs
        if: ${{ !inputs.use_prebaked_image }}
        uses: ./.github/actions/spyre-rpm-install

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            spyre-rpms.lock
          cache-local-path: ${{ runner.temp }}/setup-uv-cache
          prune-cache: false
          save-cache: ${{ github.event_name != 'merge_group' }}

      - name: Install override Spyre RPMs
        if: ${{ inputs.rpm_names != '' }}
        uses: ./.github/actions/override-spyre-rpms
        with:
          rpm_names: ${{ inputs.rpm_names }}
          rpm_location: ${{ inputs.rpm_location }}
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_api_key: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory_base_url: ${{ secrets.ARTIFACTORY_BASE_URL }}
          artifactory_rpm_path: ${{ secrets.ARTIFACTORY_RPM_PATH }}

      - name: Gather runner info
        uses: ./.github/actions/gather-runner-info
        with:
          # Echo the exact runner-label selectors this job's runs-on used
          # (mirrors the perf runs-on expression: the fixed pool labels plus
          # the per-PR runner_label override, or the standing image label).
          runner_labels: ${{ format('["{0}","{1}"]', 'x86_64","spyre_pf_x1","linux', inputs.runner_label || 'image_torch_spyre') }}

      - name: Build spyre-inference
        env:
          TORCH_SPYRE_REF: "${{ inputs.torch_spyre_ref }}"
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          if [[ -n "$TORCH_SPYRE_REF" ]]; then
            uv add --frozen \
              "torch-spyre @ git+https://github.com/torch-spyre/torch-spyre@${TORCH_SPYRE_REF}"
            uv sync --verbose --group dev
          else
            uv sync --frozen --verbose --group dev
          fi
          uv pip show torch
          uv pip freeze

      - name: Ensure public HF models cached
        env:
          HF_HUB_OFFLINE: '0'
        run: uv run .github/cache_config/manage_cache.py --public

      - name: Run vLLM benchmarks
        env:
          # true -> "1" (bypass uv, use the baked venv's python3 directly),
          # false -> "" (keep the uv path). The Makefile treats empty as "use uv".
          SKIP_UV_FOR_BENCHMARKING: ${{ inputs.skip_uv_for_benchmarking && '1' || '' }}
        run: |
          echo "Running vLLM benchmark suite (TEST_TYPE=perf)..."
          make tests TEST_TYPE=perf RESULTS_DIR="${RESULTS_DIR}" \
            SKIP_UV_FOR_BENCHMARKING="${SKIP_UV_FOR_BENCHMARKING}"
          echo "benchmarks done"

      # Ingest via the reusable composite action, the single ingest
      # implementation (no duplicated logic). Secrets cannot reach a composite
      # action, so the ClickHouse connection is passed as plain inputs. The
      # action gates internally: an empty clickhouse-host (secret unset) or no
      # benchmark JSON is a clean no-op, so this runs unconditionally on
      # non-PR events (fork PRs are already excluded by the job-level if:).
      - name: Ingest benchmark results into ClickHouse
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/ingest-vllm-benchmarks
        with:
          results-dir: ${{ env.RESULTS_DIR }}
          workflow: vLLM Benchmark
          branch: ${{ inputs.ref || github.ref_name }}
          sha: ${{ github.sha }}
          run-id: ${{ github.run_id }}
          job-id: '0'
          pr-number: '0'
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
