name: 'add_or_remove_artifacts_from_cache'

on:
  workflow_dispatch:
    inputs:
      cache_config_file:
        description: 'Path to the models YAML file'
        required: true
        type: string
        default: '.github/cache_config/hf_models_and_datasets.yaml'
      include_datasets:
        description: 'Also fetch artifactory_datasets (needs the ARTIFACTORY_* secrets)?'
        required: true
        type: boolean
        default: true
      force_download:
        description: 'Force re-download even if files exist?'
        # set required to true for the JSON payload to never be null
        required: true
        type: boolean
        default: false

# Prevents multiple runs from updating the same storage simultaneously
concurrency:
  group: 'add_or_remove_model_from_cache'
  # cancel-in-progress: true
  # queue instead to avoid downloads being cancelled early and inconsistent cache state
  # queue: single # this is the default anyway https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency#using-concurrency-in-different-scenarios

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  update_cache:
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_torch_spyre
    timeout-minutes: 720
    env:
      CACHE_CONFIG_FILE_PATH: ${{ inputs.cache_config_file }}
      FORCE_DOWNLOAD: ${{ inputs.force_download }}
      GITHUB_SHA: ${{ github.sha }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      SPYRE_BENCH_DATA_DIR: /storage-1/spyre-inference/.cache/artifacts

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: 'spyre-inference-repo'
          fetch-depth: 1

      - name: Run Caching Script
        working-directory: 'spyre-inference-repo'
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          uv run .github/cache_config/manage_cache.py

      # Separate step so a missing ARTIFACTORY_* secret cannot mask a model
      # caching failure, and so the model cache still updates without it.
      # !cancelled(): one failing gated model must not block the dataset cache,
      # since a re-dispatch would hit the same model failure and never reach here.
      - name: Cache Artifactory datasets
        if: ${{ !cancelled() && inputs.include_datasets }}
        working-directory: 'spyre-inference-repo'
        env:
          ARTIFACTORY_BASE_URL: ${{ secrets.ARTIFACTORY_BASE_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_DATA_PATH: ${{ secrets.ARTIFACTORY_DATA_PATH }}
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          uv run .github/cache_config/manage_cache.py --datasets
