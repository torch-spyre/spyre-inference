name: Check spyre-rpms lock

on:
  pull_request:
    paths:
      - 'spyre-rpms.toml'
      - 'spyre-rpms.lock'
      - 'scripts/spyre_rpms.py'
      - 'scripts/tests/**'
      - '.github/workflows/check_spyre_rpms_lock.yaml'
  push:
    branches: [main]
    paths:
      - 'spyre-rpms.toml'
      - 'spyre-rpms.lock'
      - 'scripts/spyre_rpms.py'
      - 'scripts/tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs everywhere, including a fork PR: no secrets, no network. Re-checks the
  # committed lock's own ABI invariant and runs the resolver's unit tests.
  verify:
    name: ABI invariant (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Verify the committed lock is ABI-coherent
        run: ./scripts/spyre_rpms.py verify -o spyre-rpms.lock

      - name: Resolver unit tests
        run: |
          uv run --isolated --no-project \
            --with pydantic --with requests --with pytest \
            pytest scripts/tests/ -q

  # Reaching Artifactory needs secrets, which a fork PR does not get, so this
  # job is skipped there; the offline `verify` above still gates ABI coherence.
  # It is also skipped until ARTIFACTORY_PLAN_PATH exists (it is a new secret),
  # so the gate reports "not applicable" rather than ignoring a real failure.
  # No action is needed to enable it: adding the secret makes it a hard gate.
  check:
    name: Lock matches input
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # `secrets` is not available in a job-level `if`, so the presence check
      # is a step that exports a flag for the step below.
      - name: Check whether the plan-path secret is configured
        id: cfg
        env:
          ARTIFACTORY_PLAN_PATH: ${{ secrets.ARTIFACTORY_PLAN_PATH }}
        run: |
          if [ -n "${ARTIFACTORY_PLAN_PATH}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARTIFACTORY_PLAN_PATH is not set, so the lock cannot be regenerated here; skipping. The offline \`verify\` job still gates ABI coherence. Setting the secret turns this into a hard gate with no further change."
          fi

      - name: Regenerate the lock and diff it against the committed one
        if: steps.cfg.outputs.configured == 'true'
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_BASE_URL: ${{ secrets.ARTIFACTORY_BASE_URL }}
          ARTIFACTORY_RPM_PATH: ${{ secrets.ARTIFACTORY_RPM_PATH }}
          ARTIFACTORY_PLAN_PATH: ${{ secrets.ARTIFACTORY_PLAN_PATH }}
        run: ./scripts/spyre_rpms.py check -i spyre-rpms.toml -o spyre-rpms.lock
