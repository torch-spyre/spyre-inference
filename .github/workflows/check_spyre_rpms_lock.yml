name: Check spyre-rpms.lock

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'spyre-rpms.lock'
      - 'scripts/lock_spyre_rpms.py'
      - '.github/scripts/resolve_rpms.py'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'spyre-rpms.lock'
      - 'scripts/lock_spyre_rpms.py'
      - '.github/scripts/resolve_rpms.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Check spyre-rpms.lock matches [tool.spyre-rpms]
        run: uv run --no-project python scripts/lock_spyre_rpms.py --verify
