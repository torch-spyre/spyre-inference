name: ci-time-report

# workflow_run because a fork PR's pull_request token cannot comment. It runs with a
# write token, so it must never check out or run PR code; PR artifacts are data only.
on:
  workflow_run:
    workflows:
      - test_each_commit
    types: [completed]

concurrency:
  group: ci-time-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read          # the PR run's and the baseline runs' artifacts
  pull-requests: write   # comment on the PR

jobs:
  report:
    name: CI time report
    # A failed run misses legs, which would read as removed tests.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Report and update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          uv run --no-project --with pyyaml \
            python3 .github/scripts/ci_time_report.py report --run-id "${RUN_ID}" --post
