name: Claude PR Review (on-hardware)
run-name: Claude review of PR #${{ github.event.issue.number || github.event.pull_request.number }}

# ---------------------------------------------------------------------------
# On-demand Claude Code review that runs on the Spyre self-hosted runner so
# the agent can exercise the accelerator
# ---------------------------------------------------------------------------
on:
  issue_comment:
    types: [created]
  # >>> TEMPORARY (remove before merge): lets this be tested from a same-repo
  # branch PR, which -- unlike issue_comment -- runs the PR-branch version of
  # this file with secrets. Every push re-runs it. Only fires for same-repo
  # branches (fork PRs still get no secrets on pull_request).
  pull_request:
    types: [opened, synchronize, reopened]
  # <<< END TEMPORARY

concurrency:
  # Spyre is single-accelerator: the group key serializes a PR's reviews so
  # two never hold the device at once. cancel-in-progress stays FALSE on
  # purpose: a mid-compile run that gets SIGKILLed can leave a half-written
  # torch-spyre compile cache under /storage-1 (CLAUDE.md: interrupted Spyre
  # runs "corrupt device state, or corrupt the compile cache"). A newer trigger
  # queues behind the in-flight review instead of killing it.
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # post the review back to the PR
  issues: write          # PR-level (issue) comments
  actions: read
  # NB: no id-token grant. We run the `claude` CLI directly instead of
  # claude-code-action, so there is no OIDC->Anthropic app-token exchange
  # (that path also demanded the Claude GitHub App). Nothing here contacts
  # Anthropic: model calls go to the LiteLLM proxy, non-essential traffic
  # is disabled, and GitHub auth uses the job's own github.token.

jobs:
  review:
    # issue_comment path: a comment on a PR (not a plain issue), the trigger
    # command, and a commenter that clears a cheap author_association pre-filter.
    # author_association is NOT proof of write access -- COLLABORATOR also covers
    # read/triage collaborators -- so it only avoids spinning the runner for
    # obvious non-members here; the authoritative write-access check is the
    # "Verify commenter has write access" step below, which asks the API.
    #
    # >>> TEMPORARY: the first clause shortcuts the guard for a same-repo branch
    # PR so you can iterate. Remove it (and the pull_request trigger) before merge.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # <<< END TEMPORARY (restore the plain issue_comment guard)
    runs-on:
      - x86_64
      - spyre_pf_x2
      - linux
      - image_torch_spyre
    timeout-minutes: 60
    env:
      # Mirror the test runners
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      HF_HUB_OFFLINE: '1'

    steps:
      # Authoritative access gate (see the if: comment). curl, not gh -- gh is
      # installed further down. Rejects anything below write. Skipped on the
      # TEMPORARY pull_request path, which has no commenter and is already
      # restricted to same-repo branches.
      - name: Verify commenter has write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          perm="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | grep -oP '"permission":\s*"\K[^"]+')"
          echo "Commenter ${ACTOR} has permission: ${perm:-<none>}"
          case "${perm}" in
            admin|write) echo "Authorized." ;;
            *) echo "::error::${ACTOR} lacks write access (${perm:-none}); refusing review." ; exit 1 ;;
          esac

      # issue_comment (the real trigger): checkout with no ref = the trusted
      # default branch. The agent pulls the PR itself (gh pr checkout) when it
      # must run the changed code on hardware.
      # NB: under the TEMPORARY pull_request trigger above, checkout with no ref
      # takes the PR MERGE REF instead, so during branch-PR testing this job
      # runs PR-head code (spyre-rpm-install, uv sync, the prompt file) in the
      # same job that holds the secrets. That exposure goes away with the
      # TEMPORARY block before merge.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Spyre RPMs
        uses: ./.github/actions/spyre-rpm-install

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            spyre-rpms.lock

      - name: Install spyre-inference
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          uv sync --frozen --group dev

      - name: Install Claude Code CLI
        env:
          DISABLE_AUTOUPDATER: '1'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gh is required by /code-review to pull diff and post comments
      - name: Install GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          ver="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/cli/cli/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[^"]+')"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/gh_${ver}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude review
        env:
          # ALL model traffic goes to the enterprise LiteLLM proxy -- never
          # api.anthropic.com. AUTH_TOKEN is sent as `Authorization: Bearer`.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          # Kill every incidental call to Anthropic infrastructure. The
          # umbrella var covers telemetry + error reporting; the auto-updater
          # is a separate switch.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          API_TIMEOUT_MS: '1200000'
          GH_TOKEN: ${{ github.token }}
          SPYRE_KB_MCP_URL: ${{ secrets.SPYRE_KB_MCP_URL }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          # Device env, so the agent's own Bash can reach the accelerator for
          # on-hardware verification (this shell does not inherit it otherwise).
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh

          # Build the MCP config from the secret URL in-shell so the URL stays
          # masked (never interpolated into the rendered workflow).
          mcp_config="{\"mcpServers\":{\"spyre-knowledgebase\":{\"type\":\"http\",\"url\":\"${SPYRE_KB_MCP_URL}\"}}}"

          # CANNED prompt from a committed file -- NOT the comment body. Any
          # text a maintainer types after /claude-review is ignored.
          prompt="$(sed "s/__PR_NUMBER__/${PR_NUMBER}/" .github/claude-review-prompt.txt)"

          # This CLI build does NOT provide a github_inline_comment MCP server
          # /code-review --comment posts through the gh CLI fallback.
          # --strict-mcp-config blocks any stray .mcp.json from loading in the untrusted-diff 
          # context.
          claude -p "$prompt" \
            --model claude-opus-4-8 \
            --max-turns 60 \
            --mcp-config "$mcp_config" \
            --strict-mcp-config \
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checkout:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh api:*),Bash(uv run:*),Bash(git diff:*),Bash(git log:*),mcp__spyre-knowledgebase" \
            --output-format text
