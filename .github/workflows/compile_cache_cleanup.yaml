name: compile_cache_cleanup

# Evicts superseded keys and stale PR scopes from the NFS compile cache that the test
# matrix restores from (see CI.md). Runs nightly, off the test jobs' critical path.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: compile_cache_cleanup

permissions:
  contents: read

jobs:
  cleanup:
    # Card-less pool: this only touches the /storage-1 mount.
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_torch_spyre
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Evict old compile cache keys
        run: python3 -I .github/scripts/nfs_compile_cache.py cleanup --nfs-root /storage-1/spyre-inference/.cache/compile
