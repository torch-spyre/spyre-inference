name: Environment file confirmation

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]

permissions:
  checks: write
  contents: read
  issues: write
  # PR comments use the issues API but require pull-request write permission.
  pull-requests: write

# queue: max so a newer run (even a skipped ordinary comment) cannot evict a
# pending one.
concurrency:
  group: >-
    environment-file-confirmation-${{
      github.event.pull_request.number || github.event.issue.number ||
      github.event.merge_group.head_sha
    }}
  queue: max

jobs:
  confirm-environment-files:
    name: Environment file policy runner
    # Coarse prefilter only; the script decides what counts as a command.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '/confirm-environment-changes')) ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate confirmation
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = '<!-- environment-file-confirmation';
            const policyHeader = new RegExp(
              '^<!-- environment-file-confirmation' +
              '(?: confirmed-sha=([0-9a-f]{40}) confirmed-base=(\\S+)' +
              ' confirmed-files=(\\S+))? -->\\n',
            );
            const policyAuthor = 'github-actions[bot]';
            const checkName = 'Environment file confirmation';
            const protectedFiles = new Set([
              'pyproject.toml',
              'uv.lock',
              'spyre-rpms.lock',
            ]);
            const {owner, repo} = context.repo;

            const listProtectedChanges = async (pull) => {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              // listFiles stops at 3000 files; fail closed if it was truncated.
              if (files.length < pull.changed_files) {
                return {files: [...protectedFiles], truncated: true};
              }
              const changed = files.flatMap(({filename, previous_filename}) =>
                [filename, previous_filename].filter(
                  (name) => name && protectedFiles.has(name),
                ));
              return {files: [...new Set(changed)], truncated: false};
            };

            const findPolicyComment = async (issue_number) => {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number, per_page: 100},
              );
              return comments.find(({body, user}) =>
                user?.login === policyAuthor && policyHeader.test(body ?? ''));
            };

            const isConfirmed = (comment, pull, files) => {
              const [, sha, base, confirmedFiles] =
                comment?.body?.match(policyHeader) ?? [];
              return sha === pull.head.sha
                && base === pull.base.ref
                && files.every((file) => confirmedFiles.split(',').includes(file));
            };

            const updatePolicyComment = async (
              pull, existing, files, truncated, confirmed,
            ) => {
              const commandSha = pull.head.sha.slice(0, 12);
              const state = confirmed
                ? ` confirmed-sha=${pull.head.sha} confirmed-base=${pull.base.ref}`
                  + ` confirmed-files=${files.join(',')}`
                : '';
              const status = confirmed
                ? `Confirmed for commit \`${commandSha}\` against \`${pull.base.ref}\`.`
                : [
                    `@${pull.user.login}, did you intend to change these environment files?`,
                    '',
                    ...files.map((file) => `- \`${file}\``),
                    '',
                    ...(truncated
                      ? [
                          'This PR changes more files than the GitHub API can list, '
                            + 'so none of them can be ruled out.',
                          '',
                        ]
                      : []),
                    'The PR author or a repository maintainer with `maintain` or `admin` permission must confirm by commenting:',
                    '',
                    `\`/confirm-environment-changes ${commandSha}\``,
                    '',
                    'Confirmation applies only to this commit and base branch, and is reset by the next push.',
                  ].join('\n');
              const body = `${marker}${state} -->\n${status}`;

              if (existing?.body === body) return;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull.number,
                  body,
                });
              }
            };

            const acceptCommand = async (pull, command) => {
              const match = command.match(
                /^\/confirm-environment-changes\s+([0-9a-f]{7,40})$/i,
              );
              const requestedSha = match?.[1].toLowerCase();
              const shaMatches = Boolean(requestedSha)
                && pull.head.sha.startsWith(requestedSha);
              const commenter = context.payload.comment.user.login;
              let authorized = commenter === pull.user.login;

              if (!authorized) {
                try {
                  const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner,
                    repo,
                    username: commenter,
                  });
                  authorized = ['admin', 'maintain'].includes(data.permission);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const accepted = authorized && shaMatches;
              if (!accepted) {
                core.warning(
                  authorized
                    ? `Confirmation does not match current head ${pull.head.sha}`
                    : `${commenter} is not allowed to confirm this change`,
                );
              }
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: context.payload.comment.id,
                content: accepted ? '+1' : '-1',
              });
              return accepted;
            };

            // Also check open PRs sharing this head commit and base branch
            // for unconfirmed environment-file changes.
            const otherBlockers = async (pull) => {
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                base: pull.base.ref,
                per_page: 100,
              });
              const blockers = [];
              for (const {number, head} of openPulls) {
                if (number === pull.number || head.sha !== pull.head.sha) continue;
                const {data: other} = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: number,
                });
                const {files, truncated} = await listProtectedChanges(other);
                if (files.length === 0) continue;
                const comment = await findPolicyComment(number);
                if (!isConfirmed(comment, other, files)) {
                  blockers.push({number, files, truncated});
                }
              }
              return blockers;
            };

            const setCheck = async (sha, blockers) => {
              const conclusion = blockers.length === 0 ? 'success' : 'action_required';
              const summary = blockers.length === 0
                ? 'No unconfirmed environment file changes were found.'
                : blockers.map(({number, files, truncated}) =>
                    `#${number}: confirmation is required for ${files.join(', ')}`
                    + (truncated ? ' (changed-file list truncated)' : ''),
                  ).join('\n');
              const {data} = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                check_name: checkName,
                per_page: 100,
              });
              const existing = data.check_runs
                .filter(({name, app}) =>
                  name === checkName && app?.slug === 'github-actions')
                .sort((a, b) => b.id - a.id)[0];
              const params = {
                owner,
                repo,
                name: checkName,
                status: 'completed',
                conclusion,
                output: {title: checkName, summary},
              };

              if (existing) {
                await github.rest.checks.update({
                  ...params,
                  check_run_id: existing.id,
                });
              } else {
                await github.rest.checks.create({...params, head_sha: sha});
              }
            };

            let pullNumber;
            let checkSha;
            if (context.eventName === 'merge_group') {
              const match = context.payload.merge_group.head_ref.match(/\/pr-(\d+)-/);
              if (!match) {
                throw new Error(
                  `Cannot determine PR from ${context.payload.merge_group.head_ref}`,
                );
              }
              pullNumber = Number(match[1]);
              checkSha = context.payload.merge_group.head_sha;
            } else {
              pullNumber = context.payload.pull_request?.number
                ?? context.payload.issue.number;
            }

            // Every run reconciles the current PR state, whatever triggered it.
            const {data: pull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const {files, truncated} = await listProtectedChanges(pull);
            const policyComment = await findPolicyComment(pull.number);
            let confirmed = files.length === 0
              || isConfirmed(policyComment, pull, files);

            if (context.eventName === 'issue_comment') {
              const command = context.payload.comment.body.trim();
              if (/^\/confirm-environment-changes\b/i.test(command)) {
                confirmed = (await acceptCommand(pull, command)) || confirmed;
              }
            }

            if (context.eventName === 'merge_group') {
              await setCheck(checkSha, confirmed ? [] : [
                {number: pull.number, files, truncated},
              ]);
              return;
            }

            if (files.length === 0) {
              if (policyComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: policyComment.id,
                });
              }
            } else {
              await updatePolicyComment(
                pull, policyComment, files, truncated, confirmed,
              );
            }

            const blockers = await otherBlockers(pull);
            if (!confirmed) blockers.unshift({number: pull.number, files, truncated});
            await setCheck(pull.head.sha, blockers);
