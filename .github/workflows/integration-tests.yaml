name: integration-tests
run-name: integration-tests (${{ inputs.test_type || 'integration' }})
# NOTE: run-name intentionally shows the RAW, user-facing input -- unit/
# integration/regression/trunk/perf are literal, first-class values (no
# alias-resolution layer; see _test_matrix.yaml's "Decide whether to run"
# step, which only applies the shared empty->regression default -- that
# default is for OTHER callers of the reusable workflow, e.g.
# test_each_commit.yaml; this entrypoint always overrides it below) -- this
# is also what push-to-clickhouse.yaml's trigger_type ends up recording, so
# ClickHouse sees the tier name callers actually asked for.

# ---------------------------------------------------------------------------
# Triggered by commits in upstream dependant repos (deeptools, flex, torch-spyre
# etc.) via workflow_dispatch. Runs the smoke suite (test_type default:
# "integration") against a specified spyre-inference ref so regressions from
# upstream changes are caught early without paying for the full matrix on
# every upstream commit; pass test_type explicitly for a broader check.
#
# Example caller pattern from an upstream repo's workflow:
#
#   gh workflow run integration-tests.yaml \
#     --repo <org>/spyre-inference \
#     -f triggering_repo=<repo link to deeptools/flex/torch-spyre> \
#     -f triggering_sha=${{ github.sha }} \
#     -f pr_url_hash=$(echo -n "${{ github.event.pull_request.html_url }}" | sha256sum | cut -c1-16) \
#     -f torch_spyre_ref=... \
#     -f rpm_location=... \
#     -f rpm_names=...
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      # ---- Upstream provenance ----------------
      triggering_repo:
        description: Name of the upstream repo that triggered this run (e.g. "deeptools", "flex", "torch-spyre")
        required: false
        type: string
        default: ''
      triggering_sha:
        description: Commit SHA in the upstream repo that triggered this run
        required: false
        type: string
        default: ''
      pr_url_hash:
        description: |
          Hash of the full URL of the upstream PR that triggered this run.
          Used to key the concurrency group so that re-runs for the same PR
          cancel any in-flight run. Leave empty for non-PR triggers.
        required: false
        type: string
        default: ''

      # ---- refs to test ----------
      ref:
        description: Branch, tag, or SHA of spyre-inference to check out and test
        required: false
        type: string
        default: ''
      repository:
        description: Full clone URL/owner-name of a spyre-inference fork (e.g. "myuser/spyre-inference"); leave empty for the base repo
        required: false
        type: string
        default: ''
      torch_spyre_ref:
        description: Branch, tag, or SHA of torch-spyre to check out and build against
        required: false
        type: string
        default: ''

      # ---- RPM / image overrides ------------------
      rpm_location:
        description: Artifactory location for RPM download
        required: false
        type: string
        default: ''
      rpm_names:
        description: Space-separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label
          (image_torch_spyre_pr_<component>_<sha12>).
          Leave empty to use the standing image_torch_spyre set.
        required: false
        type: string
        default: ''
      use_prebaked_image:
        description: When true, skip the "Install Spyre RPMs" step and use the runner image's Spyre stack as-is.
        required: false
        type: boolean
        default: false
      test_type:
        description: >-
          Suite subset to run: unit | integration (default, the smoke suite)
          | regression (every config) | trunk | perf. Literal, first-class
          values -- no alias-resolution layer. Selects which matrix configs
          run (see _test_matrix.yaml); same knob and vocabulary as the
          sibling repos. GitHub validates `choice` options against the REST
          API dispatch too, not just the web UI dropdown, so every value a
          caller (e.g. spyre-frameworks config.yaml) actually sends must be
          listed here explicitly.
        required: false
        type: choice
        options:
          - unit
          - integration
          - regression
          - perf
          - trunk
        default: integration

concurrency:
  # PR-context runs (native pull_request, or workflow_dispatch carrying a
  # pr_url_hash) key on the PR itself, so re-triggering the same PR cancels its
  # own stale in-flight run -- unchanged from before.
  #
  # A non-PR dispatch (scheduled/main-push/nightly/weekly -- pr_url_hash empty)
  # previously fell back to bare github.ref, so EVERY such dispatch of this
  # workflow on the same ref shared one group regardless of test_type. Two
  # unrelated dispatches landing close together (e.g. a nightly trunk run while
  # a push-triggered trunk run is still going) then cancelled each other via
  # cancel-in-progress, silently killing a run mid-job with no test failure and
  # no error -- see the run/job-level symptoms this fixes. Disambiguating by
  # test_type stops different suites from colliding at all.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.html_url) || (github.event_name == 'workflow_dispatch'
    && inputs.pr_url_hash != '' && inputs.pr_url_hash) || format('{0}-{1}', github.ref, inputs.test_type) }}
  # Only cancel for a PR-context run (re-running the same PR should supersede
  # its own stale run). A non-PR dispatch is never "the same PR re-triggered" --
  # cancelling it destroys a run that has nothing superseding it, so a same
  # test_type/ref collision QUEUES behind the in-flight run instead of killing it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_url_hash != '') }}

permissions:
  contents: read
  checks: write
  # Must cover every permission _test_matrix.yaml requests: a reusable workflow
  # cannot widen its caller's grant, and asking for more fails the run at startup.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Print a summary of what triggered this run so it is tracked
  # ---------------------------------------------------------------------------
  provenance:
    name: Log upstream dependant tool regression trigger
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          {
            echo "## Integration test triggered by upstream change"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Upstream repo       | ${{ inputs.triggering_repo || '(not specified)' }} |"
            echo "| Upstream commit     | ${{ inputs.triggering_sha || '(not specified)' }} |"
            echo "| PR URL hash         | ${{ inputs.pr_url_hash || '(not specified)' }} |"
            echo "| spyre-inference ref | ${{ inputs.ref || github.sha }} |"
            echo "| torch-spyre ref     | ${{ inputs.torch_spyre_ref || '(none)' }} |"
            echo "| RPM names           | ${{ inputs.rpm_names || '(none)' }} |"
            echo "| Test type           | ${{ inputs.test_type || 'integration' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Run the test matrix via the reusable workflow shared with
  # test_each_commit.yaml, defaulting to the integration tier (the smoke
  # suite) -- same default as the sibling repos' integration-tests.yaml.
  # Callers can still request test_type: regression for complete coverage.
  # ---------------------------------------------------------------------------
  run-tests:
    needs: provenance
    uses: ./.github/workflows/_test_matrix.yaml
    secrets: inherit
    with:
      # Dispatch flow: always run, regardless of changed files.
      skip_if_no_changes: false
      # Forward the caller's choice. Default false installs the baseline RPMs.
      # A dispatch on a prebaked image (for example Jenkins with a per-PR
      # runner_label) passes true to skip that install. See issue #543.
      use_prebaked_image: ${{ inputs.use_prebaked_image }}
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      torch_spyre_ref: ${{ inputs.torch_spyre_ref || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      runner_label: ${{ inputs.runner_label || '' }}
      test_type: ${{ inputs.test_type || 'integration' }}

  # ----------------------------------------------------------------------------------
  # Fan-in gate job so callers can poll a single stable job name for pass/fail.
  # ----------------------------------------------------------------------------------
  integration-test-result:
    name: Integration test result
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"

          if [[ "${RESULT}" == "success" ]]; then
            echo "All integration test suites passed."
            exit 0
          fi

          echo "One or more integration test suites failed or were cancelled."
          exit 1
