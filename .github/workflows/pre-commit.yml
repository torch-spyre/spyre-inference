name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    # Card-less self-hosted pool, set up like the test jobs so ty sees the real
    # torch-spyre and the uv cache comes from the shared NFS mount.
    runs-on: [x86_64, spyre_pf_x0, linux, image_torch_spyre]
    timeout-minutes: 30
    env:
      STORAGE_1_DIR: /storage-1/spyre-inference
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install Spyre RPMs
      uses: ./.github/actions/spyre-rpm-install

    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: false

    # Read-only: this job finishes first, so saving would publish its smaller cache
    # under the test jobs' key and they would skip their own save.
    - name: uv cache (NFS)
      uses: ./.github/actions/uv-nfs-cache
      with:
        storage-root: ${{ env.STORAGE_1_DIR }}/.cache/uv
        save: 'false'

    - name: Install spyre-inference
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        uv sync --frozen --group dev

    # The image exports VIRTUAL_ENV for its own baked venv, which ty would read instead.
    - name: Activate the project venv
      run: |
        echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
        echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

    - run: echo "::add-matcher::.github/workflows/matchers/ruff.json"

    - name: "Run linting via prek"
      uses: j178/prek-action@0bb87d7f00b0c99306c8bcb8b8beba1eb581c037 # v1.1.1
      with:
        extra_args: --all-files --hook-stage manual

    - name: "Run ty type check"
      run: uvx prek@v0.4.4 run ty --all-files --stage pre-commit

  # The .github/scripts ingest tests are not in the repo's pytest testpaths and no other job
  # collects them, so they would pass locally and never run here. Standalone by design: they
  # stub clickhouse_connect and load the scripts by path, needing none of the product venv.
  ingest-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: "3.12"
        enable-cache: false

    - name: Run the ingest script tests
      run: |
        uv run --no-project \
          --with pytest --with lxml --with clickhouse-connect --with requests --with pyyaml \
          --with "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest" \
          pytest .github/scripts -q -p no:cacheprovider -o addopts=""
