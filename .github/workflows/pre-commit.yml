name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: "Set up Python 3.12"
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: "3.12"
        enable-cache: true
        # merge_group runs save to an ephemeral gh-readonly-queue ref nothing
        # can restore later, orphaning a ~700MB cache per cycle; restore only
        # there (mirrors run-matrix-config's save-cache guard).
        save-cache: ${{ github.event_name != 'merge_group' }}
        # Key only on uv.lock; setup-uv's default glob also hashes
        # pyproject.toml, so config-only edits would needlessly bust the cache.
        cache-dependency-glob: uv.lock

    - name: "Install dependencies"
      run: uv sync --frozen --no-install-package torch-spyre --no-dev -v

    - name: "Clone torch-spyre source for type stubs"
      run: |
        TORCH_SPYRE_REV=$(grep -oP '^torch-spyre = .*rev = "\K[^"]+' pyproject.toml)
        git clone --depth 1 https://github.com/torch-spyre/torch-spyre /tmp/torch-spyre
        git -C /tmp/torch-spyre fetch --depth 1 origin "$TORCH_SPYRE_REV"
        git -C /tmp/torch-spyre checkout "$TORCH_SPYRE_REV"
        mkdir /tmp/torch-spyre-stubs
        cp -r /tmp/torch-spyre/torch_spyre /tmp/torch-spyre-stubs/

    - run: echo "::add-matcher::.github/workflows/matchers/ruff.json"

    - name: "Run linting via prek"
      uses: j178/prek-action@v1
      with:
        extra_args: --all-files --hook-stage manual

    - name: "Run ty type check"
      env:
        PYTHONPATH: /tmp/torch-spyre-stubs
      run: uvx prek@v0.4.4 run ty --all-files --stage pre-commit

  # The .github/scripts ingest tests are not in the repo's pytest testpaths and no other job
  # collects them, so they would pass locally and never run here. Standalone by design: they
  # stub clickhouse_connect and load the scripts by path, needing none of the product venv.
  ingest-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: "3.12"

    - name: Run the ingest script tests
      run: |
        uv run --no-project \
          --with pytest --with lxml --with clickhouse-connect --with requests \
          --with "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest" \
          pytest .github/scripts -q -p no:cacheprovider -o addopts=""
