# This tests the publication process for spyre-inference by pushing a pre-release
# to test.pypi.org. Run manually against a release tag (e.g. v0.5.0-rc.1).
name: Test publication of spyre-inference on test.pypi.org

on:
  workflow_dispatch:

jobs:
  build:
    # A non-tag ref builds a PEP 440 local version, which PyPI rejects.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/spyre-inference
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
            # Fetch all history for setuptools_scm to work correctly
            fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            version: "latest"
            python-version: "3.12"
      - name: Build package
        run: uv build
      - name: Publish package distributions to test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
            repository-url: https://test.pypi.org/legacy/
