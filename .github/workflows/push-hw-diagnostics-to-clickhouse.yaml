name: push-hw-diagnostics-to-clickhouse

# Parses hardware/RAS failure signatures out of the raw job logs of a completed
# test run and ingests them into ClickHouse (spyre.hw_failure_diagnostics), which
# backs the "Spyre Hardware Health" Grafana dashboard. Without this, a card-level
# fault (e.g. RAS::CBRB::ResponseTimeout) surfaces only as a pytest failure and
# never reaches the hardware-health view.
#
# Triggered by both workflows that run the Spyre HW test matrix (both call the
# same reusable _test_matrix.yaml):
#   - test_each_commit.yaml (push / PR / merge_group entrypoint)
#   - integration-tests.yaml (workflow_dispatch entrypoint)
#
# The parse+ingest pipeline itself is torch-spyre's shared
# ingest-hw-diagnostics-to-clickhouse composite action, not a local copy of the
# scripts: hw_failure_diagnostics has the same shape everywhere, and the action
# always pulls its scripts from the same commit as the spyre_clickhouse_ingest
# library it installs, so a script/library API drift here is impossible by
# construction (see push-to-clickhouse.yaml's ingest-xml-to-clickhouse step for
# the same pattern on the test-results side).
on:
  workflow_run:
    workflows:
      - integration-tests
      - test_each_commit
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to parse and ingest
        required: true
        default: ''
      workflow_name:
        description: Workflow name (integration-tests | test_each_commit)
        required: false
        default: integration-tests

concurrency:
  group: hw-diag-${{ github.event.workflow_run.id || inputs.gha_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to read job logs from the triggering run

jobs:
  ingest:
    name: Parse logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    # Skip if the triggering workflow was cancelled (but ingest failures are fine)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow_name }}

      INGEST_COMPONENT: spyre-inference
      # The arch of the ANALYSED leg, not of this ingest job -- so never $(uname -m), which
      # would report the ingest runner. Literal x86_64 because the HW test matrix this
      # workflow follows only runs on the x86 Spyre pool today. arch is a run_id hash
      # input, so a wrong value here derives a run_id that joins nothing, silently.
      LEG_ARCH: x86_64
      # Dual-write during the migration window; empty CLICKHOUSE_DB_V2 makes v2 a no-op.
      INGEST_SCHEMA: both

    steps:
      # Nested local `uses: ./...` actions inside ingest-hw-diagnostics-to-clickhouse resolve against this checkout, not torch-spyre's own repo.
      - name: Checkout torch-spyre composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: torch-spyre/torch-spyre
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Ingest hardware-failure diagnostics into ClickHouse
        id: ingest
        uses: torch-spyre/torch-spyre/.github/actions/ingest-hw-diagnostics-to-clickhouse@main
        with:
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          workflow-name: ${{ env.TRIGGERING_WORKFLOW }}
          component: ${{ env.INGEST_COMPONENT }}
          arch: ${{ env.LEG_ARCH }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}
          schema: ${{ env.INGEST_SCHEMA }}

      - name: Upload JSON artifact
        if: always() && steps.ingest.outputs.json-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ingest.outputs.json-file }}
          path: ${{ steps.ingest.outputs.json-file }}
          retention-days: 10
