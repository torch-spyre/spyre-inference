name: push-hw-diagnostics-to-clickhouse

# Parses hardware/RAS failure signatures out of the raw job logs of a completed
# test run and ingests them into ClickHouse (spyre.hw_failure_diagnostics), which
# backs the "Spyre Hardware Health" Grafana dashboard. Without this, a card-level
# fault (e.g. RAS::CBRB::ResponseTimeout) surfaces only as a pytest failure and
# never reaches the hardware-health view.
#
# Triggered by both workflows that run the Spyre HW test matrix (both call the
# same reusable _test_matrix.yaml):
#   - test_each_commit.yaml (push / PR / merge_group entrypoint)
#   - integration-tests.yaml (workflow_dispatch entrypoint)
on:
  workflow_run:
    workflows:
      - integration-tests
      - test_each_commit
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to parse and ingest
        required: true
        default: ''
      workflow_name:
        description: Workflow name (integration-tests | test_each_commit)
        required: false
        default: integration-tests

concurrency:
  group: hw-diag-${{ github.event.workflow_run.id || inputs.gha_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to read job logs from the triggering run

jobs:
  ingest:
    name: Parse logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    # Skip if the triggering workflow was cancelled (but ingest failures are fine)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow_name }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGERING_RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id || inputs.gha_run_id }}

    steps:
      # workflow_run always executes this file as it exists on the default
      # branch, so a plain checkout (no ref:) here pulls the canonical copy
      # of the parse/ingest scripts regardless of which ref triggered the run.
      - name: Checkout scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/scripts/parse_hw_failures.py
            .github/scripts/ingest_hw_diagnostics.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: setup venv
        run: |
          uv venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install clickhouse-connect regex

      - name: Install gh CLI
        env:
          # Offline floor only: used when api.github.com can't be reached to resolve the
          # latest release, so a transient API failure degrades to a known-good gh.
          GH_CLI_VERSION_FLOOR: 2.98.0
        run: |
          set -euo pipefail
          # Track the latest gh release rather than a pin: nothing here depends on a
          # specific gh version, and a pin silently rots.
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                   | jq -r '.tag_name // empty' | sed 's/^v//')" || ver=""
          if [ -z "$ver" ]; then
            echo "api.github.com unreachable; flooring to ${GH_CLI_VERSION_FLOOR}"
            ver="${GH_CLI_VERSION_FLOOR}"
          fi
          # curl, not wget: the ingest runner image ships curl but no wget.
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            -o gh.tar.gz
          tar -xzf gh.tar.gz
          echo "$PWD/gh_${ver}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "gh_${ver}_linux_amd64/bin/gh" --version

      - name: Download job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw_logs

          gh api \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/jobs" \
            --paginate \
            --jq '.jobs[] | {id: .id, name: .name}' \
          > /tmp/jobs.jsonl

          python3 - << 'PYEOF'
          import json, os, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          jobs = [json.loads(l) for l in open("/tmp/jobs.jsonl") if l.strip()]

          # gh 2.97.0+ refuses to emit a response body containing terminal escape
          # sequences unless --allow-escape-sequences is passed, and job logs are
          # full of them; older gh does not know the flag. Probe rather than pin.
          help_out = subprocess.run(
              ["gh", "api", "--help"], capture_output=True, text=True
          ).stdout
          esc_flag = (
              ["--allow-escape-sequences"] if "--allow-escape-sequences" in help_out else []
          )

          downloaded = 0
          for idx, j in enumerate(jobs):
              safe = re.sub(r"[^\w\s\-]", "", j["name"]).strip()
              out = f"raw_logs/{idx}_{safe}.txt"
              result = subprocess.run(
                  ["gh", "api", *esc_flag,
                   f"/repos/{repo}/actions/jobs/{j['id']}/logs"],
                  capture_output=True, env={**os.environ},
              )
              if result.returncode == 0 and result.stdout:
                  open(out, "wb").write(result.stdout)
                  downloaded += 1
                  print(f"  OK  {out}")
              else:
                  err = result.stderr.decode("utf-8", "replace").strip()
                  print(f"  SKIP  {j['name']} (rc={result.returncode}): {err}")

          print(f"[info] downloaded {downloaded}/{len(jobs)} job logs")

          # Every completed run has at least one job with a log, so zero downloads
          # means the download mechanism itself broke. Fail loudly: otherwise the
          # empty-data guard downstream skips the ingest and the job still reports
          # success, which is how such an outage stays green unnoticed.
          if jobs and downloaded == 0:
              print(f"::error::downloaded 0 of {len(jobs)} job logs -- aborting")
              sys.exit(1)
          PYEOF

      - name: Parse logs
        run: |
          source .venv/bin/activate

          SAFE_WF=$(echo "${TRIGGERING_WORKFLOW}" | tr ' ' '_')
          JSON_FILE="hw_diagnostics_${SAFE_WF}_${TRIGGERING_RUN_ID}.json"
          echo "JSON_FILE=${JSON_FILE}" >> "$GITHUB_ENV"

          python3 .github/scripts/parse_hw_failures.py \
            --log-dir raw_logs \
            --run-id  "${TRIGGERING_RUN_ID}" \
            --out     "${JSON_FILE}"

      - name: Ingest report into ClickHouse
        run: |
          source .venv/bin/activate
          python3 .github/scripts/ingest_hw_diagnostics.py \
            --json-file "${JSON_FILE}" \
            --workflow  "${TRIGGERING_WORKFLOW}" \
            --branch    "${TRIGGERING_BRANCH}" \
            --sha       "${TRIGGERING_SHA}" \
            --run-id    "${TRIGGERING_RUN_ID}" \
            --run-link  "${TRIGGERING_RUN_LINK}"

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JSON_FILE }}
          path: ${{ env.JSON_FILE }}
          retention-days: 10
