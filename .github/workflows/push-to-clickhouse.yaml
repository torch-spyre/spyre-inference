name: push-to-clickhouse

# Ingests JUnit XML results from spyre-inference's own pytest matrix into
# ClickHouse via .github/scripts/ingest_xml_si.py, writing to
# si_test_runs / si_test_cases / si_run_properties. Triggered by both
# workflows that produce that matrix (both call the same reusable
# _test_matrix.yaml, so they emit the exact same suite shape):
#   - test_each_commit.yaml (push / PR / merge_group entrypoint)
#   - integration-tests.yaml (workflow_dispatch entrypoint, e.g. upstream
#     triggers or manual re-runs)
# Also supports manual dispatch for re-ingesting a specific run.
on:
  workflow_run:
    workflows:
      - integration-tests
      - test_each_commit
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to re-ingest (leave blank to skip)
        required: false
        default: ''
      workflow_name:
        description: Workflow name (integration-tests | test_each_commit)
        required: false
        default: integration-tests

concurrency:
  # Allow at most one ingest per triggering run (re-runs queue behind)
  group: ingest-${{ github.event.workflow_run.id || inputs.gha_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to download artifacts from the triggering run

jobs:
  ingest:
    name: Ingest XML -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    # Skip if the triggering workflow was cancelled (but ingest failures are fine)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      # ---------------------------------------------------------------------------
      # Set these secrets in your repo / org settings:
      #   CLICKHOUSE_HOST   e.g. clickhouse.internal.example.com
      #   CLICKHOUSE_PORT   e.g. 8123  (HTTP interface)
      #   CLICKHOUSE_USER   e.g. spyre_writer
      #   CLICKHOUSE_PASS   the password
      #   CLICKHOUSE_DB     e.g. spyre
      # ---------------------------------------------------------------------------
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

      # Metadata about the triggering run
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow_name }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGERING_AT: ${{ github.event.workflow_run.created_at || '' }}
      # display_title carries "integration-tests (<test_type>)" via that
      # workflow's run-name, or the bare tier ("trunk" / "regression") via
      # test_each_commit's -- the only way this job can recover which tier
      # ran without an extra API call.
      TRIGGERING_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title || '' }}
      # Triggering event (push/pull_request/schedule/workflow_dispatch/merge_group; empty on manual re-ingest) -- gates the PR-number lookup below.
      TRIGGERING_EVENT: ${{ github.event.workflow_run.event || '' }}

    steps:
      # workflow_run always executes this file as it exists on the default
      # branch, so a plain checkout (no ref:) here pulls the canonical copy
      # of the ingest script regardless of which ref triggered the run.
      - name: Checkout ingest script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/scripts/ingest_xml_si.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: setup venv
        run: |
          # Named .venv-v1, not .venv: the v2 ingest step below (the shared
          # torch-spyre composite action) also runs `uv venv` in this same
          # workspace, and `uv venv .venv` a second time fails with "A virtual
          # environment already exists at: .venv".
          uv venv .venv-v1
          source .venv-v1/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv-v1/bin/activate
          uv pip install requests clickhouse-driver clickhouse-connect lxml regex
          # The v2 schema and write path live in torch-spyre's extensions/ so all three
          # product repos share ONE definition of run_id and test_case_id.
          uv pip install \
            "git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest"

      - name: Install gh CLI
        env:
          # Offline floor only: used when api.github.com can't be reached to resolve the
          # latest release, so a transient API failure degrades to a known-good gh instead
          # of failing the job.
          GH_CLI_VERSION_FLOOR: 2.98.0
        run: |
          set -euo pipefail
          # Track the latest gh release rather than a pin: nothing here depends on a
          # specific gh version, and a pin silently rots (this fleet had 2.92.0 and 2.97.0
          # drifting apart across workflows).
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                   | jq -r '.tag_name // empty' | sed 's/^v//')" || ver=""
          if [ -z "$ver" ]; then
            echo "api.github.com unreachable; flooring to ${GH_CLI_VERSION_FLOOR}"
            ver="${GH_CLI_VERSION_FLOOR}"
          fi
          # curl, not wget: the ingest runner image ships curl but no wget.
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" \
            -o gh.tar.gz
          tar -xzf gh.tar.gz
          echo "$PWD/gh_${ver}_linux_amd64/bin" >> "${GITHUB_PATH}"
          "gh_${ver}_linux_amd64/bin/gh" --version

      - name: Resolve PR number
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An unconditional commit->PR lookup stamped a trunk/scheduled run with whatever PR previously merged that commit; only trust it for an actual pull_request-triggered run.
          if [[ "${TRIGGERING_EVENT}" == "pull_request" ]]; then
            PR=$(gh api \
              "/repos/${{ github.repository }}/commits/${TRIGGERING_SHA}/pulls" \
              --jq '.[0].number // 0')
          else
            PR=0
          fi
          echo "Resolved PR number: ${PR} (triggering event: ${TRIGGERING_EVENT:-<manual dispatch>})"
          echo "pr_number=${PR}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------------------
      # Download every artifact from the triggering run and unzip it — artifact
      # *names* carry no file extension (only the file inside the zip does), so
      # filtering has to happen post-unzip by actual filename, not by artifact name.
      #
      # `--paginate` is required: the artifacts endpoint defaults to 30 per
      # page, and a run with more jobs than that silently lost every artifact
      # past the first page, with no error — rows just never showed up in
      # ClickHouse. `--paginate` applies `--jq` per page and concatenates the
      # filtered results across pages (`gh api` rejects `--slurp` combined
      # with `--jq`), so the per-artifact objects come out as a JSON stream,
      # not a single array; python3 slurps that stream into one array below.
      # ---------------------------------------------------------------------------
      - name: List artifacts from triggering run
        id: list-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {id: .id, name: .name}' \
            | python3 -c "import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))")
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "Found artifacts:"
          echo "$ARTIFACTS" | python3 -c "import json,sys; [print(' •', a['name']) for a in json.load(sys.stdin)]"

      - name: Download XML artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p xml_artifacts
          export ARTIFACTS='${{ steps.list-artifacts.outputs.artifacts }}'
          python3 <<'PYEOF'
          import json, os, subprocess, sys
          from pathlib import Path

          artifacts = json.loads(os.environ['ARTIFACTS'])
          repo  = os.environ['GITHUB_REPOSITORY']
          for a in artifacts:
              print(f"Downloading: {a['name']} (id={a['id']})")
              with open(f"xml_artifacts/{a['name']}.zip", "wb") as f:
                result = subprocess.run([
                    "gh", "api",
                    f"/repos/{repo}/actions/artifacts/{a['id']}/zip",
                ], check=True, env={**os.environ}, capture_output=True)
                f.write(result.stdout)
              # Each artifact unzips into its OWN subdirectory (named after
              # the artifact) rather than a shared flat one, so two suites
              # can never clobber each other even if they happen to produce
              # a JUnit XML with the same basename. ingest_xml_si.py globs
              # --xml-dir recursively and derives a unique filename from the
              # path relative to it, so this nesting is exactly what it
              # expects.
              dest = Path("xml_artifacts") / a["name"]
              subprocess.run(
                  ["unzip", "-o", f"xml_artifacts/{a['name']}.zip", "-d", str(dest)],
                  check=True,
              )
          PYEOF
          echo "Downloaded XML files:"
          find xml_artifacts -name "*.xml" 2>/dev/null || echo "(none)"

      # The orchestrator's threaded run_id, uploaded as an artifact because this workflow runs on
      # workflow_run and so cannot read the triggering run's inputs. Empty on a GHA-initiated run
      # or a manual re-ingest, in which case the ingest derives its own id from the run coordinate.
      - name: Resolve orchestrator run_id
        id: resolve-run-id
        run: |
          # Two producers upload the same value under different names: integration-tests.yaml
          # writes "orchestrator-run-id", and _test_matrix.yaml (used by test_each_commit) writes
          # "run-id". Both ride in via the download-every-artifact step above, so read whichever
          # is present rather than adding a second API round-trip for one of them.
          RID=""
          for f in xml_artifacts/orchestrator-run-id/run-id.txt \
                   xml_artifacts/run-id/run-id.txt; do
            if [[ -f "$f" ]]; then
              RID="$(tr -d '[:space:]' < "$f")"
              [[ -n "$RID" ]] && break
            fi
          done
          echo "Threaded run_id: ${RID:-<none, ingest will derive from the run coordinate>}"
          echo "run_id=${RID}" >> "${GITHUB_OUTPUT}"

      - name: Resolve test_type for trigger_type
        id: extract-tier
        run: |
          if [[ "${TRIGGERING_WORKFLOW}" == "test_each_commit" ]]; then
            # test_each_commit's run-name IS the external-facing tier name
            # itself ("trunk" on push, "regression" otherwise) -- no parens
            # to parse out.
            TIER="${TRIGGERING_DISPLAY_TITLE}"
          else
            # integration-tests' run-name is deliberately
            # "integration-tests (<inputs.test_type>)" -- the RAW test_type
            # value the caller passed (e.g. "integration" / "regression" /
            # "trunk"); there is no internal alias vocabulary to resolve
            # through (see _test_matrix.yaml's test_type description) -- so
            # parsing it out of display_title recovers the real external-
            # facing value without an extra API call.
            TIER=$(echo "${TRIGGERING_DISPLAY_TITLE}" | sed -n 's/.*(\(.*\))\s*$/\1/p')
          fi
          echo "Resolved test_type: ${TIER:-<none>}"
          echo "tier=${TIER}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------------------
      # Parse each XML file and insert rows into ClickHouse via
      # ingest_xml_si.py (checked out above), into
      # si_test_runs / si_test_cases / si_run_properties.
      - name: Ingest XML files into ClickHouse
        env:
          # Fallback only: each leg uploads its own arch beside its JUnit XML, which the
          # ingest prefers per file. Used when that sidecar is absent (a re-ingest of an
          # older run), since arch is hashed into run_id and this job is pinned to x86_64.
          LEG_ARCH: x86_64
          # Routed through env rather than interpolated into the script: this job runs on
          # workflow_run, a privileged trigger, and the value comes from a downloaded artifact.
          THREADED_RUN_ID: ${{ steps.resolve-run-id.outputs.run_id }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          TIER: ${{ steps.extract-tier.outputs.tier }}
        run: |
          source .venv-v1/bin/activate
          python3 .github/scripts/ingest_xml_si.py \
            --xml-dir xml_artifacts \
            --workflow "${TRIGGERING_WORKFLOW}" \
            --branch   "${TRIGGERING_BRANCH}" \
            --sha      "${TRIGGERING_SHA}" \
            --gha-run-id "${TRIGGERING_RUN_ID}" \
            --run-id   "${THREADED_RUN_ID}" \
            --triggered-at "${TRIGGERING_AT}" \
            --pr-number    "${PR_NUMBER}" \
            --trigger-type "${TIER}" \
            --platform "${LEG_ARCH}"

      # Schema-v2 via torch-spyre's reusable action, grouped by leg arch first since arch is a run_id hash input and the matrix dispatches non-x86_64 legs too.
      - name: Group XML files by leg arch
        id: group-by-arch
        run: |
          python3 - <<'PYEOF'
          import os
          from pathlib import Path

          ROOT = Path("xml_artifacts")
          OUT = Path("xml_by_arch")
          DEFAULT_ARCH = "x86_64"
          KNOWN_ARCHES = ("x86_64", "ppc64le", "s390x")

          def canonical(arch: str) -> str:
              a = arch.strip().lower()
              return "x86_64" if a in ("amd64", "x86", "x86-64", "x86_64") else a

          def leg_arch(xml_path: Path) -> str:
              # A name-derived sidecar first, then any leg-arch-*.txt beside the XML.
              sidecar = xml_path.with_name(
                  xml_path.stem.replace("junit-", "leg-arch-") + ".txt"
              )
              for candidate in (sidecar, *sorted(xml_path.parent.glob("leg-arch-*.txt"))):
                  try:
                      arch = candidate.read_text().strip()
                  except OSError:
                      continue
                  if arch:
                      return arch
              return ""

          groups: dict[str, int] = {}
          for xml_path in sorted(ROOT.rglob("*.xml")):
              arch = canonical(leg_arch(xml_path) or DEFAULT_ARCH)
              dest_dir = OUT / arch
              dest_dir.mkdir(parents=True, exist_ok=True)
              # Flattened with the relative path as filename: the action globs non-recursively.
              rel = xml_path.relative_to(ROOT)
              dest = dest_dir / str(rel).replace(os.sep, "__")
              dest.symlink_to(xml_path.resolve())
              groups[arch] = groups.get(arch, 0) + 1

          print("Grouped XML files by leg arch:")
          for arch, n in sorted(groups.items()):
              print(f"  {arch}: {n} file(s)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for arch in KNOWN_ARCHES:
                  present = "true" if groups.get(arch, 0) > 0 else "false"
                  f.write(f"has_{arch}={present}\n")

          unknown = sorted(set(groups) - set(KNOWN_ARCHES))
          if unknown:
              print(
                  f"::warning::XML grouped under unrecognised arch(es) {unknown}; v2 "
                  "will not be written for them -- add to KNOWN_ARCHES in "
                  "push-to-clickhouse.yaml's grouping step."
              )
          PYEOF

      - name: Ingest XML into shared v2 ClickHouse tables (x86_64)
        if: steps.group-by-arch.outputs.has_x86_64 == 'true'
        uses: torch-spyre/torch-spyre/.github/actions/ingest-xml-to-clickhouse@main
        with:
          xml-dir: xml_by_arch/x86_64
          workflow: ${{ env.TRIGGERING_WORKFLOW }}
          branch: ${{ env.TRIGGERING_BRANCH }}
          sha: ${{ env.TRIGGERING_SHA }}
          run-id: ${{ steps.resolve-run-id.outputs.run_id }}
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          triggered-at: ${{ env.TRIGGERING_AT }}
          pr-number: ${{ steps.resolve-pr.outputs.pr_number }}
          trigger-type: ${{ steps.extract-tier.outputs.tier }}
          platform: x86_64
          component: spyre-inference
          schema: v2
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      - name: Ingest XML into shared v2 ClickHouse tables (ppc64le)
        if: steps.group-by-arch.outputs.has_ppc64le == 'true'
        uses: torch-spyre/torch-spyre/.github/actions/ingest-xml-to-clickhouse@main
        with:
          xml-dir: xml_by_arch/ppc64le
          workflow: ${{ env.TRIGGERING_WORKFLOW }}
          branch: ${{ env.TRIGGERING_BRANCH }}
          sha: ${{ env.TRIGGERING_SHA }}
          run-id: ${{ steps.resolve-run-id.outputs.run_id }}
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          triggered-at: ${{ env.TRIGGERING_AT }}
          pr-number: ${{ steps.resolve-pr.outputs.pr_number }}
          trigger-type: ${{ steps.extract-tier.outputs.tier }}
          platform: ppc64le
          component: spyre-inference
          schema: v2
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      - name: Ingest XML into shared v2 ClickHouse tables (s390x)
        if: steps.group-by-arch.outputs.has_s390x == 'true'
        uses: torch-spyre/torch-spyre/.github/actions/ingest-xml-to-clickhouse@main
        with:
          xml-dir: xml_by_arch/s390x
          workflow: ${{ env.TRIGGERING_WORKFLOW }}
          branch: ${{ env.TRIGGERING_BRANCH }}
          sha: ${{ env.TRIGGERING_SHA }}
          run-id: ${{ steps.resolve-run-id.outputs.run_id }}
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          triggered-at: ${{ env.TRIGGERING_AT }}
          pr-number: ${{ steps.resolve-pr.outputs.pr_number }}
          trigger-type: ${{ steps.extract-tier.outputs.tier }}
          platform: s390x
          component: spyre-inference
          schema: v2
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      - name: Summary
        if: always()
        run: |-
          XML_COUNT=$(find xml_artifacts -name "*.xml" 2>/dev/null | wc -l || echo 0)
          {
            echo "### ClickHouse Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering workflow | ${TRIGGERING_WORKFLOW} |"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| Suite tier          | ${{ steps.extract-tier.outputs.tier }} |"
            echo "| PR number           | ${{ steps.resolve-pr.outputs.pr_number }} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| XML files ingested  | ${XML_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
