name: 'test_each_commit'
# run-name mirrors the test_type passed to _test_matrix.yaml below ("trunk"
# on push, "regression" otherwise) -- push-to-clickhouse.yaml reads this bare
# value straight off display_title to recover trigger_type without an extra
# API call.
run-name: ${{ github.event_name == 'push' && 'trunk' || 'regression' }}

# ---------------------------------------------------------------------------
# push / PR / merge_group entrypoint. Thin caller of the reusable
# _test_matrix.yaml (build + 6-config test matrix). The required-check gate
# (run-spyre-unit-tests) lives here because a reusable workflow's internal job
# names do not surface as top-level checks for branch protection.
#
# workflow_dispatch lives in integration-tests.yaml (the sole dispatch
# entrypoint); this workflow only fires on push/PR/merge_group, so the
# reusable workflow's github.repository/github.ref fallbacks apply and no
# inputs need to be threaded through.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.html_url) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  # Resolves the `integration-test` label for BOTH pull_request and merge_group. A
  # merge_group payload has no pull_request object, so the label cannot be read inline
  # there; the PR number is recovered from the queue ref instead. When the label is set,
  # spyre-frameworks' Jenkins integration run owns this commit's testing and mirrors its
  # verdict onto this repo's required check name (check_names in
  # pipelines/components/spyre-inference/config.yaml), so the matrix below can stand aside.
  #
  # run-spyre-unit-tests `needs` this job and lists it in its failure predicates: a
  # detection failure skips the matrix, so the required check must go red rather than
  # report a false green over a suite that never ran.
  detect-label:
    name: Detect integration-test label
    runs-on: ubuntu-latest
    outputs:
      labeled: ${{ steps.label.outputs.labeled }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Resolve label
        id: label
        uses: ./.github/actions/detect-integration-test-label

  test:
    needs: detect-label
    if: needs.detect-label.outputs.labeled != 'true'
    uses: ./.github/workflows/_test_matrix.yaml
    secrets: inherit
    with:
      # PR/merge_group flow: skip the build/test when no source files
      # changed. A push to main (trunk) always runs regardless -- a merge
      # should always validate the merged state, not rely on the PR-diff
      # change-detection heuristic.
      skip_if_no_changes: ${{ github.event_name != 'push' }}
      test_type: ${{ github.event_name == 'push' && 'trunk' || 'regression' }}

  # ---------------------------------------------------------------------------
  # Required check gate -- this job name must match the existing branch
  # protection rule: "tests / Run Spyre unit tests".
  # It fans in the reusable matrix result so the single required check
  # passes only when every suite passes.
  # ---------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: run spyre unit tests
    runs-on: ubuntu-latest
    needs: [detect-label, test]
    # Never gated on the label: a skipped REQUIRED check is reported as MISSING rather
    # than green, which blocks the merge-queue entry outright.
    if: always()
    steps:
      - name: Check all suites passed
        run: |-
          if ${{ contains(needs.detect-label.result, 'failure') || contains(needs.detect-label.result, 'cancelled') ||
                 contains(needs.test.result, 'failure') || contains(needs.test.result, 'cancelled') }}; then
            echo "One or more test suites failed."
            exit 1
          fi
          if [ "${{ needs.detect-label.outputs.labeled }}" = "true" ]; then
            echo "integration-test label set -- the Jenkins integration run owns this commit's"
            echo "testing and mirrors its verdict onto this check name. Passing so the merge"
            echo "queue is not blocked by a missing required check."
            exit 0
          fi
          echo "All test suites passed."
