# test_name of vllm-benchmarks/benchmarks/spyre/latency-tests-dev.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: latency-gemma4-26b-a4b-tp4-in4096-out4096, description: 'one batch end to end (vllm bench latency)', owner: spyre-inference}
spec:
  type: perf
  level: model
  tier: extended
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/latency}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --suite, dev, --bench-types, latency, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: latency_gemma4-26b-a4b_tp4_in4096_out4096
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: latency}
      - {key: tensor_parallel, value: 4}
      - {key: input_len, value: 4096}
      - {key: output_len, value: 4096}
  variants:
    - name: latency_gemma4-26b-a4b_tp4_in4096_out4096
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: gemma-4-26b-a4b, model: gemma-4-26b-a4b, precision: fp16, tp: 4, flags: {load-format: auto, max-model-len: 8192}}
      workload: {type: llm/latency, shape: {batch_size: 1, input_len: 4096, output_len: 4096}, load: {executor: iterations, iterations: 10, warmup_iterations: 2}}
