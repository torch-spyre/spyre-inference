# test_name of vllm-benchmarks/benchmarks/spyre/latency-tests-dev.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: latency-granite41-8b-tp1-in1024-out1024, description: 'one batch end to end (vllm bench latency)', owner: spyre-inference}
spec:
  type: perf
  level: model
  tier: extended
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/latency}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --suite, dev, --bench-types, latency, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: latency_granite41-8b_tp1_in1024_out1024
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: latency}
      - {key: tensor_parallel, value: 1}
      - {key: input_len, value: 1024}
      - {key: output_len, value: 1024}
  variants:
    - name: latency_granite41-8b_tp1_in1024_out1024
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-4.1-8b, model: granite-4.1-8b, precision: fp16, tp: 1, flags: {load-format: auto, max-model-len: 2048}}
      workload: {type: llm/latency, shape: {batch_size: 1, input_len: 1024, output_len: 1024}, load: {executor: iterations, iterations: 10, warmup_iterations: 2}}
