# test_name of vllm-benchmarks/benchmarks/spyre/latency-tests-dev.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: latency-granite8b-tp1-in64-out64-smoke, description: 'one batch end to end (vllm bench latency)', owner: spyre-inference}
spec:
  type: perf
  level: model
  tier: extended
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/latency}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --suite, dev, --bench-types, latency, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: latency_granite8b_tp1_in64_out64_smoke
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: latency}
      - {key: tensor_parallel, value: 1}
      - {key: input_len, value: 64}
      - {key: output_len, value: 64}
  variants:
    - name: latency_granite8b_tp1_in64_out64_smoke
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: micro-g3.3-8b-instruct-1b, model: micro-g3.3-8b-instruct-1b, precision: fp16, tp: 1, flags: {load-format: auto, max-model-len: 128}}
      workload: {type: llm/latency, shape: {batch_size: 1, input_len: 64, output_len: 64}, load: {executor: iterations, iterations: 2, warmup_iterations: 1}}
