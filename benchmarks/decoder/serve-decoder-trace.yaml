# Variant names are the test_name values of the trace entries in serve-tests.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: serve-decoder-trace, description: 'decoder serving replaying a recorded agentic trace (vllm bench serve)', owner: spyre-inference}
spec:
  type: perf
  level: service
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/serve}
  run: {cache: warm, repeats: 1}
  variants:
    - name: serve_granite33-8b_tp1_cics
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-3.3-8b-instruct, model: granite-3.3-8b-instruct, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 100}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_granite33-8b_tp4_cics
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: granite-3.3-8b-instruct, model: granite-3.3-8b-instruct, precision: fp16, tp: 4, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 100}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_granite41-8b_tp1_cics
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-4.1-8b, model: granite-4.1-8b, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 100}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_granite41-8b_tp4_cics
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: granite-4.1-8b, model: granite-4.1-8b, precision: fp16, tp: 4, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 100}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_granite33-8b-fp8_tp4_aiops
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: granite-3.3-8b-instruct-fp8, model: granite-3.3-8b-instruct-fp8, precision: fp8, tp: 4, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 4096}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 50}, inputs: [{name: prompts, dataset: aiops-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_granite41-8b-fp8_tp4_aiops
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: granite-4.1-8b-fp8, model: granite-4.1-8b-fp8, precision: fp8, tp: 4, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 4096}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 50}, inputs: [{name: prompts, dataset: aiops-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_gemma4-26b-a4b_tp1_cics
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: gemma-4-26b-a4b, model: gemma-4-26b-a4b, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 50}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
    - name: serve_gemma4-26b-a4b_tp4_cics
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: gemma-4-26b-a4b, model: gemma-4-26b-a4b, precision: fp16, tp: 4, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, max-model-len: 8192}}
      workload: {type: llm/serve, endpoint: '/v1/completions', load: {executor: closed, concurrency: 4, requests: 50}, inputs: [{name: prompts, dataset: cics-trace}], sampling: {ignore_eos: true}, flags: {dataset-name: custom, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
