# Variant names are the test_name values of vllm-benchmarks/benchmarks/spyre/throughput-tests.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: throughput-decoder, description: 'offline batch (vllm bench throughput)', owner: spyre-inference}
spec:
  type: perf
  level: model
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/throughput}
  run: {cache: warm, repeats: 1}
  variants:
    - name: throughput_granite8b_tp1_in64_out64
      tier: sanity
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: micro-g3.3-8b-instruct-1b, model: micro-g3.3-8b-instruct-1b, precision: fp16, tp: 1, flags: {load-format: auto, max-model-len: 128}}
      workload: {type: llm/throughput, input_len: 64, output_len: 64, prompts: 16, load: {executor: batch, requests: 16}}
    - name: throughput_granite33-8b_tp1_in64_out64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-3.3-8b-instruct, model: granite-3.3-8b-instruct, precision: fp16, tp: 1, flags: {load-format: auto, max-model-len: 128}}
      workload: {type: llm/throughput, input_len: 64, output_len: 64, prompts: 16, load: {executor: batch, requests: 16}}
