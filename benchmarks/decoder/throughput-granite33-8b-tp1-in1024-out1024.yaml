# test_name of vllm-benchmarks/benchmarks/spyre/throughput-tests-dev.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: throughput-granite33-8b-tp1-in1024-out1024, description: 'offline batch (vllm bench throughput)', owner: spyre-inference}
spec:
  type: perf
  level: model
  tier: extended
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/throughput}
  metrics: {required: [llm.request_throughput], headline: [llm.request_throughput]}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --suite, dev, --bench-types, throughput, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: throughput_granite33-8b_tp1_in1024_out1024
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: throughput}
      - {key: tensor_parallel, value: 1}
      - {key: input_len, value: 1024}
      - {key: output_len, value: 1024}
  variants:
    - name: throughput_granite33-8b_tp1_in1024_out1024
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-3.3-8b-instruct, model: granite-3.3-8b-instruct, precision: fp16, tp: 1, flags: {load-format: auto, max-model-len: 2048, max-num-seqs: 4}}
      workload: {type: llm/throughput, input_len: 1024, output_len: 1024, prompts: 100, load: {executor: batch, requests: 100}}
