# Variant names are the pooling entries of serve-tests.yaml. The runner uses /rerank, which the schema's
# endpoint values lack; workload.endpoint is the nearest value (/v1/rerank) and the exact path is in flags.endpoint.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: serve-encoder, description: 'embedding and rerank serving on random inputs (vllm bench serve)', owner: spyre-inference}
spec:
  type: perf
  level: service
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/serve}
  run: {cache: warm, repeats: 1}
  variants:
    - name: serve_granite-embedding-125m-english_tp1_in64
      tier: sanity
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-embedding-125m-english, model: granite-embedding-125m-english, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 512}}
      workload: {type: llm/serve, endpoint: '/v1/embeddings', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 512, sampling: {ignore_eos: true}, flags: {dataset-name: random, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: openai-embeddings, random-range-ratio: 0.5, random-batch-size: 1}}
    - name: serve_granite-embedding-278m-multilingual_tp1_in64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: granite-embedding-278m-multilingual, model: granite-embedding-278m-multilingual, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 512}}
      workload: {type: llm/serve, endpoint: '/v1/embeddings', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 512, sampling: {ignore_eos: true}, flags: {dataset-name: random, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: openai-embeddings, random-range-ratio: 0.5, random-batch-size: 1}}
    - name: serve_multilingual-e5-large_tp1_in64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: multilingual-e5-large, model: multilingual-e5-large, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 512}}
      workload: {type: llm/serve, endpoint: '/v1/embeddings', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 512, sampling: {ignore_eos: true}, flags: {dataset-name: random, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: openai-embeddings, random-range-ratio: 0.5, random-batch-size: 1}}
    - name: serve_all-roberta-large-v1_tp1_in64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: all-roberta-large-v1, model: all-roberta-large-v1, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 256}}
      workload: {type: llm/serve, endpoint: '/v1/embeddings', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 256, sampling: {ignore_eos: true}, flags: {dataset-name: random, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: openai-embeddings, random-range-ratio: 0.5, random-batch-size: 1}}
    - name: serve_bge-reranker-v2-m3_tp1_in64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: bge-reranker-v2-m3, model: bge-reranker-v2-m3, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 512}}
      workload: {type: llm/serve, endpoint: '/v1/rerank', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 512, sampling: {ignore_eos: true}, flags: {dataset-name: random-rerank, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: vllm-rerank, random-range-ratio: 0.5, random-batch-size: 1, endpoint: '/rerank'}}
    - name: serve_bge-reranker-large_tp1_in64
      tier: core
      environment: spyre-1card
      system: {type: llm/vllm, backend: spyre, token: bge-reranker-large, model: bge-reranker-large, precision: fp16, tp: 1, flags: {load-format: auto, max-num-seqs: 4, max-num-batched-tokens: 512, enable-prefix-caching: true, runner: pooling, max-model-len: 512}}
      workload: {type: llm/serve, endpoint: '/v1/rerank', load: {executor: closed, concurrency: 64, requests: 200, warmup_requests: 8}, input_len: 512, sampling: {ignore_eos: true}, flags: {dataset-name: random-rerank, custom-output-len: -1, disable-shuffle: true, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', backend: vllm-rerank, random-range-ratio: 0.5, random-batch-size: 1, endpoint: '/rerank'}}
