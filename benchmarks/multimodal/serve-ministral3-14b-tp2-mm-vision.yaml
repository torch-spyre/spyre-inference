# test_name of vllm-benchmarks/benchmarks/spyre/multimodal-serve-tests.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: serve-ministral3-14b-tp2-mm-vision, description: 'chat serving replaying a recorded image dataset (vllm bench serve)', owner: spyre-inference}
spec:
  type: perf
  level: service
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/serve}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --bench-types, serve, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: serve_ministral3-14b_tp2_mm_vision
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: serve}
      - {key: tensor_parallel, value: 2}
      - {key: input_len, value: ''}
      - {key: output_len, value: ''}
  variants:
    - name: serve_ministral3-14b_tp2_mm_vision
      environment: spyre-2card
      system: {type: llm/vllm, backend: spyre, token: ministral-3-14b-instruct-2512-bf16, model: ministral-3-14b-instruct-2512-bf16, precision: bf16, tp: 2, flags: {load-format: auto, max-model-len: 32768, limit-mm-per-prompt: '{"image": 4}'}}
      workload: {type: llm/serve, endpoint: /v1/chat/completions, load: {executor: closed, concurrency: 4, requests: -1}, inputs: [{name: prompts, dataset: slot-15}], output_len: 256, sampling: {ignore_eos: true}, flags: {dataset-name: custom_image, backend: openai-chat, tokenizer-mode: hf, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100'}}
