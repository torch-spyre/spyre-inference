# test_name of vllm-benchmarks/benchmarks/spyre/multimodal-serve-tests.yaml, lower-cased.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: serve-ministral3-14b-tp4-mm-random, description: 'chat serving with random multimodal prompts (vllm bench serve)', owner: spyre-inference}
spec:
  type: perf
  level: service
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/serve}
  run:
    cache: warm
    repeats: 1
    command: [python3, .github/scripts/bench_perf_vllm.py, run, --case, '{case}', --repeat-dir, '{repeat_dir}', --raw-dir, '{raw_dir}', '--', uv, run, --active, --no-sync, python3, .github/scripts/run_vllm_benchmarks.py, --configs-dir, vllm-benchmarks/benchmarks/spyre, --bench-types, serve, --tests, '{case}', --results-dir, '{raw_dir}']
  identity:
    mode: ingest
    profile: vllm
    name: serve_ministral3-14b_tp4_mm_random
    discriminators:
      - {key: record_type, value: model}
      - {key: run_mode, value: serve}
      - {key: tensor_parallel, value: 4}
      - {key: input_len, value: ''}
      - {key: output_len, value: ''}
  variants:
    - name: serve_ministral3-14b_tp4_mm_random
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: ministral-3-14b-instruct-2512-bf16, model: ministral-3-14b-instruct-2512-bf16, precision: bf16, tp: 4, flags: {load-format: auto, max-model-len: 32768}}
      workload: {type: llm/serve, endpoint: /v1/chat/completions, load: {executor: closed, concurrency: 4, requests: 200}, input_len: 8192, output_len: 128, sampling: {ignore_eos: true}, flags: {dataset-name: random-mm, backend: openai-chat, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', random-mm-limit-mm-per-prompt: '{"image": 1, "video": 0}', random-mm-bucket-config: '{(2048, 2048, 1): 1}'}}
