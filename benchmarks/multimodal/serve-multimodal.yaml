# Variant names are the random-mm entries of multimodal-serve-tests.yaml. The vision-replay entry is not defined here yet.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: serve-multimodal, description: 'chat serving with random multimodal prompts (vllm bench serve)', owner: spyre-inference}
spec:
  type: perf
  level: service
  tier: core
  env: {DTLOG_LEVEL: error}
  system: {type: llm/vllm, backend: spyre}
  workload: {type: llm/serve}
  run: {cache: warm, repeats: 1}
  variants:
    - name: serve_ministral3-14b_tp4_mm_random
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: ministral-3-14b-instruct-2512-bf16, model: ministral-3-14b-instruct-2512-bf16, precision: bf16, tp: 4, flags: {load-format: auto, max-model-len: 32768}}
      workload: {type: llm/serve, endpoint: '/v1/chat/completions', load: {executor: closed, concurrency: 4, requests: 200}, input_len: 8192, output_len: 128, sampling: {ignore_eos: true}, flags: {dataset-name: random-mm, backend: openai-chat, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', random-mm-limit-mm-per-prompt: '{"image": 1, "video": 0}', random-mm-bucket-config: '{(2048, 2048, 1): 1}'}}
    - name: serve_gemma4-26b-a4b-it_tp4_mm_random
      tier: core
      environment: spyre-4card
      system: {type: llm/vllm, backend: spyre, token: gemma-4-26b-a4b-it, model: gemma-4-26b-a4b-it, precision: fp16, tp: 4, flags: {load-format: auto, max-model-len: 32768}}
      workload: {type: llm/serve, endpoint: '/v1/chat/completions', load: {executor: closed, concurrency: 4, requests: 200}, input_len: 8192, output_len: 128, sampling: {ignore_eos: true}, flags: {dataset-name: random-mm, backend: openai-chat, percentile-metrics: 'ttft,tpot,itl,e2el', metric-percentiles: '99,100', random-mm-limit-mm-per-prompt: '{"image": 1, "video": 0}', random-mm-bucket-config: '{(2048, 2048, 1): 1}'}}
