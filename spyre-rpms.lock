# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_104" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2453.e73ea88_340" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2453.e73ea88_340" }
ibm-flex              = { version = "2.0.0-0.main.1+565.783ade2_398" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+565.783ade2_398" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+273.9397df3_257" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+273.9397df3_257" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+273.9397df3_257" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+154.ce55e90_192" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+154.ce55e90_192" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+28.db75577_16" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2453.e73ea88_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2453.e73ea88_*" }
ibm-flex              = { version = "2.0.0-0.main.1+565.783ade2_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+565.783ade2_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+154.ce55e90_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+154.ce55e90_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+28.db75577_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2453.e73ea88_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2453.e73ea88_*" }
ibm-flex              = { version = "2.0.0-0.main.1+565.783ade2_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+565.783ade2_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+273.9397df3_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+154.ce55e90_*" }
