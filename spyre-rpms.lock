# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_97" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2416.7335e3a_327" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2416.7335e3a_327" }
ibm-flex              = { version = "2.0.0-0.main.1+532.8e8ba8a_359" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+532.8e8ba8a_359" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+266.64acf70_243" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+266.64acf70_243" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+266.64acf70_243" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+139.ff30c23_171" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+139.ff30c23_171" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+24.b08c1c2_6" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2416.7335e3a_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2416.7335e3a_*" }
ibm-flex              = { version = "2.0.0-0.main.1+532.8e8ba8a_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+532.8e8ba8a_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+139.ff30c23_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+139.ff30c23_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+24.b08c1c2_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2416.7335e3a_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2416.7335e3a_*" }
ibm-flex              = { version = "2.0.0-0.main.1+532.8e8ba8a_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+532.8e8ba8a_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+266.64acf70_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+139.ff30c23_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+139.ff30c23_*" }
