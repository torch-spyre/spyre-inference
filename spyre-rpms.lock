# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_164" }
ibm-deeptools         = { version = "2.0.0-0.release_2_0.1+2644.3f91855_5" }
ibm-deeptools-devel   = { version = "2.0.0-0.release_2_0.1+2644.3f91855_5" }
ibm-flex              = { version = "2.0.0-0.main.1+667.1b0a0dd_573" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+667.1b0a0dd_573" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+308.a6d8f22_433" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+308.a6d8f22_433" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+308.a6d8f22_433" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+200.4fcbe0d_295" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+200.4fcbe0d_295" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+40.bcdd0af_83" }

# Power
# ppc64le is held on an older set: no prod ibm-deeptools build that ships
# libspyrecode-host-functions.so (required by ibm-flex 654.66c3c08 and later)
# is published for ppc64le, so the pinned torch-spyre rev does not build
# against these pins. Move ppc64le to the x86_64/s390x commits once
# ibm-deeptools 2.0.0-0.release_2_0.1+2644.3f91855 (or later) is published
# for it.
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-flex              = { version = "2.0.0-0.main.1+648.d80b102_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+648.d80b102_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+193.42e3736_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+193.42e3736_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+39.ffb7877_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_*" }
ibm-deeptools         = { version = "2.0.0-0.release_2_0.1+2644.3f91855_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.release_2_0.1+2644.3f91855_*" }
ibm-flex              = { version = "2.0.0-0.main.1+667.1b0a0dd_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+667.1b0a0dd_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+308.a6d8f22_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+200.4fcbe0d_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+200.4fcbe0d_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+40.bcdd0af_*" }
