# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_101" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2429.561f418_335" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2429.561f418_335" }
ibm-flex              = { version = "2.0.0-0.main.1+553.8581a91_384" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+553.8581a91_384" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+268.c58bbc0_251" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+268.c58bbc0_251" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+268.c58bbc0_251" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+146.a445334_182" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+146.a445334_182" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+27.e289f7d_13" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2429.561f418_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2429.561f418_*" }
ibm-flex              = { version = "2.0.0-0.main.1+553.8581a91_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+553.8581a91_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+146.a445334_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+146.a445334_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+27.e289f7d_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+28.47d9b91_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2429.561f418_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2429.561f418_*" }
ibm-flex              = { version = "2.0.0-0.main.1+553.8581a91_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+553.8581a91_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+268.c58bbc0_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+146.a445334_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+146.a445334_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+27.e289f7d_*" }
