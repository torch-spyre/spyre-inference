# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_155" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2628.5a2d7b4_420" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2628.5a2d7b4_420" }
ibm-flex              = { version = "2.0.0-0.main.1+640.1decee7_537" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+640.1decee7_537" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+304.f72841d_418" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+304.f72841d_418" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+304.f72841d_418" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+185.828bf4b_271" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+185.828bf4b_271" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+35.1b06dee_69" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-flex              = { version = "2.0.0-0.main.1+640.1decee7_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+640.1decee7_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+185.828bf4b_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+185.828bf4b_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+35.1b06dee_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+33.a2b6d58_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2628.5a2d7b4_*" }
ibm-flex              = { version = "2.0.0-0.main.1+640.1decee7_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+640.1decee7_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+304.f72841d_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+185.828bf4b_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+185.828bf4b_*" }
