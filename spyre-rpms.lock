# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+34.7cc4c2a_167" }
ibm-deeptools         = { version = "2.1.0-0.main.1+2800.19bfed1_481" }
ibm-deeptools-devel   = { version = "2.1.0-0.main.1+2800.19bfed1_481" }
ibm-flex              = { version = "2.0.0-0.main.1+670.ca709e9_578" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+670.ca709e9_578" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+312.bd08a41_438" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+312.bd08a41_438" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+312.bd08a41_438" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+205.afbdb60_302" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+205.afbdb60_302" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+40.bcdd0af_85" }

# Power
# ibm-deeptools now ships a prod ppc64le build at the same commit as x86_64/s390x
# (commit 19bfed1), so Power is unblocked and tracks the same commits as the
# other arches again.
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+34.7cc4c2a_*" }
ibm-deeptools         = { version = "2.1.0-0.main.1+2800.19bfed1_*" }
ibm-deeptools-devel   = { version = "2.1.0-0.main.1+2800.19bfed1_*" }
ibm-flex              = { version = "2.0.0-0.main.1+670.ca709e9_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+670.ca709e9_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+205.afbdb60_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+205.afbdb60_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+40.bcdd0af_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+34.7cc4c2a_*" }
ibm-deeptools         = { version = "2.1.0-0.main.1+2800.19bfed1_*" }
ibm-deeptools-devel   = { version = "2.1.0-0.main.1+2800.19bfed1_*" }
ibm-flex              = { version = "2.0.0-0.main.1+670.ca709e9_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+670.ca709e9_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+312.bd08a41_*" }
ibm-spyre-comms       = { version = "2.0.0-0.main.1+205.afbdb60_*" }
ibm-spyre-comms-devel = { version = "2.0.0-0.main.1+205.afbdb60_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+40.bcdd0af_*" }
