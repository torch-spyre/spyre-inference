# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
# Each `version` pins a commit, not a filename (the per-arch `_<buildnum>`
# diverges); .github/scripts/resolve_rpms.py resolves the build per arch.

version = 1

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the base tree.
tree = ""

[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+27.4f08606" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2245.85f9432" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2245.85f9432" }
ibm-flex              = { version = "2.0.0-0.main.1+477.c717aa5" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+477.c717aa5" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+236.ef4dc48" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+236.ef4dc48" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+236.ef4dc48" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+120.503dab8" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+120.503dab8" }
# only published in the `next` tree; its name embeds a build hash (the `*`).
ibm-libaiupti         = { version = "2.0.0-0.main.20+20.*.932bdf5", tree = "next" }
