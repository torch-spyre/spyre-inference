# 🔥 HAND-WRITTEN, NOT GENERATED: prod snaps have failed since 2026-11-11 (their Jenkins can't
# reach github.ibm.com), so there is no bundle to lock from. lock_spyre_rpms.py can't produce
# this file and `Check spyre-rpms.lock` is red on purpose. Don't "fix" it.
#
# x86_64 is ONE dev nightly, all of it: next/_nodes/orchestrator-10780 (2026-11-25) in the
# generic repo; its plan pins every dependency identity used here. Never mix in individual
# newer next/ builds: -devel and base drift apart and PR builds land in the same tree.
# Power/Z stay on main_snap_2026_11_11_09 (tree = ""): no complete nightly there.
#
# When prod snaps are back: revert this file, set [tool.spyre-rpms] bundle, re-run the tool.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/). "next" = the dev tree. "" would be prod.
tree = "next"

[bundle]
# Not a real bundle. Must equal [tool.spyre-rpms] bundle and SPYRE_RPM_BUNDLE in pyproject.toml.
id = "next_nightly_2026_11_25_orch10780"

# x86_64: exact dev builds
[packages]
