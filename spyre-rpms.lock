# Pinned Spyre RPM baseline for CI.
#
# GENERATED FILE -- do not edit by hand. Regenerate with:
#   ./scripts/spyre_rpms.py resolve
# and verify an existing one offline (no Artifactory) with:
#   ./scripts/spyre_rpms.py verify
#
# Every package below comes from ONE build plan (orchestrator-7457), and each component's recorded dependency
# shas were checked against the other components in the set, so the
# whole set is ABI-coherent by construction.
#
# All three arches pin the exact build: the identity (the 12-hex field)
# is derived from the source and dependency shas, not the platform, so it
# is the same on x86_64, ppc64le and s390x.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = "next"

# x86_64
