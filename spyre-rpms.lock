# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+32.c542b73_119" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2526.e7f53c7_379" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2526.e7f53c7_379" }
ibm-flex              = { version = "2.0.0-0.main.1+594.cbb1520_446" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+594.cbb1520_446" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+287.c03a843_314" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+287.c03a843_314" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+287.c03a843_314" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+169.a93a997_218" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+169.a93a997_218" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+32.079e605_32" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+32.c542b73_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-flex              = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+169.a93a997_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+169.a93a997_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+32.079e605_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+32.c542b73_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-flex              = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+169.a93a997_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+169.a93a997_*" }
