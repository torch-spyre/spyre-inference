# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the `next` tree, which the dev pipelines populate
# for main-branch builds on all three arches.
#
# x86_64 is pinned to an exact build. Power (ppc64le) and Z (s390x) pins use the
# same commit, but leave the build hash wildcarded: the builds differ across
# platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = "next"

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0_rc.5-0.main.6+6.3307e2f9.bba205429228.3307e2f" }
ibm-deeptools         = { version = "2.0.0_rc.1-0.master.198+198.092f4e79.b591b2c83606.092f4e7" }
ibm-deeptools-devel   = { version = "2.0.0_rc.1-0.master.198+198.092f4e79.b591b2c83606.092f4e7" }
ibm-flex              = { version = "2.0.0_rc.1-0.main.87+87.5aaf4902.5cefcccce4cf.5aaf490" }
ibm-flex-devel        = { version = "2.0.0_rc.1-0.main.87+87.5aaf4902.5cefcccce4cf.5aaf490" }
ibm-senlib-core       = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.c7bc40ab1aa0.15d57f0" }
ibm-senlib-dd2        = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.c7bc40ab1aa0.15d57f0" }
ibm-senlib-headers    = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.c7bc40ab1aa0.15d57f0" }
ibm-spyre-comms       = { version = "2.0.0_rc.1-0.main.34+34.748f4ace.2c1372c287a5.748f4ac" }
ibm-spyre-comms-devel = { version = "2.0.0_rc.1-0.main.34+34.748f4ace.2c1372c287a5.748f4ac" }
ibm-libaiupti         = { version = "2.0.0_rc.2-0.main.17+17.3c1815cb.24d8f8a832e9.3c1815c" }

# Power
