# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_109" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2526.e7f53c7_378" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2526.e7f53c7_378" }
ibm-flex              = { version = "2.0.0-0.main.1+594.cbb1520_445" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+594.cbb1520_445" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+287.c03a843_319" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+287.c03a843_319" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+287.c03a843_319" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+169.a93a997_217" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+169.a93a997_217" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+30.ef4e622_23" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2470.fb2446d_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2470.fb2446d_*" }
ibm-flex              = { version = "2.0.0-0.main.1+570.c11584a_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+570.c11584a_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+280.3869e2e_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+280.3869e2e_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+280.3869e2e_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+154.ce55e90_*" }
ibm-spyre-comms-devel = { version = "1.0.0-0.main.1+154.ce55e90_*" }
ibm-libaiupti         = { version = "2.0.0-0.main.1+30.ef4e622_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-0.main.1+29.0826a00_*" }
ibm-deeptools         = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-deeptools-devel   = { version = "2.0.0-0.main.1+2526.e7f53c7_*" }
ibm-flex              = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-flex-devel        = { version = "2.0.0-0.main.1+594.cbb1520_*" }
ibm-senlib-core       = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-dd2        = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-senlib-headers    = { version = "2.0.0-0.main.1+287.c03a843_*" }
ibm-spyre-comms       = { version = "1.0.0-0.main.1+169.a93a997_*" }
