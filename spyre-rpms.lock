ibm-deeptools         = { version = "2.0.0_rc.1-0.master.198+198.092f4e79.*" }
ibm-deeptools-devel   = { version = "2.0.0_rc.1-0.master.198+198.092f4e79.*" }
ibm-flex              = { version = "2.0.0_rc.1-0.main.87+87.5aaf4902.*" }
ibm-flex-devel        = { version = "2.0.0_rc.1-0.main.87+87.5aaf4902.*" }
ibm-senlib-core       = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.*" }
ibm-senlib-dd2        = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.*" }
ibm-senlib-headers    = { version = "2.0.0_rc.5-0.main.25+25.15d57f06.*" }
ibm-spyre-comms       = { version = "2.0.0_rc.1-0.main.34+34.748f4ace.*" }
