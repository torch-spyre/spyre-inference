# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# All arches pin the same commit; the trailing `_<buildnum>` is wildcarded
# (`_*`) because build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools         = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.8_*" }
ibm-flex              = { version = "2.0.0-1.rc.8_*" }
ibm-flex-devel        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-core       = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.8_*" }
ibm-libaiupti         = { version = "2.0.0-1.rc.8_*" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools         = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.8_*" }
ibm-flex              = { version = "2.0.0-1.rc.8_*" }
ibm-flex-devel        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-core       = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.8_*" }
ibm-libaiupti         = { version = "2.0.0-1.rc.8_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools         = { version = "2.0.0-1.rc.8_*" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.8_*" }
ibm-flex              = { version = "2.0.0-1.rc.8_*" }
ibm-flex-devel        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-core       = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.8_*" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.8_*" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.8_*" }
ibm-libaiupti         = { version = "2.0.0-1.rc.8_*" }
