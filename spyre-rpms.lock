# Pinned Spyre RPM baseline for CI. Regenerate with `upgrade-torch-spyre`.
#
# All packages are published in the "prod" (base) tree. The `next` tree is
# available to use for dev preview builds.
#
# x86_64 is pinned to an exact build including the trailing `_<buildnum>`.
# Power (ppc64le) and Z (s390x) pins should use the same commit, but are
# left wildcarded: The build numbers differ across platforms.

version = 2

[defaults]
# Artifactory subdir (<repo>/<tree>/<arch>/); "" is the prod/base tree.
tree = ""

# x86_64
[packages]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.2_1" }
ibm-deeptools         = { version = "2.0.0-1.rc.2_1" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.2_1" }
ibm-flex              = { version = "2.0.0-1.rc.2_1" }
ibm-flex-devel        = { version = "2.0.0-1.rc.2_1" }
ibm-senlib-core       = { version = "2.0.0-1.rc.2_1" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.2_1" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.2_1" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.2_1" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.2_1" }
ibm-libaiupti         = { version = "2.0.0-1.rc.2_1" }

# Power
[overrides.ppc64le]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.2_*" }
ibm-deeptools         = { version = "2.0.0-1.rc.2_*" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.2_*" }
ibm-flex              = { version = "2.0.0-1.rc.2_*" }
ibm-flex-devel        = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-core       = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.2_*" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.2_*" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.2_*" }
ibm-libaiupti         = { version = "2.0.0-1.rc.2_*" }

# Z
[overrides.s390x]
ibm-aiu-toolbox-e2e   = { version = "2.0.0-1.rc.2_*" }
ibm-deeptools         = { version = "2.0.0-1.rc.2_*" }
ibm-deeptools-devel   = { version = "2.0.0-1.rc.2_*" }
ibm-flex              = { version = "2.0.0-1.rc.2_*" }
ibm-flex-devel        = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-core       = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-dd2        = { version = "2.0.0-1.rc.2_*" }
ibm-senlib-headers    = { version = "2.0.0-1.rc.2_*" }
ibm-spyre-comms       = { version = "2.0.0-1.rc.2_*" }
ibm-spyre-comms-devel = { version = "2.0.0-1.rc.2_*" }
ibm-libaiupti         = { version = "2.0.0-1.rc.2_*" }
