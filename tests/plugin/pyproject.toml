[build-system]
requires = ["setuptools>=82", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "spyre-testing-plugin"
description = "pytest plugin for spyre-inference upstream test integration"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    "pytest",
    "pyyaml",
    # Net-new upstream vLLM test deps — GENERATED by sync_upstream_test_deps
    # from ALLOW_LIST. Do not hand-edit; edit the allow-list and re-run.
    # Versions/extras track vLLM cuda.in.
    "buildkite-test-collector==0.1.9",
    "datasets>=3.3.0,<=3.6.0",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-forked",
    "pytest-rerunfailures",
    "pytest-shard",
    "pytest-timeout",
    "sentence-transformers>=5.2.0",  # required for embedding tests
    "tblib",  # for pickling test exceptions
]
requires-python = ">=3.11"
dynamic = ["version"]

# Register the pytest plugin
[project.entry-points."pytest11"]
spyre_inference_test = "spyre_testing_plugin.pytest_plugin"

# Register the CLI entrypoint for syncing upstream test dependencies
[project.scripts]
sync-upstream-test-deps = "spyre_testing_plugin.sync_upstream_test_deps:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spyre_testing_plugin*"]

[tool.setuptools_scm]
version_file = "spyre_testing_plugin/_version.py"
local_scheme = "no-local-version"
root = "../.."

[dependency-groups]
dev = [
    "pytest",
]
