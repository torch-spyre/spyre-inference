# Upstream test filter configuration for spyre-inference.
#
# Only tests listed here will run from upstream vLLM. All other upstream
# tests are skipped by default (opt-in / allowlist model).
#
# block_list entries take precedence over allow_list entries.
#
# Fields:
#   rel_path          Path relative to upstream vLLM repo root
#   allow_list[].test fnmatch glob matched against test function name
#   allow_list[].mode mandatory_pass (default) | skip | skip | skip_strict
#   allow_list[].tags Labels applied as pytest markers (filterable via -m)
#   allow_list[].params.skip
#                     Parameter name -> list of values to skip
#   allow_list[].params.override
#                     Parameter name -> replacement values (replaces upstream defaults)
#   allow_list[].tolerances
#                     Optional tolerance config for torch.testing.assert_close:
#                       atol: float (absolute tolerance)
#                       rtol: float (relative tolerance)
#   allow_list[].fixture_names Fixture names to inject for this test.
#                              These fixtures are automatically added to the test's
#                              fixturenames during collection.
#   block_list[].test fnmatch glob matched against test function name

tests:
  files:
    # test_layernorm.py and test_activation.py cannot be used with the empty
    # backend: they reference torch.ops._C.* in module-scope parametrize
    # decorators, which causes collection failures when _C.so is not built.

    - rel_path: tests/models/language/generation/test_common.py
      allow_list:
        - test: "test_models"
          mode: mandatory_pass
          # uses_subprocess marker is added to make these tests run first.
          # This must be added for any sets of tests that use `vllm.LLM`
          tags: [model, upstream, uses_subprocess]
          params:
            allow:
              model:
                # - openai-community/gpt2 # needs opaque-attention CPU dispatch + tied-weight lm_head fix
                - facebook/opt-125m
                - meta-llama/Llama-3.2-1B-Instruct
                - mistralai/Mistral-7B-Instruct-v0.3
                - Qwen/Qwen2.5-0.5B-Instruct # tied-weight lm_head
                # - TitanML/tiny-mixtral # needs swa support
                # - google/gemma-2-2b-it # sliding-window model; blocked by IOMMU DMA aperture limit (unrelated to this PR)
            override:
              max_tokens: [2] # one prefill and one decode for speed
            skip:
              # input embeddings not yet supported on spyre
              use_prompt_embeds: [true]

    # TODO: The rel_path below is stale — upstream moved these to
    #       tests/models/transformers/test_backend.py in v0.27.1. Re-enabling also needs
    #       test_models' HF-CPU reference to be reconcilable with fp16 on Spyre: it
    #       compares 32 tokens of logprobs via check_logprobs_close. Until then,
    #       tests/e2e/test_transformers_backend.py covers the same ground against the native
    #       Spyre path.
    # - rel_path: tests/models/test_transformers.py
    #   allow_list:
    #     - test: "test_models"
    #       mode: mandatory_pass
    #       tags: [transformers, upstream, uses_subprocess]
    #       params:
    #         override:
    #           "model,model_impl":
    #           - ["ibm-ai-platform/micro-g3.3-8b-instruct-1b", "transformers"]
    #           - ["meta-llama/Llama-3.2-1B-Instruct", "transformers"]
    #     - test: "test_distributed"
    #       mode: mandatory_pass
    #       tags: [transformers, upstream, uses_subprocess, distributed]
    #   block_list:
    #     - test: "test_quantization"
    #     - test: "test_embed_loading"
    #     - test: "test_hybrid_attention"
    #     - test: "test_pooling"

    - rel_path: tests/v1/attention/test_attention_backends.py
      allow_list:
        - test: "test_causal_backend_correctness"
          # The platform override ensures block_size is a multiple of 64.
          mode: mandatory_pass
          tags: [attention, upstream]
          params:
            allow:
              tensor_parallel_size:
                - 1
                - 2
                - 4
              batch_spec_name:
                - single_decode
                - single_prefill
                - small_decode
                - small_prefill
                - mixed_small
          fixture_names:
            - "patch_backend_list"

    - rel_path: tests/models/language/generation/test_granite.py
      allow_list:
        - test: "test_models"
          mode: mandatory_pass
          tags: [granite, upstream, uses_subprocess]
          params:
            override:
              model:
                - ibm-ai-platform/micro-g3.3-8b-instruct-1b
                - ibm-granite/granite-4.1-3b
              dtype: [torch.float16]
              max_tokens: [2] # one prefill and one decode

    # gemma-3-1b-it is hybrid; test_dummy_loader exercises engine startup + KV
    # cache init (the hybrid block-override path) with dummy weights, isolating
    # it from gemma-3 generation quality. Injected via override (not in MODELS).
    - rel_path: tests/models/language/generation/test_gemma.py
      allow_list:
        - test: "test_dummy_loader"
          mode: mandatory_pass
          tags: [gemma, upstream, uses_subprocess]
          params:
            override:
              model:
                - google/gemma-3-1b-it

    - rel_path: tests/models/language/generation_ppl_test/test_qwen.py
      allow_list:
        - test: "test_ppl"
          mode: skip # model_info0 (Qwen3-0.6B): RAS::VFIO::MapDMAFailed; model_info1 (Qwen3-0.6B-FP8): KeyError PlatformEnum.OOT - FP8 quant not supported on Spyre; model_info2 (Qwen3.5-0.8B): Qwen3_5ForConditionalGeneration not in vLLM registry
          tags: [model, generation, upstream, uses_subprocess]

    - rel_path: tests/models/language/pooling/test_embedding.py
      allow_list:
        - test: "test_models"
          mode: mandatory_pass
          tags: [model, embedding, upstream, uses_subprocess]
          params:
            allow:
              model:
                - BAAI/bge-base-en-v1.5
                - sentence-transformers/all-MiniLM-L12-v2

    - rel_path: tests/models/language/pooling/test_auto_prefix_cache_support.py
      allow_list:
        - test: "test_embed_models"
          # Prefix-cache path for embeds not validated on Spyre yet.
          mode: skip # RuntimeError: Spyre backend does not support type conversion yet during copy
          tags: [model, embedding, upstream, uses_subprocess]
          params:
            override:
              model: ["BAAI/bge-m3"]

    - rel_path: tests/basic_correctness/test_basic_correctness.py
      allow_list:
        - test: "test_models"
          # hardcoded prompt is ~5042 tokens; doesn't fit MAX_MODEL_LEN_CAP=128.
          # Re-enable once the on-device KV cache cap is raised.
          mode: skip
          tags: [model, basic_correctness, upstream, uses_subprocess]
          params:
            override:
              model:
                # - Qwen/Qwen3-0.6B # needs rmsnorm dispatch fix
                - ibm-ai-platform/micro-g3.3-8b-instruct-1b
              backend: ["CUSTOM"]
              enforce_eager: [true]
        - test: "test_models_distributed"
          mode: mandatory_pass
          tags:
            [model, basic_correctness, upstream, uses_subprocess, distributed]
          params:
            override:
              # Upstream uses a single tuple parametrize keyed
              # `(model, distributed_executor_backend, attention_backend, test_suite, extra_env)`;
              # supply the full tuple per row.
              "model, distributed_executor_backend, attention_backend, target_test_suites, extra_env":
                - ["ibm-ai-platform/micro-g3.3-8b-instruct-1b", "mp", "CUSTOM", ["L4"], {}]
            skip:
              # input embeddings not yet supported on spyre
              enable_prompt_embeds: [true]

    # ---------------------------------------------------------------------
    # Multimodal (Pixtral vision tower + Ministral-3 decoder)
    #
    # All host-side (config + processor, no weights), so it runs card-less.
    # Upstream's registry only lists the 3B, so `register_ministral_14b` adds the
    # 14B this plugin is built against.
    # ---------------------------------------------------------------------
    # The only upstream test that exercises Pixtral itself: HF vs vLLM processor on
    # the same inputs (patch-grid geometry, resizing, placeholder insertion) — the
    # preprocessing that feeds the patched vision tower.
    - rel_path: tests/models/multimodal/processing/test_common.py
      allow_list:
        - test: "test_processing_correctness"
          mode: mandatory_pass
          tags: [model, multimodal, upstream]
          fixture_names:
            - "register_ministral_14b"
          params:
            override:
              model_id:
                - mistralai/Ministral-3-14B-Instruct-2512-BF16

    # Shared multimodal machinery: the layer that builds and batches the
    # `MultiModalKwargs` our `embed_multimodal` / `embed_input_ids` receive.
    # Only the prompt-update tests are taken; the rest of the file builds a
    # ModelConfig for llava / Qwen2-VL and exercises no Pixtral code.
    - rel_path: tests/multimodal/test_processing.py
      allow_list:
        - test: "test_find_*" # token/text matches, updates, mm placeholders
          mode: mandatory_pass
          tags: [multimodal, upstream]
        - test: "test_iter_token_matches"
          mode: mandatory_pass
          tags: [multimodal, upstream]
        - test: "test_replace_token_matches"
          mode: mandatory_pass
          tags: [multimodal, upstream]
        - test: "test_apply_matches_*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    - rel_path: tests/multimodal/test_inputs.py
      allow_list:
        - test: "*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    - rel_path: tests/multimodal/test_parse.py
      allow_list:
        - test: "*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    - rel_path: tests/multimodal/test_hasher.py
      allow_list:
        - test: "*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    - rel_path: tests/multimodal/test_image.py
      allow_list:
        - test: "*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    - rel_path: tests/multimodal/test_utils.py
      allow_list:
        - test: "*"
          mode: mandatory_pass
          tags: [multimodal, upstream]

    # End-to-end VLM generation, blocked on Spyre: `@large_gpu_test` needs CUDA,
    # `dtype="bfloat16"` is hardcoded against our forced float16, and it asserts
    # golden logprobs recorded on an H100 in bfloat16.
    # tests/e2e/test_multimodal.py covers this ground against the Spyre path.
    - rel_path: tests/models/multimodal/generation/test_pixtral.py
      allow_list:
        - test: "test_chat_consolidated"
          mode: skip
          tags: [model, multimodal, upstream, uses_subprocess]
        - test: "test_chat" # Pixtral-12B, Mistral-Small-3.1-24B
          mode: skip
          tags: [model, multimodal, upstream, uses_subprocess]
