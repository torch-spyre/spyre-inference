# Latency benchmarks for google/gemma-4-26B-A4B.
#
# An entry runs in each suite its `labels` name, and every entry runs in the
# exhaustive suite. See vllm-benchmarks/README.md.
#
# in<N>_out<N> is part of the benchmark identity downstream
# (ingest_vllm_benchmarks.py::_parse_input_shapes), so a shape change here
# starts a new trend line.

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  parameters:
    dtype: float16
    load_format: auto
    batch-size: 1
    num-iters-warmup: 2
    num-iters: 10
    model: google/gemma-4-26B-A4B

tests:
  - test_name: latency_gemma4-26b-a4b_tp1_in1024_out1024
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      tensor_parallel_size: 1
      input-len: 1024
      output-len: 1024
      max-model-len: 2048

  - test_name: latency_gemma4-26b-a4b_tp1_in4096_out4096
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      tensor_parallel_size: 1
      input-len: 4096
      output-len: 4096
      max-model-len: 8192

  - test_name: latency_gemma4-26b-a4b_tp4_in1024_out1024
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3600'
    parameters:
      tensor_parallel_size: 4
      input-len: 1024
      output-len: 1024
      max-model-len: 2048

  - test_name: latency_gemma4-26b-a4b_tp4_in4096_out4096
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3600'
    parameters:
      tensor_parallel_size: 4
      input-len: 4096
      output-len: 4096
      max-model-len: 8192
