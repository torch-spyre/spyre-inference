# Latency benchmarks for ibm-granite/granite-3.3-8b-instruct.
#
# Each entry runs in the suites its `labels` name; an entry needs at least one.
# See vllm-benchmarks/README.md.
#
# in<N>_out<N> is part of the benchmark identity downstream
# (ingest_vllm_benchmarks.py::_parse_input_shapes), so a shape change here
# starts a new trend line.

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  parameters:
    model: ibm-granite/granite-3.3-8b-instruct
    dtype: float16
    load_format: auto
    batch-size: 1
    num-iters-warmup: 2
    num-iters: 10

tests:
  - test_name: latency_granite33-8b_tp1_in64_out64
    labels: [base]
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      tensor_parallel_size: 1
      input-len: 64
      output-len: 64
      max-model-len: 128
