# Serve benchmarks for google/gemma-4-26B-A4B-it.
#
# Each entry runs in the suites its `labels` name; an entry needs at least one.
# See vllm-benchmarks/README.md.

defaults:
  server_health_timeout: 7200
  environment_variables:
    DTLOG_LEVEL: error
  server_parameters:
    model: google/gemma-4-26B-A4B-it
    load-format: auto
    tensor-parallel-size: 4
    max-model-len: 32768
    max-num-seqs: 32
    enable-chunked-prefill: true
    enable-prefix-caching: true
  parameters:
    dataset-name: custom
    num-prompts: 200
    custom-output-len: -1
    ignore-eos: true
    disable-shuffle: true
    temperature: 0.1
    endpoint: /v1/completions
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100

tests:
  # TP4 · aiops
  - test_name: serve_gemma4-26b-a4b-it_tp4_c5_aiops
    labels: [reference]
    parameters:
      dataset-path: ${SPYRE_AIOPS_DATASET}
      max-concurrency: 5

  # TP4 · vision
  - test_name: serve_gemma4-26b-a4b-it_tp4_c4_vision
    labels: [reference]
    parameters:
      dataset-name: custom_image
      dataset-path: ${SPYRE_VISION_DATASET}
      backend: openai-chat
      endpoint: /v1/chat/completions
      num-prompts: 166
      output-len: 256
      max-concurrency: 4
