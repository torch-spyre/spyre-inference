# Serve benchmarks for ibm-granite/granite-4.2-8b-fp8.
#
# Each entry runs in the suites its `labels` name; an entry needs at least one.
# See vllm-benchmarks/README.md.

defaults:
  server_health_timeout: 7200
  environment_variables:
    DTLOG_LEVEL: error
  server_parameters:
    model: ibm-granite/granite-4.2-8b-fp8
    load-format: auto
    tensor-parallel-size: 4
    max-model-len: 32768
    max-num-seqs: 32
    enable-chunked-prefill: true
    enable-prefix-caching: true
  parameters:
    dataset-name: custom
    num-prompts: 200
    custom-output-len: -1
    ignore-eos: true
    disable-shuffle: true
    temperature: 0.1
    endpoint: /v1/completions
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100

tests:
  # TP4 · aiops
  - test_name: serve_granite42-8b-fp8_tp4_c5_aiops
    labels: [reference]
    parameters:
      dataset-path: ${SPYRE_AIOPS_DATASET}
      max-concurrency: 5

  # TP4 · all
  - test_name: serve_granite42-8b-fp8_tp4_c5_all
    labels: [base]
    parameters:
      dataset-path: ${SPYRE_ALL_SEQUENCES_DATASET}
      max-concurrency: 5
