# Serve benchmarks for ibm-granite/granite-4.2-8b.
#
# Each entry runs in the suites its `labels` name; an entry needs at least one.
# See vllm-benchmarks/README.md.
#
# TP4 entries use the defaults. TP1 entries override them with max-model-len
# 8192 and max-num-seqs 8: the TP4 KV cache does not fit on one card.

defaults:
  server_health_timeout: 7200
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  server_parameters:
    model: ibm-granite/granite-4.2-8b
    load-format: auto
    tensor-parallel-size: 4
    max-model-len: 32768
    max-num-seqs: 32
    enable-chunked-prefill: true
    enable-prefix-caching: true
  parameters:
    dataset-name: custom
    num-prompts: 200
    custom-output-len: -1
    ignore-eos: true
    disable-shuffle: true
    temperature: 0.1
    endpoint: /v1/completions
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100

tests:
  # TP4 · all
  - test_name: serve_granite42-8b_tp4_c5_all
    labels: [base]
    parameters:
      dataset-path: ${SPYRE_ALL_SEQUENCES_DATASET}
      max-concurrency: 5

  # TP1 · cics
  - test_name: serve_granite42-8b_tp1_c5_cics
    labels: [base]
    server_parameters:
      tensor-parallel-size: 1
      max-model-len: 8192
      max-num-seqs: 8
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      max-concurrency: 5
