# Serve benchmarks for dslim/bert-base-NER (pooling).
#
# Each entry runs in the suites its `labels` name; an entry needs at least one.
# See vllm-benchmarks/README.md.

defaults:
  server_health_timeout: 1800
  environment_variables:
    DTLOG_LEVEL: error
  server_parameters:
    load-format: auto
    max-num-seqs: 4
    enable-prefix-caching: false
    tensor-parallel-size: 1
    runner: pooling
    model: dslim/bert-base-NER
    max-model-len: 512
  parameters:
    dataset-name: random
    num-prompts: 10000
    random-input-len: 512
    random-range-ratio: 0.5
    num-warmups: 100
    request-rate: inf
    percentile-metrics: e2el
    metric-percentiles: 99,100
    model: dslim/bert-base-NER
    backend: vllm-pooling
    endpoint: /pooling
    extra-body: '{"task":"token_classify"}'
  container_parameters:
    container_shm_size: 1G
    container_memory: 16g

tests:
  # 10 000 random prompts and 100 warmups, at conc 16 / 32 / 64.
  - test_name: serve_bert-base-NER_tp1_c16
    labels: [reference]
    parameters:
      max-concurrency: 16

  - test_name: serve_bert-base-NER_tp1_c32
    labels: [reference]
    parameters:
      max-concurrency: 32

  - test_name: serve_bert-base-NER_tp1_c64
    labels: [base, reference]
    parameters:
      max-concurrency: 64
