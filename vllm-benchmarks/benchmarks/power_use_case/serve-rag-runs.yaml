# Serve benchmarks for the power use case: decoder models on SPYRE_RAG_DATASET, at TP4.
#
# Every entry is in the `power-applications` suite. See vllm-benchmarks/README.md.

defaults:
  labels: [power-applications]
  server_health_timeout: 3600
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  server_parameters:
    load-format: auto
    tensor-parallel-size: 4
    max-model-len: 32768
    max-num-seqs: 32
    num-gpu-blocks-override: 2049
  parameters:
    dataset-name: custom
    dataset-path: ${SPYRE_RAG_DATASET}
    ignore-eos: true
    backend: openai-chat
    endpoint: /v1/chat/completions
    num-prompts: 16
    max-concurrency: 4
    custom-output-len: 2048
    metric-percentiles: 99,100
    percentile-metrics: ttft,tpot,itl,e2el
    disable-shuffle: true


tests:

  # ---------------------------------------------------------------------------
  # Granite 3.3 8B instruct FP16
  # ---------------------------------------------------------------------------
  - test_name: serve_granite33-8b_tp4_c4_rag
    server_parameters:
      model: ibm-granite/granite-3.3-8b-instruct


  # ---------------------------------------------------------------------------
  # Granite 4.1 8B FP8
  # ---------------------------------------------------------------------------
  - test_name: serve_granite41-8b-fp8_tp4_c4_rag
    server_parameters:
      model: ibm-granite/granite-4.1-8b-fp8

  # ---------------------------------------------------------------------------
  # Llama 3.1 8B FP16
  # ---------------------------------------------------------------------------
  - test_name: serve_llama31-8b_tp4_c4_rag
    server_parameters:
      model: meta-llama/Llama-3.1-8B-Instruct

  # ---------------------------------------------------------------------------
  # Ministral-3-14B-Instruct
  # ---------------------------------------------------------------------------
  - test_name: serve_ministral3-14b_tp4_c4_rag
    server_parameters:
      model: mistralai/Ministral-3-14B-Instruct-2512-BF16

    # ---------------------------------------------------------------------------
  # Mistral-Small-3.2-24B
  # ---------------------------------------------------------------------------
  - test_name: serve_mistral-small32-24b_tp4_c4_rag
    server_parameters:
      model: mistralai/Mistral-Small-3.2-24B-Instruct-2506

    # ---------------------------------------------------------------------------
  # Granite 4.2 8B FP16
  # ---------------------------------------------------------------------------
  - test_name: serve_granite42-8b_tp4_c4_rag
    server_parameters:
      model: ibm-granite/granite-4.2-8b

  # ---------------------------------------------------------------------------
  # Granite 4.2 8B FP8
  # ---------------------------------------------------------------------------
  - test_name: serve_granite42-8b-fp8_tp4_c4_rag
    server_parameters:
      model: ibm-granite/granite-4.2-8b-fp8
