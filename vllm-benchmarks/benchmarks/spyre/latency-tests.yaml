      model: ibm-granite/granite-3.3-8b-instruct
      tensor_parallel_size: 4
      input-len: 4096
      output-len: 4096
      max-model-len: 8192

  - test_name: latency_granite41-8b_tp1_in1024_out1024
    parameters:
      model: ibm-granite/granite-4.1-8b
      tensor_parallel_size: 1
      input-len: 1024
