# Serve benchmarks for Embedding models on Spyre devices.

defaults:
  server_health_timeout: 1800
  server_parameters:
    load-format: auto
    max-num-seqs: 256
    enable-prefix-caching: false
    tensor-parallel-size: 1
    runner: pooling
    max-model-len: 512
    compilation-config.mode: STOCK_TORCH_COMPILE
  parameters:
    backend: openai-embeddings
    endpoint: /v1/embeddings
    dataset-name: random
    num-prompts: 50000
    random-input-len: 512
    random-range-ratio: 0.5
    num-warmups: 10
  container_parameters:
    container_shm_size: 1G
    container_memory: 16g

tests:

  # ---------------------------------------------------------------------------
  # Granite Embedding 30M English
  # ---------------------------------------------------------------------------
  - test_name: serve_granite-embedding-30m-english_mc4
    server_parameters:
      model: ibm-granite/granite-embedding-30m-english
    parameters:
      max-concurrency: 4

  - test_name: serve_granite-embedding-30m-english_mc16
    server_parameters:
      model: ibm-granite/granite-embedding-30m-english
    parameters:
      max-concurrency: 16

  - test_name: serve_granite-embedding-30m-english_mc32
    server_parameters:
      model: ibm-granite/granite-embedding-30m-english
    parameters:
      max-concurrency: 32

  - test_name: serve_granite-embedding-30m-english_mc64
    server_parameters:
      model: ibm-granite/granite-embedding-30m-english
    parameters:
      max-concurrency: 64

  - test_name: serve_granite-embedding-30m-english_mc256
    server_parameters:
      model: ibm-granite/granite-embedding-30m-english
    parameters:
      max-concurrency: 256

