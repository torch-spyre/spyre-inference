# ---------------------------------------------------------------------------
# Serve benchmarks for Spyre devices using agentic dataset traces
#
# `defaults` holds the settings every test shares; each entry under `tests`
# is merged over it, so a test only spells out what makes it different.
# A test can override any default by setting the same key.
#
# --custom-output-len -1 keeps each record's own `output_tokens`; --ignore-eos
# makes generation run to that length so decode cost is comparable run to run.
# --disable-shuffle replays the trace in its recorded order, which is what makes
# the prefix-cache hit rate reproducible.
#
# --skip-chat-template is not listed here: the trace prompts already carry their
# chat template, and re-applying it would change token counts and the
# prefix-cache hit rate. run_vllm_benchmarks.py always passes it.
#
# SPYRE_DEVICES is derived from tensor-parallel-size, and
# VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS from server_health_timeout, by
# run_vllm_benchmarks.py. Set either explicitly here only to override.
#
# The bench side takes its model from server_parameters, so each test names
# its model once.
#
# dataset-path is an environment variable so each host can point it at its own
# copy of the trace: ${SPYRE_AIOPS_DATASET} for the AIOps trace (_4k entries)
# and ${SPYRE_CICS_DATASET} for the CICS trace (_8k entries), whose first 100
# requests need the larger context. run_vllm_benchmarks.py expands them, falling
# back to the paths on the Spyre benchmark hosts, and skips entries with a
# warning where the file is not present.
#
# max-model-len matches the _4k/_8k suffix: the requests of the trace a test
# replays stay under that many tokens (prompt + output), and longer requests are
# rejected.
#
# num-prompts defaults to 100; the larger models override it downwards to keep
# run time bounded.
# ---------------------------------------------------------------------------

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  server_parameters:
    load-format: auto
    max-num-seqs: 4
    max-num-batched-tokens: 512
    enable-prefix-caching: true
  parameters:
    dataset-name: custom
    num-prompts: 100
    # Keep each record's own output_tokens rather than forcing a fixed length.
    custom-output-len: -1
    ignore-eos: true
    # Replay the recorded order so prefix-cache behaviour is reproducible.
    disable-shuffle: true
    endpoint: /v1/completions
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100
    # Match max-num-seqs and burst so the batch fills without queueing.
    max-concurrency: 4

tests:
  - test_name: serve_granite33-8b_tp1_8k
    server_health_timeout: 1800
    server_parameters:
      model: ibm-granite/granite-3.3-8b-instruct
      tensor-parallel-size: 1
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 100

  - test_name: serve_granite33-8b_tp4_8k
    server_health_timeout: 3600
    server_parameters:
      model: ibm-granite/granite-3.3-8b-instruct
      tensor-parallel-size: 4
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 100

  - test_name: serve_granite41-8b_tp1_8k
    server_health_timeout: 1800
    server_parameters:
      model: ibm-granite/granite-4.1-8b
      tensor-parallel-size: 1
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 100

  - test_name: serve_granite41-8b_tp4_8k
    server_health_timeout: 3600
    server_parameters:
      model: ibm-granite/granite-4.1-8b
      tensor-parallel-size: 4
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 100

  - test_name: serve_granite33-8b-fp8_tp4_4k
    server_health_timeout: 3600
    server_parameters:
      model: ibm-granite/granite-3.3-8b-instruct-FP8
      tensor-parallel-size: 4
      max-model-len: 4096
    parameters:
      dataset-path: ${SPYRE_AIOPS_DATASET}
      num-prompts: 50

  - test_name: serve_granite41-8b-fp8_tp4_4k
    server_health_timeout: 3600
    server_parameters:
      model: ibm-granite/granite-4.1-8b-fp8
      tensor-parallel-size: 4
      max-model-len: 4096
    parameters:
      dataset-path: ${SPYRE_AIOPS_DATASET}
      num-prompts: 50

  - test_name: serve_gemma4-26b-a4b_tp1_8k
    server_health_timeout: 1800
    server_parameters:
      model: google/gemma-4-26B-A4B
      tensor-parallel-size: 1
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 50

  - test_name: serve_gemma4-26b-a4b_tp4_8k
    server_health_timeout: 3600
    server_parameters:
      model: google/gemma-4-26B-A4B
      tensor-parallel-size: 4
      max-model-len: 8192
    parameters:
      dataset-path: ${SPYRE_CICS_DATASET}
      num-prompts: 50
