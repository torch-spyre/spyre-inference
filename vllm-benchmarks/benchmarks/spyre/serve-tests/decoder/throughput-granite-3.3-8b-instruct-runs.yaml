# Throughput benchmarks for ibm-granite/granite-3.3-8b-instruct.
#
# An entry runs in each suite its `labels` name, and every entry runs in the
# exhaustive suite. See vllm-benchmarks/README.md.
#
# in<N>_out<N> is part of the benchmark identity downstream
# (ingest_vllm_benchmarks.py::_parse_input_shapes), so a shape change here
# starts a new trend line.

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  parameters:
    model: ibm-granite/granite-3.3-8b-instruct
    dtype: float16
    load_format: auto

tests:
  - test_name: throughput_granite33-8b_tp1_in64_out64
    labels: [base]
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      tensor_parallel_size: 1
      random-input-len: 64
      random-output-len: 64
      num-prompts: 16
      max-model-len: 128

  - test_name: throughput_granite33-8b_tp1_in1024_out1024
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      dataset-name: random
      random-range-ratio: 0
      max-num-seqs: 4
      tensor_parallel_size: 1
      random-input-len: 1024
      random-output-len: 1024
      num-prompts: 100
      max-model-len: 2048

  - test_name: throughput_granite33-8b_tp1_in4096_out4096
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
    parameters:
      dataset-name: random
      random-range-ratio: 0
      max-num-seqs: 4
      tensor_parallel_size: 1
      random-input-len: 4096
      random-output-len: 4096
      num-prompts: 100
      max-model-len: 8192

  - test_name: throughput_granite33-8b_tp4_in1024_out1024
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3600'
    parameters:
      dataset-name: random
      random-range-ratio: 0
      max-num-seqs: 4
      tensor_parallel_size: 4
      random-input-len: 1024
      random-output-len: 1024
      num-prompts: 100
      max-model-len: 2048

  - test_name: throughput_granite33-8b_tp4_in4096_out4096
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3600'
    parameters:
      dataset-name: random
      random-range-ratio: 0
      max-num-seqs: 4
      tensor_parallel_size: 4
      random-input-len: 4096
      random-output-len: 4096
      num-prompts: 100
      max-model-len: 8192
