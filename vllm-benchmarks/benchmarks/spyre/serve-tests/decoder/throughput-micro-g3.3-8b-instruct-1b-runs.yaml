# Throughput benchmarks for ibm-ai-platform/micro-g3.3-8b-instruct-1b.
#
# An entry runs in each suite its `labels` name, and every entry runs in the
# exhaustive suite. See vllm-benchmarks/README.md.
#
# in<N>_out<N> is part of the benchmark identity downstream
# (ingest_vllm_benchmarks.py::_parse_input_shapes), so a shape change here
# starts a new trend line.

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    tensor_parallel_size: 1
    dtype: float16
    load_format: auto
    random-input-len: 64
    random-output-len: 64
    num-prompts: 16
    max-model-len: 128

tests:
  - test_name: throughput_granite8B_tp1_in64_out64
    labels: [minimal, base]
