# Serve benchmarks for ibm-granite/granite-embedding-125m-english (pooling).
#
# An entry runs in each suite its `labels` name, and every entry runs in the
# exhaustive suite. See vllm-benchmarks/README.md.

defaults:
  server_health_timeout: 1800
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  server_parameters:
    load-format: auto
    max-num-seqs: 4
    max-num-batched-tokens: 512
    enable-prefix-caching: true
    model: ibm-granite/granite-embedding-125m-english
    tensor-parallel-size: 1
    runner: pooling
    dtype: float16
    max-model-len: 512
  parameters:
    dataset-name: random
    num-prompts: 200
    custom-output-len: -1
    ignore-eos: true
    disable-shuffle: true
    endpoint: /v1/embeddings
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100
    max-concurrency: 64
    model: ibm-granite/granite-embedding-125m-english
    backend: openai-embeddings
    random-input-len: 512
    random-range-ratio: 0.5
    random-batch-size: 1
    num-warmups: 8
    request-rate: inf

tests:
  # _ci: 200 random prompts, conc 64.
  - test_name: serve_granite-embedding-125m-english_tp1_conc64_ci
    labels: [base]
