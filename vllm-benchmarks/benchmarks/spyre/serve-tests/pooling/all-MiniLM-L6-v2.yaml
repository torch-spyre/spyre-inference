defaults:
  server_health_timeout: 1800
  environment_variables:
  server_parameters:
    load-format: auto
    max-num-seqs: 8
    enable-prefix-caching: false
    tensor-parallel-size: 1
    runner: pooling
    model: sentence-transformers/all-MiniLM-L6-v2
    max-model-len: 256
  parameters:
    dataset-name: random
    num-prompts: 10000
    random-input-len: 196
    random-range-ratio: 0.3
    num-warmups: 100
    request-rate: inf
    percentile-metrics: e2el
    metric-percentiles: 99,100
    model: sentence-transformers/all-MiniLM-L6-v2
    backend: openai-embeddings
    endpoint: /v1/embeddings
  container_parameters:
    container_shm_size: 1G
    container_memory: 16g

tests:
  - test_name: serve_all-MiniLM-L6-v2_mc16
    parameters:
      max-concurrency: 16

  - test_name: serve_all-MiniLM-L6-v2_mc32
    parameters:
      max-concurrency: 32

  - test_name: serve_all-MiniLM-L6-v2_mc64
    parameters:
      max-concurrency: 64
