defaults:
  server_health_timeout: 1800
  environment_variables:
  server_parameters:
    load-format: auto
    max-num-seqs: 8
    enable-prefix-caching: false
    tensor-parallel-size: 1
    runner: pooling
    model: openai/clip-ViT-base-patch32
    max-model-len: 77
    mm-processor-cache-gb: 0
  parameters:
    percentile-metrics: e2el
    metric-percentiles: 99,100
    model: openai/clip-ViT-base-patch32
    endpoint: /v1/embeddings
    num-prompts: 10000
  container_parameters:
    container_shm_size: 1G
    container_memory: 16g

tests:
  # text embedding benchmarks

  - test_name: serve_clip-ViT-base-patch32_text_mc16
    parameters:
      max-concurrency: 16
      dataset-name: random
      random-input-len: 32
      random-range-ratio: 0.5
      num-warmups: 100
      backend: openai-embeddings

  - test_name: serve_clip-ViT-base-patch32_text_mc32
    parameters:
      max-concurrency: 32
      dataset-name: random
      random-input-len: 32
      random-range-ratio: 0.5
      num-warmups: 100
      backend: openai-embeddings

  - test_name: serve_clip-ViT-base-patch32_text_mc64
    parameters:
      max-concurrency: 64
      dataset-name: random
      random-input-len: 32
      random-range-ratio: 0.5
      num-warmups: 100
      backend: openai-embeddings

  # image embedding benchmarks

  - test_name: serve_clip-ViT-base-patch32_image_mc16
    parameters:
      max-concurrency: 16
      dataset-name: custom_image
      dataset-path: /datasets/random-images-224/random-images-224.jsonl
      custom-ensure-client-side-data: true
      num-warmups: 1000
      backend: openai-embeddings-clip

  - test_name: serve_clip-ViT-base-patch32_image_mc32
    parameters:
      max-concurrency: 32
      dataset-name: custom_image
      dataset-path: /datasets/random-images-224/random-images-224.jsonl
      custom-ensure-client-side-data: true
      num-warmups: 1000
      backend: openai-embeddings-clip

  - test_name: serve_clip-ViT-base-patch32_image_mc64
    parameters:
      max-concurrency: 64
      dataset-name: custom_image
      dataset-path: /datasets/random-images-224/random-images-224.jsonl
      custom-ensure-client-side-data: true
      num-warmups: 1000
      backend: openai-embeddings-clip
