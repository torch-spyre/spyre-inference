defaults:
  server_health_timeout: 1800
  environment_variables:
  server_parameters:
    load-format: auto
    max-num-seqs: 4
    enable-prefix-caching: false
    tensor-parallel-size: 1
    runner: pooling
    model: FacebookAI/roberta-large-mnli
    max-model-len: 512
  parameters:
    dataset-name: random
    num-prompts: 10000
    random-input-len: 512
    random-range-ratio: 0.5
    num-warmups: 100
    request-rate: inf
    percentile-metrics: e2el
    metric-percentiles: 99,100
    model: FacebookAI/roberta-large-mnli
    backend: vllm-pooling
    endpoint: /pooling
  container_parameters:
    container_shm_size: 1G
    container_memory: 16g

tests:
  - test_name: serve_roberta-large-mnli_mc16
    parameters:
      max-concurrency: 16

  - test_name: serve_roberta-large-mnli_mc32
    parameters:
      max-concurrency: 32

  - test_name: serve_roberta-large-mnli_mc64
    parameters:
      max-concurrency: 64
