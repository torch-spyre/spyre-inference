defaults:
  server_health_timeout: 1800
  environment_variables:
  server_parameters:
    load-format: auto
    max-num-seqs: 4
    max-num-batched-tokens: 512
    enable-prefix-caching: false
  parameters:
    dataset-name: random
    num-prompts: 10000
    random-input-len: 512
    random-range-ratio: 0.5
    num-warmups: 100
    request-rate: inf
    percentile-metrics: e2el
    metric-percentiles: 99,100

tests:
  - test_name: serve_roberta-large-mnli_mc16
    server_parameters:
      model: FacebookAI/roberta-large-mnli
      tensor-parallel-size: 1
      runner: pooling
      max-model-len: 512
    parameters:
      model: FacebookAI/roberta-large-mnli
      backend: vllm-pooling
      endpoint: /pooling
      max-concurrency: 16

  - test_name: serve_roberta-large-mnli_mc32
    server_parameters:
      model: FacebookAI/roberta-large-mnli
      tensor-parallel-size: 1
      runner: pooling
      max-model-len: 512
    parameters:
      model: FacebookAI/roberta-large-mnli
      backend: vllm-pooling
      endpoint: /pooling
      max-concurrency: 32

  - test_name: serve_roberta-large-mnli_mc64
    server_parameters:
      model: FacebookAI/roberta-large-mnli
      tensor-parallel-size: 1
      runner: pooling
      max-model-len: 512
    parameters:
      model: FacebookAI/roberta-large-mnli
      backend: vllm-pooling
      endpoint: /pooling
      max-concurrency: 64
