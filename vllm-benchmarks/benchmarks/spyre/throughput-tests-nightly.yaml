# Nightly bench route (BENCH_SUITE=nightly): the CI throughput entries, unchanged. Parameters must equal throughput-tests.yaml
# (.github/scripts/test_bench_nightly.py); the ids come from benchmarks/decoder/.
- test_name: throughput_granite8B_tp1_in64_out64
  environment_variables:
    DTLOG_LEVEL: error
    SPYRE_DEVICES: '0'
  parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    tensor_parallel_size: 1
    dtype: float16
    load_format: auto
    random-input-len: 64
    random-output-len: 64
    num-prompts: 16
    max-model-len: 128
- test_name: throughput_granite33-8b_tp1_in64_out64
  environment_variables:
    DTLOG_LEVEL: error
    SPYRE_DEVICES: '0'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  parameters:
    model: ibm-granite/granite-3.3-8b-instruct
    tensor_parallel_size: 1
    dtype: float16
    load_format: auto
    random-input-len: 64
    random-output-len: 64
    num-prompts: 16
    max-model-len: 128
