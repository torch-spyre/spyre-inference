# Throughput benchmarks for Spyre devices, at the shapes the agentic traces show.
#
# Each entry under `tests` is merged over `defaults` and can override any key.
#
# `vllm bench throughput` cannot replay the traces the serve benchmarks use: its
# --dataset-name rejects `custom`, the choice serve replays them through. So
# these entries approximate them instead -- same models, same max-model-len,
# random-input/output lengths at the median of each trace's replayed window,
# over the same number of prompts serve replays:
#
#   aiops (4k):  prompt p50 1476 -> in1536,  output p50 48  -> out64,  50 prompts
#   cics  (8k):  prompt p50 4053 -> in4096,  output p50 573 -> out576, 100 prompts
#
# random-input-len is 128-aligned so each prompt fills a whole number of KV
# blocks. random-range-ratio is 0, so every prompt gets exactly that length: the
# length spread is what the serve benchmarks measure.
#
# The trailing suffix names the trace whose shape an entry approximates, and
# in<N>_out<N> is part of the benchmark identity downstream
# (ingest_vllm_benchmarks.py::_parse_input_shapes), so a shape change here
# starts a new trend line rather than bending the old one.

defaults:
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  parameters:
    dtype: float16
    load_format: auto
    dataset-name: random
    random-range-ratio: 0
    max-num-seqs: 4

tests:
  - test_name: throughput_granite8B_tp1_in64_out64_smoke
    environment_variables:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '600'
    parameters:
      model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
      tensor_parallel_size: 1
      random-input-len: 64
      random-output-len: 64
      num-prompts: 16
      max-model-len: 128

  - test_name: throughput_granite33-8b_tp1_in4096_out576_cics
    parameters:
      model: ibm-granite/granite-3.3-8b-instruct
      tensor_parallel_size: 1
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 100
      max-model-len: 8192

  - test_name: throughput_granite33-8b_tp4_in4096_out576_cics
    parameters:
      model: ibm-granite/granite-3.3-8b-instruct
      tensor_parallel_size: 4
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 100
      max-model-len: 8192

  - test_name: throughput_granite41-8b_tp1_in4096_out576_cics
    parameters:
      model: ibm-granite/granite-4.1-8b
      tensor_parallel_size: 1
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 100
      max-model-len: 8192

  - test_name: throughput_granite41-8b_tp4_in4096_out576_cics
    parameters:
      model: ibm-granite/granite-4.1-8b
      tensor_parallel_size: 4
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 100
      max-model-len: 8192

  - test_name: throughput_granite33-8b-fp8_tp4_in1536_out64_aiops
    parameters:
      model: ibm-granite/granite-3.3-8b-instruct-FP8
      tensor_parallel_size: 4
      random-input-len: 1536
      random-output-len: 64
      num-prompts: 50
      max-model-len: 4096

  - test_name: throughput_granite41-8b-fp8_tp4_in1536_out64_aiops
    parameters:
      model: ibm-granite/granite-4.1-8b-fp8
      tensor_parallel_size: 4
      random-input-len: 1536
      random-output-len: 64
      num-prompts: 50
      max-model-len: 4096

  - test_name: throughput_gemma4-26b-a4b_tp1_in4096_out576_cics
    parameters:
      model: google/gemma-4-26B-A4B
      tensor_parallel_size: 1
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 50
      max-model-len: 8192

  - test_name: throughput_gemma4-26b-a4b_tp4_in4096_out576_cics
    parameters:
      model: google/gemma-4-26B-A4B
      tensor_parallel_size: 4
      random-input-len: 4096
      random-output-len: 576
      num-prompts: 50
      max-model-len: 8192
